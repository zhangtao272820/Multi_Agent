    pc_thought: "收起表演。用行动证明——观察期比情话长。"
    brief: "递花材考验；学会照顾才开门。等你收起表演、用行动证明或约旁听规则。"
    summary: "递花材考验；学会照顾才开门。等你收起表演、用行动证明或约旁听规则。"
