- id: b2
  narration: 你问起「前妻」二字，她手一顿：那是别人的标题——她要的是重新开花的权利。花茎切口还渗着水。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。空气有点静，连呼吸都听得见。
  pc_thought: 别翻旧账。我想认识现在的她，不是档案里的那个称呼。我想靠近，又怕说错一句。
  brief: 被「前妻」刺到；要重新开花的权利。等他问近况、说不翻旧账或安静陪着。
  summary: 被「前妻」刺到；要重新开花的权利。等他问近况、说不翻旧账或安静陪着。
