- id: b3
  narration: 她递给你一支备用花材：先学会照顾活的东西，再谈要不要靠近她的温室。花茎切口还渗着水。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。空气有点静，连呼吸都听得见。
