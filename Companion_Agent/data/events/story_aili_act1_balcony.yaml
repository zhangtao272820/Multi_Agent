beats:
- id: b1
  narration: 花店阳台风干花束轻晃。她修剪茎秆，动作很稳，像在整理旧婚书里未说完的句子。账本边压着老金送来的进货单，边上还夹着几根没卖完的枯枝。花茎切口还渗着水。她没再多说，只是看着你。
  pc_thought: 旧婚书的影子还在。我是新选择，不是替补。我想靠近，又怕说错一句。
  brief: 阳台修剪花茎；旧痕未说完。等他打招呼、夸花或问方不方便。
  summary: 阳台修剪花茎；旧痕未说完。等他打招呼、夸花或问方不方便。
  sprite_hint:
  - bouquet_wrap
  - home
  - card_write
  - casual
  - season_winter
  - home_eating
  - home_sleeping
  soft_options:
  - 先打招呼
  - 夸花好看
  - 问方不方便
