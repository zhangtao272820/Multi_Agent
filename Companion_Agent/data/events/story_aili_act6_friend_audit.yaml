id: story_aili_act6_friend_audit
label: 闺蜜审核夜
priority: 8
once: true
chance: 1.0
scene_id: ""
trigger:
  character_ids: [aili]
  stage_min: crush
  affinity_min: 84
  flags_present: [al_choose_again]
  flags_absent: [al_friend_audit]
prompt_snippet: |
  【专属故事 · 旧婚书与新花束 · 第6幕 · 闺蜜审核夜】
advance: on_player_turn
beats:
  - id: b1
    narration: "艾辰站在温室门口，挡住花香：靠近姐姐的人先过她这关，夸花不算分。"
    pc_thought: "艾辰像审核官。我答得诚实吗？还是只会夸花？"
    brief: "艾辰堵门审核；夸花不算分。等他让座、护花架或请她改口。"
    summary: "艾辰堵门审核；夸花不算分。等他让座、护花架或请她改口。"
    sprite_hint: [greenhouse_mist, casual, work, home]
    soft_options: ["让花友坐下", "先护花架", "请花友改口"]
  - id: b2
    narration: "艾黎修剪枯枝，花泥里埋着离婚后的沉默。她说怕再被辜负，剪子却很稳。"
    pc_thought: "听懂她的怕，不是用甜话盖过去。我能不能停——若她要停？"
    brief: "剪枯枝坦白怕辜负。等他听懂、问要不要停或帮倒水。"
    summary: "剪枯枝坦白怕辜负。等他听懂、问要不要停或帮倒水。"
    sprite_hint: [bouquet_wrap, home, casual]
    soft_options: ["说我听得懂", "问她要不要停", "帮她倒水"]
  - id: b3
    narration: "审核与真心同时落槌。留下处理账单与枯枝，或礼貌退回客人位置——温室灯忽然很亮。"
    pc_thought: "留下不是复合回档。退回客人，又像承认我只是路过的花客。"
    brief: "二选一：留下扛账单枯枝，或退回客人。危机落槌。"
    summary: "二选一：留下扛账单枯枝，或退回客人。危机落槌。"
    sprite_hint: [intimate_lounge, season_winter, date, casual, home]
    soft_options: ["承认我也怕闲话", "约好只谈花", "说别再审她"]
rewards:
  flags_set: [al_friend_audit]
choice_effects:
  - { trust_delta: 3, affinity_delta: 4 }
  - { trust_delta: 2, affinity_delta: 2 }
  - { trust_delta: -2, affinity_delta: -2 }
