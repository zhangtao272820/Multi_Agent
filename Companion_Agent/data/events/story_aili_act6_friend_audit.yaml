beats:
- id: b1
  narration: 艾辰站在温室门口，挡住花香：靠近姐姐的人先过她这关，夸花不算分。花茎切口还渗着水。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。空气有点静，连呼吸都听得见。
  pc_thought: 艾辰像审核官。我答得诚实吗？还是只会夸花？我想靠近，又怕说错一句。
  brief: 艾辰堵门审核；夸花不算分。等他让座、护花架或请她改口。
  summary: 艾辰堵门审核；夸花不算分。等他让座、护花架或请她改口。
  sprite_hint:
  - bouquet_wrap
  - greenhouse_mist
  - intimate_lounge
  - home
  - season_winter
  - casual
  - home_eating
  - home_sleeping
  soft_options:
