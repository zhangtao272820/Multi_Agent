- id: b2
  narration: 艾黎修剪枯枝，花泥里埋着离婚后的沉默。她说怕再被辜负，剪子却很稳。花茎切口还渗着水。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。空气有点静，连呼吸都听得见。
  pc_thought: 听懂她的怕，不是用甜话盖过去。我能不能停——若她要停？我想靠近，又怕说错一句。
  brief: 剪枯枝坦白怕辜负。等他听懂、问要不要停或帮倒水。
  summary: 剪枯枝坦白怕辜负。等他听懂、问要不要停或帮倒水。
