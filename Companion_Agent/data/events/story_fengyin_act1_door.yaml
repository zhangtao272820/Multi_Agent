id: story_fengyin_act1_door
label: 敲门
priority: 5
once: true
chance: 1.0
scene_id: ""
trigger:
  character_ids: [fengyin]
  stage_min: friend
  affinity_min: 55
  flags_absent: [fy_knock]
prompt_snippet: |
  【专属故事 · 同居屋檐下 · 第1幕 · 敲门】
advance: on_player_turn
beats:
  - id: b1
    narration: "你停在她半掩房门外；游戏音响着，她没立刻应门。走廊薄墙那侧，书璃房的夜灯似乎亮了一下又暗。"
    pc_thought: "先敲门才是喜欢。不敲，就只是同屋檐的室友——隔墙有没有人听？"
    brief: "半掩门外游戏响；她不立刻应。等你再敲、隔门说一句或先走开。"
    summary: "半掩门外游戏响；她不立刻应。等你再敲、隔门说一句或先走开。"
    sprite_hint: [home, casual]
    soft_options: ["再敲一声", "隔门说一句", "先走开"]
  - id: b2
    narration: "门开一条缝。她抱着耳机：私人空间要被尊重——门轴吱呀一声，像提醒全屋都听得见。"
    pc_thought: "道歉并问方便吗。说明来意时，别把钥匙当通行证。"
    brief: "门缝强调私人空间。等你道歉问方便、说明来意或退一步等她开门。"
    summary: "门缝强调私人空间。等你道歉问方便、说明来意或退一步等她开门。"
    sprite_hint: [home, casual, home_sleeping]
    soft_options: ["道歉并问方便吗", "说明来意", "退一步等她开门"]
  - id: b3
    narration: "她靠着门框松口：可以一起做饭或开黑——前提是先敲门。隔壁似乎有脚步停了一拍，又走开了。"
    pc_thought: "春檐下她等我敲门——我别用钥匙直接推。书璃那边，我装没听见。"
    brief: "松口可做饭开黑；须先敲门。等你提议做饭、约游戏或今晚各自安静。"
    summary: "松口可做饭开黑；须先敲门。等你提议做饭、约游戏或今晚各自安静。"
    sprite_hint: [home, casual]
    soft_options: ["提议一起做饭", "约一局游戏", "今晚各自安静"]
rewards:
  flags_set: [fy_knock, fengyin_cooking_done]
choice_effects:
  - { trust_delta: 3, affinity_delta: 3 }
  - { trust_delta: 2, affinity_delta: 2 }
  - { trust_delta: -2, affinity_delta: -1 }
