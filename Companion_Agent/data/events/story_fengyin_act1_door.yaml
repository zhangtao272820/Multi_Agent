- id: b1
  narration: 你停在她半掩房门外；游戏音响着，她没立刻应门。走廊薄墙那侧，书璃房的夜灯似乎亮了一下又暗。隔墙还亮着灯，大概是书璃。楼道感应灯闪了闪，又灭了
  pc_thought: 先敲门才是喜欢。不敲，就只是同屋檐的室友——隔墙有没有人听？
  brief: 半掩门外游戏响；她不立刻应。等你再敲、隔门说一句或先走开。
  summary: 半掩门外游戏响；她不立刻应。等你再敲、隔门说一句或先走开。
  sprite_hint:
  - home
  - casual
  - school
  - work
  soft_options:
  - 再敲一声
  - 隔门说一句
  - 先走开
