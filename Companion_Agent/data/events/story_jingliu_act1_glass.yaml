- id: b2
  narration: 电梯里只剩两人。她摘下耳机，忽然问你周末有没有空——不像上司，像试探。静宁在边上翻过一页笔记。走廊尽头有人低头看手机，像不经意。工牌边缘硌了一下手指。她没再多说，只是看着你。
  pc_thought: 面具摘了半寸。我想看全，又怕被职场反噬。我想靠近，又怕说错一句。
  brief: 电梯问周末有没有空；试探私人边界。等他给空档、推脱或反问用意。
