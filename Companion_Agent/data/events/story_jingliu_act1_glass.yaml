- id: b3
  narration: 便利店灯下她买黑咖啡，笑说「别跟同事说我也会饿」——面具裂开一道细缝。工牌边缘硌了一下手指。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。空气有点静，连呼吸都听得见。
  pc_thought: 这句别传出去。我是共犯，还是只想再看她裂开的那一寸？我想靠近，又怕说错一句。
