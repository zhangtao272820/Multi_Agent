- id: b1
  narration: 玻璃隔间里她站着听汇报，指尖点平板，语速冷而准——散会后却多看了你一眼。工牌边缘硌了一下手指。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。空气有点静，连呼吸都听得见。
  pc_thought: 玻璃门里她是上司。门一关，我还站不站得住？我想靠近，又怕说错一句。
  brief: 汇报语速冷准；散会多看一眼。等他跟议程、会后确认或注意疲态。
  summary: 汇报语速冷准；散会多看一眼。等他跟议程、会后确认或注意疲态。
