- id: b1
  summary: 天台夜风掀起她的外套；城市灯火在脚下，她却说这里才像能喘气的办公室。等你回应。
  sprite_hint:
  - rooftop_night
  - phone_brief
  - moodboard_pin
  - date
  - season_winter
  - home_eating
  - home_sleeping
  soft_options:
  - 把外套给她
  - 并排不说话
  - 问今天哪里最累
  narration: 天台夜风掀起她的外套；城市灯火在脚下，她却说这里才像能喘气的办公室。工牌边缘硌了一下手指。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。空气有点静，连呼吸都听得见。
  pc_thought: 玻璃门里她是上司。门一关，我还站不站得住？——想起天台。我想靠近，又怕说错一句。
  brief: 天台夜风掀起她的外套；城市灯火在脚下，她却说这里才像能喘气的办公室。等你回应。
