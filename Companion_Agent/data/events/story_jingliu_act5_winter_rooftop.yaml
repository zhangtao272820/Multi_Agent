  narration: 入冬的天台风更大；她把大衣领竖起，工牌仍别在内侧——权力差被冷风吹薄一层。工牌边缘硌了一下手指。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。空气有点静，连呼吸都听得见。
  pc_thought: 玻璃门里她是上司。门一关，我还站不站得住？——想起天台。我想靠近，又怕说错一句。
