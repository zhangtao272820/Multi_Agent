prompt_snippet: '【专属故事 · 婚后 · 玻璃门后的晨光】

  孕期居家；立绘优先 maternity。

  '
advance: on_player_turn
beats:
- id: b1
  summary: 她卸下职场面具，靠在窗边，说会议室的议程里没有「孕吐」这一项，却必须排进你们的家。等你回应。
  sprite_hint:
  - maternity
  - home
  - casual
  soft_options:
  - 把窗帘调暗
  - 问她要不要躺下
  - 替她回一封非紧急邮件
  narration: 玻璃反光淡了，她卸下职场面具，靠在窗边，说会议室的议程里没有「孕吐」这一项，却必须排进你们的家。工牌边缘硌了一下手指。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 成熟妻子线忽然很轻——轻到只剩体温和呼吸。我想靠近，又怕说错一句。
  brief: 她说议程里没有孕吐，却必须排进家。等你回应。
  pages:
  - text: 玻璃反光淡了，她卸下职场面具，靠在窗边，说会议室的议程里没有「孕吐」这一项，却必须排进你们的家。工牌边缘硌了一下手指。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
