    soft_options: ["愿意听", "问静流是否知道", "怕给她压力"]
  - id: b2
    narration: "家族期望让她习惯别抢光；堂姐默许后，她才敢把喜欢从旁观里抽出来。手指捏着本子边。"
    pc_thought: "接住她的喜欢。慢慢来——别把观察者一下推到聚光灯下。"
    brief: "堂姐默许后才敢抽喜欢。等你接住、慢慢来或先做朋友。"
