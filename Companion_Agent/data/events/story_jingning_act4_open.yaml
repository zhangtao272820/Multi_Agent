    narration: "日记末页空白。观察者放下笔，站到光里——她没要你立刻牵很久，只伸了一下又松开。"
    pc_thought: "夸她勇敢。约非活动的见面，才算把她从旁观席拉出来。"
    brief: "空白页落章；站到光里。等你轻牵、约非活动见面或夸勇敢。"
    summary: "空白页落章；站到光里。等你轻牵、约非活动见面或夸勇敢。"
