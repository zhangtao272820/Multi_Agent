  - 接受书面提醒
  pages:
  - text: 她说明伦理：迷恋可以，越界不行。是为了保护若铃，也保护你别毁了课。名单页折了一道痕。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
    voice: narration
