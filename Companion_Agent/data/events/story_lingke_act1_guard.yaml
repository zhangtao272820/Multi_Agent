    voice: pc
    sprite:
      outfit: lecture_assist
      emotion: shy
- id: b2
  narration: 她说明伦理：迷恋可以，越界不行。是为了保护若铃，也保护你别毁了课。名单页折了一道痕。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 通行证不是免罪金牌。师生线一松，闲话就来。我想靠近，又怕说错一句。
  brief: 伦理：迷恋可越界不行。等你承诺守界、问红线或接受书面提醒。
  summary: 伦理：迷恋可越界不行。等你承诺守界、问红线或接受书面提醒。
