- id: b1
  narration: 办公室门口她拦下你：顾老师的答疑有名单——越线的关心，她会用红笔先挡。文件夹抱在胸前。名单页折了一道痕。她没再多说，只是看着你。
  pc_thought: 红笔在她手里。边界是护若铃，也是在考我。我想靠近，又怕说错一句。
  brief: 门口拦人；红笔挡越线关心。等你说明来意、预约正规答疑或承认太随便。
  summary: 门口拦人；红笔挡越线关心。等你说明来意、预约正规答疑或承认太随便。
  sprite_hint:
  - lecture_assist
  - ta_office
  - work
  - casual
  - season_winter
  - home_eating
  soft_options:
  - 说明来意
  - 预约正规答疑
  - 承认曾太随便
  pages:
  - text: 办公室门口她拦下你：顾老师的答疑有名单——越线的关心，她会用红笔先挡。文件夹抱在胸前。名单页折了一道痕。她没再多说，只是看着你。
    voice: narration
