- id: b3
  narration: 走廊里她给你一份须知并落章。守规则的人，才有资格谈对等——若铃真结局门从此可开。名单页折了一道痕。她没再多说，只是看着你。
  pc_thought: 答应不越线。道谢她护老师——我也在被护着别踩雷
  brief: 须知落章；守规则才谈对等。等你答应不越线、道谢或改走正规渠道。
