- id: b3
  narration: 你帮她对齐页码时，她耳尖发红：第一次有人把实习的慌张当成值得认真对待的事。表格最后一行数字还没填完。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 专业距离最安全。接过忙，又像跨出工位之间那一步。我想靠近，又怕说错一句。
