- id: b1
  narration: 工位隔板后她探头问报表。红丝带松了一点，紧张却仍写在坐直的脊背上。表格最后一行数字还没填完。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。空气有点静，连呼吸都听得见。
  pc_thought: 对桌探头那一下，像实习期的心跳漏拍。我想靠近，又怕说错一句。
  brief: 探头问报表；逞强坐直。等他分摊、夸效率或别拆穿逞强。
  summary: 探头问报表；逞强坐直。等他分摊、夸效率或别拆穿逞强。
  sprite_hint:
  - desk_papers
  - cubicle_bento
  - binder_clip
  - work
  - season_winter
  - home_eating
  - home_sleeping
  soft_options:
  - 问要不要分一半
  - 夸她效率
  - 先别拆穿逞强
  pages:
