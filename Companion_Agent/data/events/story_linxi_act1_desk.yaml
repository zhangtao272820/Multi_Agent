- id: b2
  narration: 打印室灯管闪烁。她抱着纸堆说「对不起占道」——道歉多过呼吸，像怕成为麻烦。赵组路过，在门框上敲了两下：「表还在，人先别倒。」。表格最后一行数字还没填完。她没再多说，只是看着你。
  pc_thought: 道歉太多了。我想让她喘口气，又不想显得像前辈施舍。我想靠近，又怕说错一句。
  brief: 抱纸堆连声道歉；怕成麻烦。等他让路、帮忙或说笑松绑。
  summary: 抱纸堆连声道歉；怕成麻烦。等他让路、帮忙或说笑松绑。
