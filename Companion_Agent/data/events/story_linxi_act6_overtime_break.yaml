  narration: 凌晨打印室纸张堆成墙。她红丝带松了，声音发哑：自己不是临时工配件。表格最后一行数字还没填完。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。空气有点静，连呼吸都听得见。
  pc_thought: 加班决裂的纸堆像墙。扶住她，还是成全她的逞强？我想靠近，又怕说错一句。
  brief: 纸堆塌方；否认临时工配件。等他关电脑、倒水或喊停加班。
  summary: 纸堆塌方；否认临时工配件。等他关电脑、倒水或喊停加班。
