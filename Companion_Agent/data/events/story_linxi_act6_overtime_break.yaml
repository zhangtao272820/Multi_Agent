    narration: "凌晨打印室纸张堆成墙。她红丝带松了，声音发哑：自己不是临时工配件。"
    pc_thought: "加班决裂的纸堆像墙。扶住她，还是成全她的逞强？"
    brief: "纸堆塌方；否认临时工配件。等他关电脑、倒水或喊停加班。"
    summary: "纸堆塌方；否认临时工配件。等他关电脑、倒水或喊停加班。"
    sprite_hint: [print_stack, work, casual, home]
    soft_options: ["关电脑", "倒热水", "先说加班到点"]
  - id: b2
    narration: "你若只劝她撑住，她会笑着崩溃；若肯一起担责，她才敢卸下实习生壳。"
    pc_thought: "别用忙躲我——这话也刺我。并肩担责，才不是拯救剧本。"
    brief: "撑住会崩溃；并肩担责才卸壳。等他别躲、列优先级或下楼透气。"
    summary: "撑住会崩溃；并肩担责才卸壳。等他别躲、列优先级或下楼透气。"
    sprite_hint: [desk_papers, work_working_focus, home, casual]
    soft_options: ["说别用忙躲我", "帮她列优先级", "约下楼透气"]
  - id: b3
    narration: "她把工牌翻面，灯管嗡嗡响：要的是并肩，不是被拯救的故事。"
    pc_thought: "承诺不催进度。问她真正怕什么——我等得起吗？"
    brief: "工牌翻面；要并肩不要被拯救。等他承诺、问怕什么或说等得起。"
    summary: "工牌翻面；要并肩不要被拯救。等他承诺、问怕什么或说等得起。"
    sprite_hint: [home_sleeping, season_winter, date, casual, home]
    soft_options: ["承诺不催进度", "问她真正怕什么", "说我等得起"]
