  summary: 工位灯关了，她把工牌摘下，说加班可以砍，孕检不行；这页日程不许被邮件淹没。等你回应。
  sprite_hint:
  - maternity
  - home
  - casual
  soft_options:
  - 帮她挂好外套
  - 问她饿不饿
