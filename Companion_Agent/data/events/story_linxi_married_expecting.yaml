  narration: 键盘声停了，工位灯关了，她把工牌摘下，说加班可以砍，孕检不行；这页日程不许被邮件淹没。表格最后一行数字还没填完。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 末班车之外，是愿意被你接住的妻子。我想靠近，又怕说错一句。
