- id: b1
  narration: 展会灯下她把徽章推过来：买谷可以，交朋友另算。假发微偏，笑却很满。摊位帘布蹭过手背。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 摊位笑很满。戏言契约当真时，我会不会退缩？我想靠近，又怕说错一句。
  brief: 买谷与交朋友分开算。等他买谷并交友、只交友或问徽章含义。
  summary: 买谷与交朋友分开算。等他买谷并交友、只交友或问徽章含义。
