- id: b2
  narration: 她竖起三根手指讲「星约」规矩，语气像开玩笑，眼神却在等你说算数。她刚掀假发，店铃响了一下。门口风灌进来，胶水味散开一点。摊位帘布蹭过手背。她没再多说，只是看着你。
  pc_thought: 缝纫针脚比誓言稳。我想帮她缝，不是只收谷子。我想靠近，又怕说错一句。
  brief: 戏言讲星约规矩；等算数。等他说算数、追问规则或先问清规矩。
