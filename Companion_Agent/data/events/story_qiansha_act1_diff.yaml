- id: b2
  narration: 她把卫衣帽子拉低：不是来挖坑，就别碰那几行红的。diff里旧伤像未关的issue。耳机麦还开着静音。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: debug到深夜，像把分手理由一行行编译。我想靠近，又怕说错一句。
  brief: 警告别碰旧伤行；非挖坑。等他道歉、说不是挖坑或请求复盘。
