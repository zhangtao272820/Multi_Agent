  narration: 双屏蓝光里弹出熟悉的头像。旧PR标题还开着——分手归档后第一次面对面，键盘声忽然停。评审会上赵组说「改动要干净」。她手指在键盘边停了一下。耳机麦还开着静音。
  pc_thought: 旧PR还开着。Merge还是Close——我别当版本控制器
  brief: 旧 PR 重逢；尴尬落地。等他承认尴尬、先谈工作或问能否重新认识。
