id: story_qiansha_act3_merge
label: Merge
priority: 7
once: true
chance: 1.0
scene_id: ''
trigger:
  character_ids:
  - qiansha
  stage_min: crush
  affinity_min: 82
  flags_absent:
  - qs_merge
  flags_present:
  - qs_debug_us
prompt_snippet: |
  【专属故事 · 旧 PR 与新分支 · 第3幕 · Merge】
advance: on_player_turn
beats:
- id: b1
  summary: "上线夜她盯着进度条：合并很危险，但一直 fork 更累。等你回应。"
  sprite_hint:
  - deploy_watch
  - work
  - season_winter
  - home_eating
  - home_sleeping
  soft_options:
  - 问她倾向
  - 说你愿意进主线
  - 尊重她保留分支
  narration: "显示器蓝光与键盘声里，上线夜她盯着进度条：合并很危险，但一直 fork 更累。"
  pc_thought: 旧 PR 还开着。Merge 还是 Close——我别当版本控制器。
  brief: "上线夜她盯着进度条：合并很危险，但一直 fork 更累。等你回应。"
- id: b2
  summary: "她明确：和解不是回档旧恋爱，是新开版本号。等你回应。"
  sprite_hint:
  - dual_monitor
  - date
  - season_winter
  - home_eating
  - home_sleeping
  soft_options:
  - 同意新版本
  - 谈规则与边界
  - 否认只想复合快感
  narration: "显示器蓝光与键盘声里，她明确：和解不是回档旧恋爱，是新开版本号。"
  pc_thought: debug 到深夜，像把分手理由一行行编译。
  brief: "她明确：和解不是回档旧恋爱，是新开版本号。等你回应。"
- id: b3
  summary: "Merge 键前她问：这次冲突来了，你会不会又静默离开？。等你回应。"
  sprite_hint:
  - date
  - home
  - season_winter
  - home_eating
  - home_sleeping
  soft_options:
  - 承诺留下对谈
  - 坦白喜欢并负责
  - 接受观察仍继续
  narration: "显示器蓝光与键盘声里，Merge 键前她问：这次冲突来了，你会不会又静默离开？"
  pc_thought: 脏 diff 里藏着没说完的话。我敢不敢 review？
  brief: "Merge 键前她问：这次冲突来了，你会不会又静默离开？。等你回应。"
- id: b4
  summary: 绿灯亮起；她碰你的指节——主线合并，注释写「我们」。等你回应。
  sprite_hint:
  - date
  - casual
  - season_winter
  - home_eating
  - home_sleeping
  soft_options:
  - 回握
  - 约庆祝但不喧哗
  - 说「已合并」
  narration: 显示器蓝光与键盘声里，绿灯亮起；她碰你的指节——主线合并，注释写「我们」。
  pc_thought: 新年 PR 标题很甜。落地还是 revert？
  brief: 绿灯亮起；她碰你的指节——主线合并，注释写「我们」。等你回应。
rewards:
  flags_set:
  - qs_merge
  - confessed
  - reconciliation_done
choice_effects:
- trust_delta: 3
  affinity_delta: 3
- trust_delta: 2
  affinity_delta: 2
- trust_delta: -2
  affinity_delta: -1
