prompt_snippet: |
  【专属故事 · 旧 PR 与新分支 · 第4幕 · 脏 Diff】
advance: on_player_turn
beats:
  - id: b1
    narration: "告警红成一片。脏 diff 里混着旧 commit 与新依赖——她手抖着点回滚日志，咖啡凉了。"
    pc_thought: "脏 diff 里藏着没说完的话。我敢不敢 review？"
    brief: "脏 diff 告警；手抖看回滚。等他帮看日志、倒水不催或说不该掺和。"
    summary: "脏 diff 告警；手抖看回滚。等他帮看日志、倒水不催或说不该掺和。"
    sprite_hint: [dual_monitor, work, casual, home]
    soft_options: ["帮她看回滚日志", "先倒杯水别催", "说你不该掺和"]
  - id: b2
    narration: "她忽然抬眼：你是看热闹，还是因为认识艾莉圈才来？问题像 code review 的 blocker。"
    pc_thought: "主线只有一条。我是 feature，还是 breaking change？"
    brief: "质问看热闹还是因艾莉圈。等他澄清、承认认识圈或先关告警再说。"
    summary: "质问看热闹还是因艾莉圈。等他澄清、承认认识圈或先关告警再说。"
    sprite_hint: [debug_mug, work, casual, home]
    soft_options: ["说不是看热闹", "承认认识艾莉圈", "先把告警关掉再说"]
  - id: b3
    narration: "Merge 按钮亮着。点下去像重开主线；关闭 PR 像再归档一次分手。她把选择权推到你面前。"
    pc_thought: "新年 PR 标题很甜。落地还是 revert？——此刻更烫。"
    brief: "Merge / 缓一缓 / 关闭 PR。危机落槌。"
    summary: "Merge / 缓一缓 / 关闭 PR。危机落槌。"
    sprite_hint: [season_winter, date, home, casual]
    soft_options: ["点 merge", "先缓一缓", "关闭 PR"]
rewards:
