  narration: 讲台上粉笔灰落在袖口。她点名提问，目光在你身上多停半秒，像不小心泄露一点偏爱。门边贴着铃可的答疑名单，红笔勾得很清楚。红笔帽扣得严严实实。她没再多说，只是看着你。
  pc_thought: 粉笔灰落在袖口。我想叫她名字，又怕越界。我想靠近，又怕说错一句。
  brief: 点名目光多停半秒；偏爱泄露。等他认真答、课后留问或先记笔记。
