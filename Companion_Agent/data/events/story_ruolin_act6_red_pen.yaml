  narration: 铃可堵在办公室门口，红笔还没放下：谁都不许把「老师」消费成恋人剧本。红笔帽扣得严严实实。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。空气有点静，连呼吸都听得见。
  pc_thought: 红笔在门口——闲话比心动更快。我护不护这道线？我想靠近，又怕说错一句。
  brief: 铃可堵门护边界；红笔未放。等他站身侧、让学生走或先收笔。
  summary: 铃可堵门护边界；红笔未放。等他站身侧、让学生走或先收笔。
