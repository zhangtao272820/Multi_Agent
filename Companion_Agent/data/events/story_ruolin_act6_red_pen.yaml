    narration: "铃可堵在办公室门口，红笔还没放下：谁都不许把「老师」消费成恋人剧本。"
    pc_thought: "红笔在门口——闲话比心动更快。我护不护这道线？"
    brief: "铃可堵门护边界；红笔未放。等他站身侧、让学生走或先收笔。"
    summary: "铃可堵门护边界；红笔未放。等他站身侧、让学生走或先收笔。"
    sprite_hint: [office_hours, work, casual, home]
    soft_options: ["站到她身侧", "让学生先走", "先收红笔"]
  - id: b2
    narration: "若铃摘下眼镜。她怕重演年轻时的暧昧灾难，也怕你只想要讲台下的反差。"
    pc_thought: "边界我说守得住吗？公开身份像把她推上闲话的刀口。"
    brief: "摘镜坦白怕重演灾难与反差消费。等他守边界、问怕什么或提公开。"
    summary: "摘镜坦白怕重演灾难与反差消费。等他守边界、问怕什么或提公开。"
    sprite_hint: [lecture_pointer, work, home, casual]
    soft_options: ["说边界我守", "问她怕什么", "提议公开身份"]
  - id: b3
    narration: "助教门禁的影子还在玻璃上。对等之名要经得起这关——过关才准牵手，否则退回师生礼貌。"
    pc_thought: "接过红笔像接过责任。退回礼貌，又像辜负她摘镜的勇气。"
    brief: "对等须过助教门禁。等他接红笔、说别怕闲话，或请她先吃饭。"
    summary: "对等须过助教门禁。等他接红笔、说别怕闲话，或请她先吃饭。"
    sprite_hint: [intimate_lounge, season_winter, date, casual, home]
