  narration: 若铃摘下眼镜。她怕重演年轻时的暧昧灾难，也怕你只想要讲台下的反差。红笔帽扣得严严实实。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。空气有点静，连呼吸都听得见。
