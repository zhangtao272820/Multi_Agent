id: story_shiori_act1_shelf
label: 梯子
priority: 5
once: true
chance: 1.0
scene_id: ""
trigger:
  character_ids: [shiori]
  stage_min: friend
  affinity_min: 50
  flags_absent: [sr_first_recommend]
prompt_snippet: |
  【专属故事 · 坡上书店的月亮 · 第1幕 · 梯子】
advance: on_player_turn
beats:
  - id: b1
    summary: "书店初识，她为你抽一本「刚好」的书"
    sprite_hint: [shelf_ladder, recommend_stack]
    soft_options: ["认真接话", "先观察", "轻声提问"]
  - id: b2
    summary: "「梯子」里出现犹豫或选择。"
    sprite_hint: [recommend_stack, work]
    soft_options: ["表明态度", "给她空间", "确认她的意思"]
  - id: b3
    summary: "收束本幕：留下可被记住的结果，不剧透结局名。"
    sprite_hint: [work]
    soft_options: ["坦白心意", "先缓一缓", "诚实说明顾虑"]
rewards:
  flags_set: [sr_first_recommend]
choice_effects:
  - { trust_delta: 3, affinity_delta: 3 }
  - { trust_delta: 2, affinity_delta: 2 }
