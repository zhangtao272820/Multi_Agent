prompt_snippet: |
  【专属故事 · 坡上书店的月亮 · 第4幕 · 窗边朗读】
advance: on_player_turn
beats:
  - id: b1
    narration: "打烊后窗边只剩一盏灯。她捏着写到一半的页，问你要不要听出声——月亮贴在玻璃上。"
    pc_thought: "窗边朗读像告白预演。我鼓掌还是接过笔？"
    brief: "窗边要朗读未完成页。等他站窗边、问读出声或先拉帘。"
    summary: "窗边要朗读未完成页。等他站窗边、问读出声或先拉帘。"
    sprite_hint: [recommend_stack, window_read, casual, home]
    soft_options: ["站到窗边", "问要不要读出声", "先拉帘"]
  - id: b2
    narration: "她读完自己的句子，声音稳得不像店员。读完把书签夹进空白处，像把心也夹住。"
    pc_thought: "中秋页码停在未写处——我填不填？"
    brief: "读完夹书签于空白。等他安静听完、递书签或不抢下一页。"
    summary: "读完夹书签于空白。等他安静听完、递书签或不抢下一页。"
    sprite_hint: [shelf_ladder, home, casual]
    soft_options: ["安静听完", "递书签", "说我不抢下一页"]
  - id: b3
    narration: "空白页朝上。她等你说：页给你，还是夸完声音就送她下楼结束今晚。"
    pc_thought: "月亮下她不荐书了。轮到我说一句真话。"
    brief: "空白页抉择。等他说页给你、夸声音稳或送她下楼。"
    summary: "空白页抉择。等他说页给你、夸声音稳或送她下楼。"
    sprite_hint: [season_winter, date, window_read, casual, home]
    soft_options: ["说空白页给你", "夸她声音稳", "送她下楼"]
