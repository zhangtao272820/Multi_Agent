  narration: 她终于出声读了半页，声音发干。读完立刻低头，像把声线又塞回书脊后。借书证边角磨得发白。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 线下见面像合并冲突。我选听完，还是用便签挡回去？我想靠近，又怕说错一句。
