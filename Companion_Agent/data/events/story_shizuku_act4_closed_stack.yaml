  narration: 闭架区只剩一盏应急灯。她抱着钥匙串，问你能不能在她锁柜时待着——不是借阅，是陪。借书证边角磨得发白。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 闭架书库像秘密。钥匙在她手里，也在我喉咙里。我想靠近，又怕说错一句。
  brief: 闭架锁柜要人陪；非借阅。等他帮锁、问要不要出声或先关灯。
  summary: 闭架锁柜要人陪；非借阅。等他帮锁、问要不要出声或先关灯。
