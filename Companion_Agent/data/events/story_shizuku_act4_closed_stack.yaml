scene_id: ""
trigger:
  character_ids: [shizuku]
  stage_min: friend
  affinity_min: 74
  flags_present: [sz_spoke_aloud]
  flags_absent: [sz_closed_stack]
prompt_snippet: |
  【专属故事 · 书脊后的声线 · 第4幕 · 闭架书库】
advance: on_player_turn
beats:
  - id: b1
    narration: "闭架区只剩一盏应急灯。她抱着钥匙串，问你能不能在她锁柜时待着——不是借阅，是陪。"
    pc_thought: "闭架书库像秘密。钥匙在她手里，也在我喉咙里。"
    brief: "闭架锁柜要人陪；非借阅。等他帮锁、问要不要出声或先关灯。"
    summary: "闭架锁柜要人陪；非借阅。等他帮锁、问要不要出声或先关灯。"
    sprite_hint: [library_ladder, work, casual, home]
    soft_options: ["帮她锁柜", "问要不要出声", "先关灯"]
  - id: b2
    narration: "她终于出声读了半页，声音发干。读完立刻低头，像把声线又塞回书脊后。"
    pc_thought: "线下见面像合并冲突。我选听完，还是用便签挡回去？"
    brief: "出声读半页又立刻低头。等他安静听完、递便签或不催借阅。"
    summary: "出声读半页又立刻低头。等他安静听完、递便签或不催借阅。"
    sprite_hint: [archive_cart, quiet_reading, home, casual]
    soft_options: ["安静听完", "递便签", "说我不催借阅"]
  - id: b3
    narration: "馆门外风很冷。她站在货架阴影里：故事还在——你是并肩站着，还是送她出馆就结束？"
    pc_thought: "冬馆暖气不足。我想把围巾递给声线，不是人设。"
    brief: "危机收束：故事还在否。等他说还在、并肩站货架或送她出馆。"
    summary: "危机收束：故事还在否。等他说还在、并肩站货架或送她出馆。"
    sprite_hint: [season_winter, date, casual, home]
    soft_options: ["说故事还在", "并肩站货架", "送她出馆"]
rewards:
