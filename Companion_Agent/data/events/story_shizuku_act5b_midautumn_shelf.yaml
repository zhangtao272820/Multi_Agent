  narration: 纸页尘与闭馆灯里，中秋馆里提早闭馆；她换上节日装，却仍抱着一摞未上架的书。借书证边角磨得发白。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 书脊后的她很安全。出声一步，线上久识就露馅。我想靠近，又怕说错一句。
