- id: b1
  narration: 晚饭热气糊在窗上。日程本摊在碗边，她用筷子点着格子问：这周你又晚回来几天。话像家里人在管事，笔却把你的行踪圈进她的表里。厨房饭香扑过来，周阿姨大概又在念晚归名单
  pc_thought: 顺着她说像交作业；不说又怕她把关心拧成规矩。我还当这是妹妹在唠叨
  brief: 晚饭点名；她用日程本追问晚归。紧张却要显得只是管家事。
  summary: 晚饭点名；她用日程本追问晚归。紧张却要显得只是管家事。
  sprite_hint:
  - home_sibling
  - kitchen_helper
  - home
  - home_eating
  - casual
  soft_options:
  - 如实报行踪
  - 先问她功课
  - 打趣岔开
