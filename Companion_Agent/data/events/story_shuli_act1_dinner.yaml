id: story_shuli_act1_dinner
label: 晚饭点名
priority: 5
once: true
chance: 1.0
scene_id: ""
trigger:
  character_ids: [shuli]
  stage_min: friend
  affinity_min: 52
  flags_absent: [sibling_talk_done]
prompt_snippet: |
  【专属故事 · 日程本里的禁忌 · 第1幕 · 晚饭点名】
advance: on_player_turn
beats:
  - id: b1
    narration: "晚饭蒸汽糊住窗。日程本摊在碗边，她用筷子点着格子问：这周你又晚归了几天。语气像家人，笔迹却把你圈进她的表。"
    pc_thought: "应她像交作业；不应又怕她把关心拧成枷。我还当这是妹妹的唠叨。"
    brief: "晚饭点名；她用日程本追问晚归。紧张却要显得只是管家事。"
    summary: "晚饭点名；她用日程本追问晚归。紧张却要显得只是管家事。"
    sprite_hint: [home_sibling, home]
    soft_options: ["如实报行踪", "先问她功课", "打趣岔开"]
  - id: b2
    narration: "她把「家人」两字敲在桌上：关心可以，别把妹妹当恋爱参谋，更别拿她挡别人的枪。笑还在，眼神先冷半寸。"
    pc_thought: "这一刀不是恋爱，是划边界——我竟松了口气，又隐隐失落。"
    brief: "她强调家人边界；怕被当恋爱工具。等你承认或反驳。"
    summary: "她强调家人边界；怕被当恋爱工具。等你承认或反驳。"
    sprite_hint: [kitchen_helper, home_sibling]
    soft_options: ["道歉边界", "认真听完", "保证不拿她挡枪"]
  - id: b3
    narration: "洗碗水声里她忽然停筷：你最近见的人，名字可以不说——但别在家门口留下香水味。日程夹层多了一行被划掉的字。"
    pc_thought: "划掉的是什么？我不敢问。兄长该装瞎，欲望却想掀开那一页。"
    brief: "她嗅到外人痕迹却自称不在意；留下划掉的字迹试探你会不会追问。"
    summary: "她嗅到外人痕迹却自称不在意；留下划掉的字迹试探你会不会追问。"
    sprite_hint: [kitchen_helper, casual]
    soft_options: ["装作没看见夹层", "问她划掉了什么", "保证进门先洗手"]
  - id: b4
    narration: "本子合上前她松口：家稳了，外面的故事才站得住。灯下她像只管晚饭的妹妹——你却听见软枷锁咔哒一声。"
    pc_thought: "是我先让她管日程的吗？感激与不安一起沉进洗碗池。"
    brief: "她松口愿站你这边，前提是日子先稳。等一句不把她卷进戏的承诺。"
    summary: "她松口愿站你这边，前提是日子先稳。等一句不把她卷进戏的承诺。"
    sprite_hint: [home_sibling, casual]
    soft_options: ["道谢", "约周末再做饭", "保证不把她卷进恋爱戏"]
rewards:
  flags_set: [sibling_talk_done]
choice_effects:
  - { trust_delta: 3, affinity_delta: 3 }
  - { trust_delta: 2, affinity_delta: 2 }
  - { trust_delta: -2, affinity_delta: -1 }
