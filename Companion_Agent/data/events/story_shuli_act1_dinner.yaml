- id: b4
  narration: 本子合上前她松口：家稳了，外面的事才站得住。灯下她像只管晚饭的妹妹——你却听出她把家里管得更紧了。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 是我先让她管日程的吗？谢谢她，也有点怕她。我想靠近，又怕说错一句。
  brief: 她松口愿站你这边，前提是日子先稳。等一句不把她卷进戏的承诺。
