- id: b3
  narration: 洗碗水声里她忽然停住：你最近见的人，名字可以不说——但别在家门口留下香水味。日程本夹层多了一行被划掉的字。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 划掉的是什么？我不敢问。当哥哥该装没看见，可我还是想掀开那一页
  brief: 她嗅到外人痕迹却自称不在意；留下划掉的字迹试探你会不会追问。
  summary: 她嗅到外人痕迹却自称不在意；留下划掉的字迹试探你会不会追问。
