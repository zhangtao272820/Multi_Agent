- id: b2
  narration: 她把「家人」两个字敲在桌上：关心可以，别把妹妹当恋爱参谋，更别拿她挡别人的枪。笑还在，眼神先冷了半寸。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 这一句不是谈恋爱，是划线。我居然松了口气，心里又有点空。我想靠近，又怕说错一句。
  brief: 她强调家人边界；怕被当恋爱工具。等你承认或反驳。
  summary: 她强调家人边界；怕被当恋爱工具。等你承认或反驳。
  sprite_hint:
