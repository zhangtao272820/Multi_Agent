prompt_snippet: '【专属故事 · 日程本里的禁忌 · 第2幕 · 站在同一边】

  '
advance: on_player_turn
beats:
- id: b1
  narration: 她把家务和你「外面的安排」并排写在日程上：再撞车，她不愿一个人背锅。笔尖顿了顿，像在吃谁的醋，却只写「家务优先」。日程本角被她捏得有点翘。她没再多说，只是看着你。
  pc_thought: 同盟先从分活开始。她肯帮我，但不许我把她写成恋爱军师。我想靠近，又怕说错一句。
  brief: 她要分清家务与外面的安排；吃醋却只写家务优先。
  summary: 她要分清家务与外面的安排；吃醋却只写家务优先。
  sprite_hint:
  - home_sibling
  - work
  - kitchen_helper
  - casual
  soft_options:
  - 承认安排混乱
  - 一起改日程
  - 问她需要什么保证
  pages:
  - text: 她把家务和你「外面的安排」并排写在日程上：再撞车，她不愿一个人背锅。笔尖顿了顿，像在吃谁的醋，却只写「家务优先」。日程本角被她捏得有点翘。她没再多说，只是看着你。
    voice: narration
    sprite:
      outfit: home_sibling
      emotion: neutral
  - text: 同盟先从分活开始。她肯帮我，但不许我把她写成恋爱军师。我想靠近，又怕说错一句。
    voice: pc
    sprite:
      outfit: home_sibling
      emotion: shy
- id: b2
  narration: 门外有人来找你，她先去开门，笑着说「哥哥在忙」。关上门后声音压低：可以帮你挡，别把亲妹妹当工具。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 挡外人时她像恋人，转头又把自己按回妹妹位。我感激，也发冷
  brief: 她替你挡门，又强调别工具化妹妹。等你表态。
  summary: 她替你挡门，又强调别工具化妹妹。等你表态。
  sprite_hint:
  - home_sibling
  - work
  - kitchen_helper
  - casual
  - home
  soft_options:
  - 承诺不工具化
  - 说明具体麻烦
  - 先听她的条件
  pages:
  - text: 门外有人来找你，她先去开门，笑着说「哥哥在忙」。关上门后声音压低：可以帮你挡，别把亲妹妹当工具。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
    voice: narration
    sprite:
      outfit: home_sibling
      emotion: neutral
  - text: 挡外人时她像恋人，转头又把自己按回妹妹位。我感激，也发冷
    voice: pc
    sprite:
      outfit: home_sibling
      emotion: shy
- id: b3
  narration: 本子中央落下「同盟」两个字。她说：家人站队，不等于给你写恋爱剧本；真结局不靠她点头，靠她不拆台。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 不拆台——像誓言，又像警告。我该松口气，还是该怕她太懂？
  brief: 她写下同盟：可站队，不写恋爱剧本。等你是否接受。
  summary: 她写下同盟：可站队，不写恋爱剧本。等你是否接受。
  sprite_hint:
