- id: b4
  narration: 本子合上。她抬眼提起枫音也住同一屋檐下——别让两个妹妹一起跟着乱。走廊尽头门缝里，游戏声忽然静了一拍。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 枫音听见没有？家这层壳，比我想的薄。我想靠近，又怕说错一句。
  brief: 她提醒枫音同住；走廊有动静。你要收声还是装作没事。
  summary: 她提醒枫音同住；走廊有动静。你要收声还是装作没事。
