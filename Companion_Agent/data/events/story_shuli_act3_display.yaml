- id: b3
  narration: 她在本子写下「影子」：花园里可以有不被名义承认的位置——展示只给你，称呼与姓氏不许改。写完立刻用手心盖住，像后悔刚才的勇敢。日程本角被她捏得有点翘。她没再多说，只是看着你。
  pc_thought: 展示成功后的羞耻比欲望更刺。我怕自己享受这份越界。我想靠近，又怕说错一句。
