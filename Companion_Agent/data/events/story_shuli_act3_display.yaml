- id: b2
  narration: 她坐近一步，膝盖几乎碰到你：不能当恋人，也不想只当你的工具妹妹。日程夹层鼓起来，像藏着见不得光的字。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 影子席的邀请——我要是伸手，就再也装不成纯家人。我想靠近，又怕说错一句。
  brief: 她靠近表白矛盾：不当恋人，也不只当工具妹妹。
  summary: 她靠近表白矛盾：不当恋人，也不只当工具妹妹。
