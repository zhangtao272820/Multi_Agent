- id: b1
  narration: 浴室门开，雾气涌出来。她只围着浴巾站在客厅灯下——愣了半秒，故意没躲，手指却把角攥白了。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 我知道不该看。可还是没把眼睛挪开。当哥哥的身份，这一秒烫得慌
  brief: 浴巾出场；她故意不躲又紧张。等你的反应。
  summary: 浴巾出场；她故意不躲又紧张。等你的反应。
  sprite_hint:
