- id: b4
  narration: 灯关掉前她说：枫音也在同屋檐下。隔壁键盘声忽然停，又响起来——像有人只是换了首歌。她假装没听见。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 隔墙有没有人？我答应守家，手里却还记得浴巾的温度。我想靠近，又怕说错一句。
