- id: b1
  narration: 她撞见你和其他女主说话回来，进门不换鞋，把日程本撕下一页揉皱。眼睛红着，嘴上却说「随便你」。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 她在哭还是在骂？我该解释，还是该先认错？我想靠近，又怕说错一句。
  brief: 她嫉妒发作撕日程；哭和攻击来回。等你态度。
  summary: 她嫉妒发作撕日程；哭和攻击来回。等你态度。
