- id: b3
  narration: 她终于开口：不是要你不交朋友——是别把家里当旅馆，回来还带着别人的笑。日程本封皮裂了一道。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 她要的是位置，不是垄断全世界。我听懂了，也更怕。我想靠近，又怕说错一句。
