  narration: 和好没有拥抱，只有她把撕掉的那页贴回去，字迹歪歪扭扭。她说：下次再这样，我会真的不管你的日程。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
