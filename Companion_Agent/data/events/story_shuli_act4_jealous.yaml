  narration: 冷战一夜。第二天早饭她把你的那格空着，只写自己的课表。走廊里枫音探头问：你们吵什么呢？日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 不能让枫音听懂。家要散的话，会从这一句开始。我想靠近，又怕说错一句。
  brief: 冷战；枫音追问。你要圆场还是沉默。
