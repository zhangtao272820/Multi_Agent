id: story_shuli_act4_jealous
label: 撕开的日程本
priority: 8
once: true
chance: 1.0
scene_id: ""
trigger:
  character_ids: [shuli]
  stage_min: close_friend
  affinity_min: 80
  flags_present: [kin_garden_ready, deliberate_display]
  flags_absent: [shuli_jealous_break]
prompt_snippet: |
  【专属故事 · 日程本里的禁忌 · 第4幕 · 撕开的日程本】
advance: on_player_turn
beats:
  - id: b1
    narration: "便利店灯白得刺眼。她推门进来，正好撞见你与一个带着松节油味的人说笑——像画室方向来的——日程本被捏到变形。她先叫你「哥哥」，声音却冷。"
    pc_thought: "独占欲涌上来，紧跟着自我厌恶：小镇太小，他线的气味也会被她闻见。"
    brief: "撞见你与带着松节油味的外人说笑；日程本捏变形。嫉妒先落地。"
    summary: "撞见你与带着松节油味的外人说笑；日程本捏变形。嫉妒先落地。"
    sprite_hint: [home_sibling, kitchen_helper, casual, home]
    soft_options: ["解释刚才只是路过", "先送女主离开再谈", "承认这是约会"]
  - id: b2
    narration: "回家门一关，她撕下一页：不是菜谱，是「今天你又晚归」。纸屑落在玄关。隔壁枫音的游戏音忽然小了，像隔墙有人屏住呼吸。"
    pc_thought: "家几乎被砸裂。怕她为你与世界为敌，更怕枫音推门进来。"
    brief: "撕日程质问晚归；把她当透明妹妹。哭意与攻击之间摇摆。"
    summary: "撕日程质问晚归；把她当透明妹妹。哭意与攻击之间摇摆。"
    sprite_hint: [home_sibling, kitchen_helper, home_eating, home]
    soft_options: ["认错晚归与疏忽", "说她越界了", "沉默扛着"]
  - id: b3
    narration: "她一会儿笑一会儿哭：可以吃醋，不能被当笨蛋工具人。拖鞋砸在门边，又自己捡起——攻击与示弱同一秒翻转，客厅灯管嗡嗡响。"
    pc_thought: "一吵定情最假。我想抱她，又怕一抱就成告白。"
    brief: "哭与攻击切换；要你正视扭曲的依赖，不是立刻和好定情。"
    summary: "哭与攻击切换；要你正视扭曲的依赖，不是立刻和好定情。"
    sprite_hint: [home_sibling, home_sleeping, max_micro_slip, season_winter]
    soft_options: ["抱住她先稳住", "约明天谈透禁忌", "先分开冷静一夜"]
  - id: b4
    narration: "冷战一夜。走廊薄墙那侧，枫音房门轴轻轻响了一下又停——不知听见多少。她把自己关进房间，日程本残骸留在桌上像未愈的伤。"
    pc_thought: "嫉妒落章了，家却更冷。明天若谈透，就再也退不回「只是妹妹」。"
    brief: "冷战收场；隔墙有声响悬念。等你选择先稳住、约谈，或分开一夜。"
    summary: "冷战收场；隔墙有声响悬念。等你选择先稳住、约谈，或分开一夜。"
    sprite_hint: [home_sibling, season_winter, home]
    soft_options: ["隔门说一句对不起", "把残骸收好明早谈", "敲门问她要不要水"]
rewards:
  flags_set: [shuli_jealous_break]
choice_effects:
  - { trust_delta: 2, affinity_delta: 3 }
  - { trust_delta: 1, affinity_delta: 1 }
  - { trust_delta: -2, affinity_delta: -1 }
