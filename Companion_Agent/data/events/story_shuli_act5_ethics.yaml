- id: b3
  narration: 你们试探「假退出」：要不要停、要不要告诉枫音一半。茶凉了两轮，谁也没把话说死。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 停下来会安全，继续会疼。我两样都想要，两样都怕。我想靠近，又怕说错一句。
