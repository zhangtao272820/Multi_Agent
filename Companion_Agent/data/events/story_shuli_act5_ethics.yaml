  narration: 夜很静。她把日程本推到你面前：要说清楚吗？说清楚就再也回不去「只是兄妹」。灯管嗡了一声。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 说破不是高潮，是往下沉。我怕伤她，也怕自己想要的不只是家人
  brief: 她逼你把禁忌说清楚。紧张、害怕、又想听实话。
  summary: 她逼你把禁忌说清楚。紧张、害怕、又想听实话。
  sprite_hint:
