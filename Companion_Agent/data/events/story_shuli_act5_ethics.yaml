  narration: 最后她只写下一句：先别散。称呼当面仍是哥哥妹妹，私下你们都知道那是罩子。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。空气有点静，连呼吸都听得见。
  pc_thought: 罩子能遮多久？够我们把明天过完，就不错了。我想靠近，又怕说错一句。
