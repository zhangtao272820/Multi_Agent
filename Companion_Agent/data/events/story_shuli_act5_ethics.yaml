- id: b2
  narration: 她说愿意承担闲话和家规，但不许你把责任全推给「妹妹不懂事」。眼睛红着，背却挺直。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 她比我更敢认。我要是逃，就是最孬的那种哥哥。我想靠近，又怕说错一句。
  brief: 她愿共担，不许你推责。等你是否一起扛。
  summary: 她愿共担，不许你推责。等你是否一起扛。
