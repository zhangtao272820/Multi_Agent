- id: b2
  narration: 差点穿帮：拖鞋摆错、两只杯子、走廊夜灯忘关。她把证据一件件收起，眼圈却红了。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 再大意一次，家就不是家了。我是心疼她，还是心疼自己的秘密？
  brief: 险些暴露；她收拾痕迹又难受。
