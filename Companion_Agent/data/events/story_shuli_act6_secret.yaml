- id: b3
  narration: 屋顶风大。她说真结局不是公开庆祝，是两个人一起扛闲话；坏结局也很简单——门被撞开的那一秒。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 我握住她的手，不知道这是保护还是把她拖下水。我想靠近，又怕说错一句。
  brief: 屋顶谈话：真结局要共担，坏结局是被撞破。
  summary: 屋顶谈话：真结局要共担，坏结局是被撞破。
