- id: b1
  narration: 同屋檐下的日子忽然变甜，也变吓人。她半夜来敲你门，只为确认你还在——又怕门响惊动枫音。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 甜蜜和暴露只隔一层薄门。我伸手开门，手心全是汗。我想靠近，又怕说错一句。
  brief: 她夜敲确认你在；又怕惊动枫音。
  summary: 她夜敲确认你在；又怕惊动枫音。
  sprite_hint:
