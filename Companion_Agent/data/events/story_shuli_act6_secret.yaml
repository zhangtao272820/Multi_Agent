- id: b4
  narration: 下楼时枫音房门缝亮着。她松开你的手，恢复成「妹妹回屋写功课」的样子。秘密还在，裂痕也在。日程本角被她捏得有点翘。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 今晚没散。可我知道分叉就在前面：扛下去，或被拆穿。我想靠近，又怕说错一句。
