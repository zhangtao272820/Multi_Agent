id: story_shuli_act6_secret
label: 薄墙另一侧
priority: 9
once: true
chance: 1.0
scene_id: ""
trigger:
  character_ids: [shuli]
  stage_min: close_friend
  affinity_min: 88
  flags_present: [taboo_romance_ok]
  flags_absent: [shuli_secret_roof]
prompt_snippet: |
  【专属故事 · 日程本里的禁忌 · 第6幕 · 薄墙另一侧】
advance: on_player_turn
beats:
  - id: b1
    narration: "破限后的第一周：她仍叫你哥哥，房门却虚掩。枫音在隔壁打游戏，笑声穿透薄墙——每一次靠近都像踩在暴露的边缘。"
    pc_thought: "甜蜜与恐怖同温。我怕被拆穿，更怕自己享受这份倒计时。"
    brief: "门虚掩；枫音笑声隔墙可闻。秘密恋的第一步，等你小心靠近或退开。"
    summary: "门虚掩；枫音笑声隔墙可闻。秘密恋的第一步，等你小心靠近或退开。"
    sprite_hint: [home, home_sleeping, season_winter, home_sibling]
    soft_options: ["小心靠近却不喧哗", "先确认门锁", "保持距离再观察"]
  - id: b2
    narration: "晨间她穿你的外套倒水，水壶刚响，走廊响起枫音的拖鞋声——她弹开半步，外套滑落椅背，像什么都没发生。水壶烧开的汽白得刺眼。"
    pc_thought: "近暴露被压回去了。裂痕留在汽里：我们还能瞒多久？"
    brief: "穿外套倒水时差点被枫音撞见；立刻弹开掩饰。心跳像倒计时。"
    summary: "穿外套倒水时差点被枫音撞见；立刻弹开掩饰。心跳像倒计时。"
    sprite_hint: [home_eating, home, casual, home_sibling]
    soft_options: ["拉她回房压低声", "对枫音坦白一半", "暂停亲密一阵子"]
  - id: b3
    narration: "夜灯只留床头一盏。她把耳朵贴向薄墙：那边游戏停了，门轴却没响。她笑得很轻——甜蜜里掺着随时被发现的冷。"
    pc_thought: "真结局的门在前方，坏结局的风也从门缝灌进来。我想共担，也想逃。"
    brief: "贴墙听枫音动静；甜蜜与恐惧并存。等你承诺或承认害怕。"
    summary: "贴墙听枫音动静；甜蜜与恐惧并存。等你承诺或承认害怕。"
    sprite_hint: [home_sibling, home_sleeping, season_winter]
    soft_options: ["说怕但不会丢下她", "提议更严的暗号", "坦白自己也想逃"]
  - id: b4
    narration: "她在日程夹层写下「秘密屋顶」：可以恋人，家不能散。笔停住，像给真/坏分叉留白。窗外夜灯一闪——不知是谁的房间。"
    pc_thought: "落章之后路分叉。独占欲与自我厌恶一起签字——我选共担还是撤离？"
    brief: "写下秘密屋顶；家不能散。为分叉铺垫，等共担、搬家或承认害怕。"
    summary: "写下秘密屋顶；家不能散。为分叉铺垫，等共担、搬家或承认害怕。"
    sprite_hint: [home_sibling, home_sleeping, season_winter, kitchen_helper]
    soft_options: ["承诺共担被发现的后果", "考虑以后搬出去", "说自己也怕了"]
rewards:
  flags_set: [shuli_secret_roof]
choice_effects:
  - { trust_delta: 4, affinity_delta: 5 }
  - { trust_delta: 2, affinity_delta: 2 }
  - { trust_delta: 0, affinity_delta: -1 }
