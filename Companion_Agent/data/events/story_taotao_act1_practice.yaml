- id: b2
  narration: 地板记号旁她喘着数拍。需要一个人当「应急观众」——灯没开全，影子被拉得很长。门外小梁看了眼表：「练可以，镜头前别哭。」。耳返线还绕在她指节上。
  pc_thought: 应急观众很好当——素颜观众才难。我想靠近，又怕说错一句。
  brief: 喘着数拍要应急观众。等他坐下认真看、鼓掌或问要不要休息。
