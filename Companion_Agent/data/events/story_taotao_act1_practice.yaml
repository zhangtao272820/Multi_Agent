id: story_taotao_act1_practice
label: 练功房
priority: 5
once: true
chance: 1.0
scene_id: ""
trigger:
  character_ids: [taotao]
  stage_min: friend
  affinity_min: 50
  flags_absent: [tt_practice_met]
prompt_snippet: |
  【专属故事 · 灯牌与素颜 · 第1幕 · 练功房】
advance: on_player_turn
beats:
  - id: b1
    narration: "声乐棚回音里她破了音，却对空气笑：偶像不能露怯。汗顺着鬓角滑进领口，气氛忽然认真起来。"
    pc_thought: "破音也比完美假笑真。我想当观众，不是灯牌支架。"
    brief: "破音后仍撑偶像笑；怕露怯。等他递水、说破音也很真，或假装刚进门。"
    summary: "破音后仍撑偶像笑；怕露怯。等他递水、说破音也很真，或假装刚进门。"
    sprite_hint: [vocal_booth, school, season_winter, home_eating, home_sleeping]
    soft_options: ["递水", "说破音也很真", "假装刚进门"]
  - id: b2
    narration: "地板记号旁她喘着数拍。需要一个人当「应急观众」——灯没开全，影子被拉得很长。"
    pc_thought: "应急观众很好当——素颜观众才难。"
    brief: "喘着数拍要应急观众。等他坐下认真看、鼓掌或问要不要休息。"
    summary: "喘着数拍要应急观众。等他坐下认真看、鼓掌或问要不要休息。"
    sprite_hint: [choreo_mark, stretch_break, season_winter, home_eating, home_sleeping]
    soft_options: ["坐下认真看", "给节奏鼓掌", "问要不要休息"]
  - id: b3
    narration: "休息间隙她摘掉耳返，声音忽然小：今天这些，别发到灯牌群。眼神却在等一句更私人的保证。"
    pc_thought: "万人喜欢很吵。我想听她私下喘一口气的声音。"
    brief: "要求秘密别发灯牌群；等更私人的保证。等他说只给你、夸努力或约下次。"
    summary: "要求秘密别发灯牌群；等更私人的保证。等他说只给你、夸努力或约下次。"
    sprite_hint: [lyric_marker, casual, season_winter, home_eating, home_sleeping]
    soft_options: ["说秘密只给你", "夸努力看得见", "约下次还来"]
rewards:
  flags_set: [tt_practice_met]
choice_effects:
  - { trust_delta: 3, affinity_delta: 3 }
  - { trust_delta: 2, affinity_delta: 2 }
  - { trust_delta: -2, affinity_delta: -1 }
