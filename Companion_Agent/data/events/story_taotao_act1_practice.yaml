  narration: 声乐棚回音里她破了音，却对空气笑：偶像不能露怯。汗顺着鬓角滑进领口，。耳返线还绕在她指节上。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 破音也比完美假笑真。我想当观众，不是灯牌支架。我想靠近，又怕说错一句。
  brief: 破音后仍撑偶像笑；怕露怯。等他递水、说破音也很真，或假装刚进门。
  summary: 破音后仍撑偶像笑；怕露怯。等他递水、说破音也很真，或假装刚进门。
