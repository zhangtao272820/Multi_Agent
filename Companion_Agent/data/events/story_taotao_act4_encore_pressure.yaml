- id: b1
  narration: 加训结束她往膝盖贴冰袋，镜头笑还挂着。经纪人在门外催场，灯牌反光刺进眼睛。小梁在催下一场，她膝盖上的冰袋还没揭。耳返线还绕在她指节上。她没再多说，只是看着你。
  pc_thought: 冰袋比灯牌烫手。经纪人在门外，我挡不挡？我想靠近，又怕说错一句。
  brief: 贴冰袋仍挂镜头笑；经纪人催场。等他换冰袋、挡两分钟或先走。
  summary: 贴冰袋仍挂镜头笑；经纪人催场。等他换冰袋、挡两分钟或先走。
  sprite_hint:
