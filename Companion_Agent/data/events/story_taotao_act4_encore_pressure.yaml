- id: b2
  narration: 她问你记住的是舞台灯牌，还是她喘不上气、卸妆棉乱扔的间隙。声音发哑，却盯着你。耳返线还绕在她指节上。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 舞台灯灭后，她还愿不愿意被我看见？我想靠近，又怕说错一句。
