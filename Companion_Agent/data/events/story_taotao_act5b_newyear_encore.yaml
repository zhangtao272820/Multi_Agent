  narration: 声乐棚回音与汗味里，元旦特别演出前，她穿节日装却把灯牌塞进你手里：「今晚只认这一支。」。耳返线还绕在她指节上。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 破音也比完美假笑真。我想当观众，不是灯牌支架。我想靠近，又怕说错一句。
