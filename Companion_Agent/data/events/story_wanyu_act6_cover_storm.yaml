  narration: 雨汐把围裙摔在吧台，水珠溅开。她说：顶班不是让你把晚雨掏空的借口。杯沿还留着一圈淡咖啡渍。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。空气有点静，连呼吸都听得见。
  pc_thought: 雨汐一摔，店里的空气就变了。我帮不帮，都会被写进死党账本
  brief: 雨汐摔围裙质问顶班掏空。等他捡围裙、问原话或先关店门。
