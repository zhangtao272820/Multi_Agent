- id: b3
  narration: 蒸汽散尽前，她看着你：接或不接都要一句真话——别再用熟客笑敷衍。杯沿还留着一圈淡咖啡渍。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。空气有点静，连呼吸都听得见。
  pc_thought: 真话比拿铁烫。我说顶得住，还是承认我也累？我想靠近，又怕说错一句。
