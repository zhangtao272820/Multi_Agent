  narration: 打烊后只剩蒸汽与沉默。晚雨把关店钥匙放在台沿，问你要不要接。杯沿还留着一圈淡咖啡渍。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。空气有点静，连呼吸都听得见。
