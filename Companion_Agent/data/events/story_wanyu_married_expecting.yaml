  narration: 咖啡香淡下去，关店回家，她把围裙叠好，用杯子暖手，说蒸汽里多了一个还没点单的小客人。杯沿还留着一圈淡咖啡渍。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 吧台外的日常，开始按另一套钟点走。我想靠近，又怕说错一句。
