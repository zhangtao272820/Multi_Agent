beats:
- id: b1
  summary: 午后画室，她把画笔搁在一边，手覆在微微鼓起的腹前，说线稿之外又多了一页要一起改。等你回应。
  sprite_hint:
  - maternity
  - home
  - casual
  soft_options:
  - 握住她的手
  - 问要不要休息
  - 帮她收起颜料
  narration: 松节油与暖黄灯里，午后画室，她把画笔搁在一边，手覆在微微鼓起的腹前，说线稿之外又多了一页要一起改。门缝里还能闻见一点松节油。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 妻子日常忽然变得具体——不是画里的人，是会喘气、会累的人
  brief: 她把手放在腹前，说线稿之外又多了一页。等你回应。
