  summary: 入冬天台风硬；她把相册翻到缺口那页，围巾捂住半张脸。等你回应。
  sprite_hint:
  - season_winter
  - home
  - casual
  soft_options:
  - 帮她理袖标
  - 问冷不冷
  - 先停拍
  narration: 入冬天台风硬；她把相册翻到缺口那页，围巾捂住半张脸。便当绳结打得很仔细。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 合影缺口像未说完的夏天。我补不补？我想靠近，又怕说错一句。
  brief: 入冬天台风硬；她把相册翻到缺口那页，围巾捂住半张脸。等你回应。
