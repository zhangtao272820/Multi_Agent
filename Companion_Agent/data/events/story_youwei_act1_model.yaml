id: story_youwei_act1_model
label: 临时模特
priority: 5
once: true
chance: 1.0
scene_id: ""
trigger:
  character_ids: [youwei]
  stage_min: friend
  affinity_min: 52
  flags_absent: [studio_sketch_done]
prompt_snippet: |
  【专属故事 · 画室里的第三支笔 · 第1幕 · 临时模特】
advance: on_player_turn
beats:
  - id: b1
    narration: "画室门开一条缝。学妹抱着速写本：学姐出去了——你要不要当十分钟临时模特？松节油味从门缝涌出来。"
    pc_thought: "学妹位置很安全。坐下当模特，就可能挤进别人的画框。"
    brief: "学姐不在；邀你当临时模特。试探你会不会进门。"
    summary: "学姐不在；邀你当临时模特。试探你会不会进门。"
    sprite_hint: [studio_junior, casual]
    soft_options: ["答应坐下", "问学姐何时回", "先帮她整理笔"]
  - id: b2
    narration: "软尺与铅笔之间，她观察你是否尊重创作：对学姐好，不只是夸画，是不打扰她的线。"
    pc_thought: "夸她的线容易。把她当创作者，才是同盟的门槛。"
    brief: "观察你是否尊重创作线。等你夸线、认创作者，或问一起改。"
    summary: "观察你是否尊重创作线。等你夸线、认创作者，或问一起改。"
    sprite_hint: [sketch_share, studio_junior]
    soft_options: ["夸她的线", "说把她当创作者", "问能否一起改"]
  - id: b3
    narration: "她递出第三支笔：创作同盟入口打开。小悠真结局的门，从这一刻可以推开——她却只说「别弄乱笔筒」。"
    pc_thought: "接笔像接信任。我别把同盟写成第三者剧本。"
    brief: "递出第三支笔开同盟。等你答应守界、约帮忙或道谢信任。"
    summary: "递出第三支笔开同盟。等你答应守界、约帮忙或道谢信任。"
    sprite_hint: [sketch_share, work]
    soft_options: ["答应守界", "约固定帮忙", "道谢信任"]
rewards:
  flags_set: [studio_sketch_done]
choice_effects:
  - { trust_delta: 3, affinity_delta: 3 }
  - { trust_delta: 2, affinity_delta: 2 }
  - { trust_delta: -2, affinity_delta: -1 }
