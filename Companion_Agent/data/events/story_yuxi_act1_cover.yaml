- id: b1
  narration: 换班口她把围裙抛来：晚雨今天状态不对——你是来喝杯就走，还是愿意顶半班？蒸汽糊住玻璃。围裙带松松挂着。她没再多说，只是看着你。
  pc_thought: 死党位很硬。接围裙像介入，也像被审查。我想靠近，又怕说错一句。
  brief: 抛围裙要你顶半班；晚雨状态不对。等你说明来意、收杯或问晚雨。
  summary: 抛围裙要你顶半班；晚雨状态不对。等你说明来意、收杯或问晚雨。
  sprite_hint:
