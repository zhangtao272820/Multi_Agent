- id: b2
  narration: 顶班时她观察你如何对熟客：对晚雨好，不是多点单，是别把她的停靠当成理所当然。围裙带松松挂着。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 顶班信任不是恋爱通行证——我别搞混。我想靠近，又怕说错一句。
  brief: 观察你对熟客；别消费晚雨的停靠。等你否认消费、问真心或接受审查。
