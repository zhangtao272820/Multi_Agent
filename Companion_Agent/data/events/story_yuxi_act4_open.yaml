  narration: 打烊后她不谈晚雨，只问：你找她，是不是只为了靠近死党。灯管嗡嗡，围裙搭在椅背。围裙带松松挂着。她没再多说，只是看着你。这一秒谁先开口，都会把关系往前推一点。
  pc_thought: 开放门：并肩站柜台，还是退回死党席？我想靠近，又怕说错一句。
  brief: 打烊追问是否只为靠近死党。等你否认、承认曾经或说两边重要。
  summary: 打烊追问是否只为靠近死党。等你否认、承认曾经或说两边重要。
