<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>巨门 · Extractor</title>
  <style>
    :root {
      --bg-color: #000; --text-main: #fff; --text-dim: rgba(255,255,255,.7);
      --primary: #fff; --primary-glow: rgba(255,255,255,.4); --secondary: #e0e0e0;
      --secondary-glow: rgba(255,255,255,.2); --border-color: rgba(255,255,255,.25);
      --border-glow: rgba(255,255,255,.15); --error: #ff4d4f; --success: #52c41a; --warning: #faad14;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100vh; background: transparent; color: var(--text-main);
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      overflow-x: hidden; }
    /* 不可用 z-index:-1：会被 body 不透明底色挡住 */
    .spring-background { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #0b1210; --wind-x: 0px; --wind-rotate: 0deg; pointer-events: none; }
    .sky-gradient { position: absolute; inset: -15%;
      background: radial-gradient(circle at 18% 24%, rgba(200,255,191,.28), transparent 44%),
        radial-gradient(circle at 82% 22%, rgba(255,212,235,.26), transparent 46%),
        radial-gradient(circle at 52% 78%, rgba(156,238,184,.25), transparent 53%),
        linear-gradient(160deg, #09110d 0%, #111e17 46%, #16281d 100%);
      animation: skyShift 18s ease-in-out infinite alternate; }
    .aurora-layer { position: absolute; inset: -20%;
      background: conic-gradient(from 180deg at 30% 40%, rgba(171,243,174,.2), transparent 40%, rgba(255,189,224,.12), transparent 72%, rgba(171,243,174,.2)),
        radial-gradient(circle at 70% 65%, rgba(209,255,214,.14), transparent 48%);
      filter: blur(28px); animation: auroraFlow 22s linear infinite; opacity: .8; }
    .petal-layer { position: absolute; inset: 0; pointer-events: none; }
    .petal { position: absolute; top: -10%; border-radius: 75% 20% 70% 25%;
      background: linear-gradient(145deg, rgba(255,215,232,.92), rgba(255,177,213,.6));
      box-shadow: 0 0 8px rgba(255,193,224,.35); opacity: var(--petal-opacity,.6);
      animation-name: petalFall, petalSway; animation-timing-function: linear, ease-in-out; animation-iteration-count: infinite, infinite; }
    .cursor-bloom { position: absolute; width: 380px; height: 380px; margin-left: -190px; margin-top: -190px; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(196,255,191,.26) 0%, rgba(255,188,224,.1) 40%, transparent 72%);
      filter: blur(12px); transition: transform 180ms ease-out; }
    .vignette { position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle at center, transparent 48%, rgba(2,8,6,.48) 100%), linear-gradient(to bottom, rgba(0,0,0,.08), rgba(0,0,0,.24)); }
    @keyframes petalFall { from { transform: translate3d(0,-10vh,0) rotate(0); }
      to { transform: translate3d(calc(var(--drift,0px) + var(--wind-x,0px)),118vh,0) rotate(320deg); } }
    @keyframes petalSway { 0%,100% { margin-left: -8px; rotate: calc(-6deg + var(--wind-rotate,0deg)); }
      50% { margin-left: 8px; rotate: calc(7deg + var(--wind-rotate,0deg)); } }
    @keyframes skyShift { 0% { transform: translate3d(-1.2%,-1.6%,0) scale(1.01); } 100% { transform: translate3d(1.4%,1.8%,0) scale(1.06); } }
    @keyframes auroraFlow { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.04); } 100% { transform: rotate(360deg) scale(1); } }
    .container { position: relative; z-index: 1; max-width: 1600px; margin: 0 auto; padding: 28px 24px 60px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .content-wrapper { position: relative; z-index: 1; width: 100%; background: linear-gradient(180deg, rgba(0,0,0,.4), rgba(0,0,0,.2));
      border: 1px solid var(--border-color); border-radius: 12px; padding: 36px 36px 28px;
      backdrop-filter: blur(8px) saturate(120%); box-shadow: 0 18px 55px rgba(0,0,0,.4), 0 0 24px var(--border-glow);
      display: flex; flex-direction: column; }
    .main-header { text-align: center; margin-bottom: 28px; }
    .header-row { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
    .title { font-size: 42px; font-weight: 900; margin: 0; text-transform: uppercase; letter-spacing: 4px; }
    .badge { font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 6px 14px; border-radius: 20px;
      border: 1px solid rgba(82,196,26,.45); background: rgba(82,196,26,.12); color: #b7eb8f; }
    .glitch-line { height: 2px; width: 100px; margin: 10px auto; background: linear-gradient(90deg, transparent, #fff, #e0e0e0, transparent); }
    .subtitle { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; font-weight: 600; margin: 0; }
    .config-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--text-dim); justify-content: center; }
    .config-strip span { padding: 2px 8px; border: 1px solid var(--border-color); border-radius: 999px; }
    .task-section { margin-bottom: 26px; }
    .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .label-row label { font-size: 11px; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
    .network-toggle { font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 16px; border: 1px solid var(--border-color);
      background: rgba(255,255,255,.04); color: var(--text-dim); cursor: pointer; }
    .network-toggle.on { border-color: rgba(82,196,26,.5); background: rgba(82,196,26,.15); color: #95de64; }
    .input-container { position: relative; background: rgba(0,0,0,.25); border: 1px solid var(--border-color); padding: 3px; border-radius: 10px; }
    .input-field { width: 100%; background: transparent; border: none; color: #fff; padding: 18px; font-size: 15px; line-height: 1.65;
      font-family: inherit; resize: vertical; display: block; min-height: 128px; }
    .input-field:focus { outline: none; }
    .corner { position: absolute; width: 10px; height: 10px; border-color: #fff; border-style: solid; opacity: .5; pointer-events: none; }
    .corner.tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-top-left-radius: 10px; }
    .corner.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-bottom-right-radius: 10px; }
    .manager-panel { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; background: rgba(0,0,0,.25); }
    .manager-panel summary { cursor: pointer; color: var(--text-dim); font-size: 13px; }
    .manager-json-field { margin-top: 8px; font-family: ui-monospace, monospace; font-size: 12px; min-height: 72px;
      border: 1px solid rgba(255,255,255,.12); border-radius: 8px; padding: 12px; background: rgba(0,0,0,.2); width: 100%; color: #fff; resize: vertical; }
    .intel-muted { font-size: 12px; color: var(--text-dim); }
    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 16px; flex-wrap: wrap; }
    .button-group { display: flex; gap: 15px; }
    .btn { position: relative; padding: 12px 30px; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px;
      cursor: pointer; border: 1px solid transparent; background: transparent; transition: all .3s cubic-bezier(.23,1,.32,1); font-family: inherit; }
    .btn-primary { color: #fff; border-color: #fff; box-shadow: inset 0 0 10px rgba(0,242,255,.1); }
    .btn-primary:hover:not(:disabled) { background: #fff; color: #000; box-shadow: 0 0 25px var(--primary-glow); }
    .btn-secondary { color: var(--text-dim); border-color: var(--border-color); }
    .btn:disabled { opacity: .2; cursor: not-allowed; }
    .ws-status { font-size: 10px; font-family: ui-monospace, monospace; color: var(--text-dim); }
    .ws-value { display: inline-flex; align-items: center; gap: 6px; color: #aaa; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); }
    .status-running .status-dot { background: #fff; box-shadow: 0 0 10px #fff; }
    .status-running { color: #95de64; }
    .status-error .status-dot { background: var(--error); }
    .status-error { color: var(--error); }
    .status-done .status-dot, .status-end .status-dot { background: var(--success); }
    .output-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 1024px) { .output-grid { grid-template-columns: 1fr; } .title { font-size: 32px; } .content-wrapper { padding: 20px; } }
    .panel { background: rgba(0,0,0,.25); border: 1px solid var(--border-color); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
    .panel-header { padding: 12px 16px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: var(--text-dim);
      border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; }
    .panel-icon { color: #fff; }
    .panel-content { flex: 1; min-height: clamp(460px, 56vh, 720px); overflow-y: auto; padding: 18px; font-family: ui-monospace, monospace; font-size: 12.5px; }
    .log-line { margin-bottom: 6px; line-height: 1.5; display: flex; gap: 10px; }
    .log-ts { color: #444; min-width: 65px; }
    .log-level { font-weight: 800; min-width: 50px; }
    .log-level-info { color: #fff; }
    .log-level-warn, .log-level-warning { color: var(--warning); }
    .log-level-error { color: var(--error); }
    .log-message { color: #bbb; flex: 1; word-break: break-word; }
    .result-pre { margin: 0; white-space: pre-wrap; word-break: break-all; color: #a5d6ff; line-height: 1.7; font-size: 13px; }
    .result-loading { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 180px; font-size: 18px; color: var(--text-dim); letter-spacing: 2px; }
    .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--success); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
    .main-footer { margin-top: 26px; text-align: center; }
    .footer-line { height: 1px; background: linear-gradient(90deg, transparent, var(--border-color), transparent); margin-bottom: 15px; }
    .main-footer p { font-size: 9px; font-weight: 700; color: #333; letter-spacing: 4px; margin: 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spring-background" id="bg">
      <div class="sky-gradient"></div>
      <div class="aurora-layer"></div>
      <div class="petal-layer" id="petals"></div>
      <div class="cursor-bloom" id="bloom"></div>
      <div class="vignette"></div>
    </div>
    <div class="content-wrapper">
      <header class="main-header">
        <div class="header-row">
          <h1 class="title">巨门 · 数据提取</h1>
          <span class="badge">ExtractorPy</span>
        </div>
        <div class="glitch-line"></div>
        <p class="subtitle">自主网络智能查询与数据提取 · SearXNG / CRW / Playwright MCP</p>
        <div class="config-strip">
          <span>端口 13104</span>
          <span>cap=crawler</span>
          <span>T0 CAP_ROUTE</span>
          <span id="netLabel">联网增强</span>
        </div>
      </header>

      <section class="task-section">
        <div class="label-row">
          <label for="task">任务参数</label>
          <button type="button" id="netBtn" class="network-toggle on">+ 联网</button>
        </div>
        <div class="input-container">
          <textarea id="task" class="input-field" rows="5">帮我爬取豆瓣 top 10 的电影信息</textarea>
          <div class="corner tl"></div><div class="corner br"></div>
        </div>

        <details class="manager-panel">
          <summary>种子 URL / 总管联调（可选）</summary>
          <p class="intel-muted">留空且开启「+ 联网」时，服务端会先 SearXNG 检索写入种子再精抓（与总管契约一致）。</p>
          <textarea id="seeds" class="manager-json-field" rows="3" placeholder="https://example.com/…（可多行）"></textarea>
        </details>

        <div class="action-bar">
          <div class="button-group">
            <button type="button" class="btn btn-primary" id="go">开始任务</button>
            <button type="button" class="btn btn-secondary" id="cancel" disabled>中止任务</button>
          </div>
          <div class="ws-status">
            <span>后端地址</span>
            <span class="ws-value status-idle" id="wsStatus"><span class="status-dot"></span><span id="wsUrl"></span></span>
          </div>
        </div>
      </section>

      <div class="output-grid">
        <div class="panel">
          <div class="panel-header"><span class="panel-icon">◈</span>参数提取日志</div>
          <div class="panel-content" id="logs"><div class="intel-muted">等待任务开始…</div></div>
        </div>
        <div class="panel">
          <div class="panel-header"><span class="panel-icon">◈</span>提取结果</div>
          <div class="panel-content" id="outWrap"><pre class="result-pre" id="out">// 正在提取中...</pre></div>
        </div>
      </div>

      <footer class="main-footer">
        <div class="footer-line"></div>
        <p>FASTAPI · REACT · SEED-FIRST · QWEN</p>
      </footer>
    </div>
  </div>
  <script>
    (function initBg() {
      const layer = document.getElementById('petals');
      const bloom = document.getElementById('bloom');
      const bg = document.getElementById('bg');
      for (let i = 0; i < 88; i++) {
        const el = document.createElement('span');
        el.className = 'petal';
        const size = 6 + Math.random() * 12;
        const delay = (-Math.random() * 20).toFixed(2) + 's';
        const duration = (12 + Math.random() * 16).toFixed(2) + 's';
        const sway = (3 + Math.random() * 5).toFixed(2) + 's';
        el.style.left = (Math.random() * 100).toFixed(2) + '%';
        el.style.width = size.toFixed(2) + 'px';
        el.style.height = (size * 0.72).toFixed(2) + 'px';
        el.style.animationDelay = delay + ', ' + delay;
        el.style.animationDuration = duration + ', ' + sway;
        el.style.setProperty('--drift', (-26 + Math.random() * 52).toFixed(2) + 'px');
        el.style.setProperty('--petal-opacity', (0.35 + Math.random() * 0.45).toFixed(2));
        layer.appendChild(el);
      }
      window.addEventListener('mousemove', (e) => {
        bloom.style.transform = 'translate3d(' + e.clientX + 'px,' + e.clientY + 'px,0)';
      });
      let wx = 0, wr = 0, tx = 0, tr = 0;
      function gust() {
        const dir = Math.random() > 0.5 ? 1 : -1;
        tx = dir * (88 + Math.random() * 88);
        tr = dir * (12 + Math.random() * 10);
        setTimeout(() => { tx = 0; tr = 0; setTimeout(gust, 12000 + Math.random() * 18000); }, 2200 + Math.random() * 2000);
      }
      setTimeout(gust, 4000);
      (function tick() {
        wx += (tx - wx) * 0.06; wr += (tr - wr) * 0.06;
        bg.style.setProperty('--wind-x', wx.toFixed(2) + 'px');
        bg.style.setProperty('--wind-rotate', wr.toFixed(2) + 'deg');
        requestAnimationFrame(tick);
      })();
    })();

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const wsUrl = proto + '://' + location.host + '/_ws';
    document.getElementById('wsUrl').textContent = wsUrl;

    let networkOn = true, ws = null, running = false;
    const netBtn = document.getElementById('netBtn');
    const go = document.getElementById('go');
    const cancelBtn = document.getElementById('cancel');
    const logsEl = document.getElementById('logs');
    const outWrap = document.getElementById('outWrap');
    const wsStatus = document.getElementById('wsStatus');
    const netLabel = document.getElementById('netLabel');

    function setStatus(st) { wsStatus.className = 'ws-value status-' + st; }
    function pushLog(level, message) {
      if (logsEl.querySelector('.intel-muted')) logsEl.innerHTML = '';
      const ts = new Date().toLocaleTimeString('zh-CN', { hour12: false });
      const map = { error: '错误', warn: '警告', warning: '警告', info: '信息' };
      const row = document.createElement('div');
      row.className = 'log-line';
      row.innerHTML = '<span class="log-ts">' + ts + '</span><span class="log-level log-level-' + level + '">[' + (map[level] || level || '日志') + ']</span><span class="log-message"></span>';
      row.querySelector('.log-message').textContent = message || '';
      logsEl.appendChild(row);
      logsEl.scrollTop = logsEl.scrollHeight;
    }
    function setRunning(v) {
      running = v; go.disabled = v; cancelBtn.disabled = !v; netBtn.disabled = v;
    }

    netBtn.onclick = () => {
      if (running) return;
      networkOn = !networkOn;
      netBtn.className = 'network-toggle' + (networkOn ? ' on' : '');
      netBtn.textContent = networkOn ? '+ 联网' : '离线';
      netLabel.textContent = networkOn ? '联网增强' : '离线种子';
    };

    go.onclick = () => {
      const task = document.getElementById('task').value.trim();
      if (!task || running) return;
      if (!networkOn) { pushLog('warn', '已关闭联网：请开启「+ 联网」后再开始任务'); return; }
      const seed_urls = document.getElementById('seeds').value.split(/[\n,\s]+/).map(s => s.trim()).filter(s => /^https?:\/\//i.test(s));
      logsEl.innerHTML = '';
      outWrap.innerHTML = '<div class="result-loading"><span class="pulse"></span>正在提取中…</div>';
      setRunning(true); setStatus('connecting');
      ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        setStatus('open');
        ws.send(JSON.stringify({
          type: 'start',
          payload: {
            task, mode: 'crawler', network: networkOn,
            manager_task_json: JSON.stringify({
              source: 'ui', seed_urls,
              crawl_strategy: networkOn || !seed_urls.length ? 'open_discovery' : 'crawl_seeds',
              open_web_discovery: networkOn || !seed_urls.length
            }),
            options: { maxItems: 10, maxPages: 3, webSearchEnhance: networkOn, network: networkOn }
          }
        }));
        setStatus('running');
      };
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'status') {
          const st = String(msg.payload || '');
          setStatus(st === 'start' ? 'running' : st === 'end' ? 'done' : st);
          if (st === 'end' || st === 'error' || st === 'canceled') setRunning(false);
        } else if (msg.type === 'log') {
          pushLog(msg.payload?.level || 'info', msg.payload?.message || '');
        } else if (msg.type === 'result') {
          const ar = msg.payload?.agentResult || msg.payload;
          const answer = (ar && ar.answer) || msg.payload?.report || msg.payload?.output?.content || JSON.stringify(msg.payload, null, 2);
          outWrap.innerHTML = '<pre class="result-pre" id="out"></pre>';
          document.getElementById('out').textContent = answer;
        } else if (msg.type === 'error') {
          setStatus('error');
          pushLog('error', msg.payload?.message || 'error');
        }
      };
      ws.onerror = () => { pushLog('error', 'WebSocket 错误'); setRunning(false); setStatus('error'); };
      ws.onclose = () => { setRunning(false); };
    };

    cancelBtn.onclick = () => {
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'cancel' }));
    };
  </script>
</body>
</html>
