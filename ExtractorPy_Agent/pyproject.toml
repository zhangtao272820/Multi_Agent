[project]
name = "extractorpy-agent"
version = "0.1.0"
description = "Lean Python crawler agent (Manager cap=crawler, port 13104)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "websockets>=13.0",
]

[project.scripts]
extractorpy = "app.main:main"
