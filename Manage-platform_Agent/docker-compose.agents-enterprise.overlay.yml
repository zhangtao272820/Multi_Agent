# =============================================================================
# Enterprise Docker overlay — ONLY load with -Enterprise (see scripts)
#
# Does NOT change LAN defaults. Mount via:
#   docker compose --env-file .env.agents-lan --env-file .env.agents-enterprise \
#     -f docker-compose.agents-lan.yml -f docker-compose.agents-enterprise.overlay.yml \
#     --profile monitoring up -d
#
# Adds: conservative resource limits + monitoring healthchecks.
# Monitoring profile itself lives on main compose; scripts pass --profile monitoring
# unless -NoMonitor.
# =============================================================================

services:
  clawhive_postgres:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 256M

  clawhive_redis:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 64M

  clawhive_backend:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          memory: 256M

  manager_agent:
    environment:
      # 企业档硬注入（LAN 默认不变；仅 -Enterprise 叠本 overlay 才生效）
      AGENT_SECURITY_PROFILE: ${AGENT_SECURITY_PROFILE:-enterprise}
      AGENT_SERVICE_AUTH: ${AGENT_SERVICE_AUTH:-require}
      MANAGER_AUTH_MODE: ${MANAGER_AUTH_MODE:-token}
      MGR_TENANT_FAIL_CLOSED: ${MGR_TENANT_FAIL_CLOSED:-1}
      MGR_TENANT_SCOPE: ${MGR_TENANT_SCOPE:-1}
      MANAGER_REQUEST_RATE_PER_MIN: ${MANAGER_REQUEST_RATE_PER_MIN:-60}
      MANAGER_MAX_INFLIGHT_RUNS: ${MANAGER_MAX_INFLIGHT_RUNS:-3}
      MANAGER_MAX_INFLIGHT_PER_EXPERT: ${MANAGER_MAX_INFLIGHT_PER_EXPERT:-1}
      MANAGER_RUN_MAX_TOKENS: ${MANAGER_RUN_MAX_TOKENS:-80000}
      MANAGER_MAX_RETRY: ${MANAGER_MAX_RETRY:-1}
      MANAGER_EXPERT_TRANSPORT_RETRIES: ${MANAGER_EXPERT_TRANSPORT_RETRIES:-1}
      MANAGER_AGENT_CIRCUIT_STREAK: ${MANAGER_AGENT_CIRCUIT_STREAK:-2}
      MANAGER_CIRCUIT_SKIP_CORE: ${MANAGER_CIRCUIT_SKIP_CORE:-1}
      MANAGER_GRAPH_RECURSION_LIMIT: ${MANAGER_GRAPH_RECURSION_LIMIT:-48}
      MANAGER_AUTONOMOUS_MAX_STEPS: ${MANAGER_AUTONOMOUS_MAX_STEPS:-8}
      MANAGER_DISABLED_AGENTS: ${MANAGER_DISABLED_AGENTS:-music,video,gui}
      MANAGER_PROMPT_AUTO_PROMOTE: ${MANAGER_PROMPT_AUTO_PROMOTE:-0}
      EVO_ALLOW_EXPERT_AUTO_PROMOTE: ${EVO_ALLOW_EXPERT_AUTO_PROMOTE:-0}
      MANAGER_CONTENT_TRUST_STRICT: ${MANAGER_CONTENT_TRUST_STRICT:-1}
      MANAGER_PII_POLICY: ${MANAGER_PII_POLICY:-enterprise}
      MANAGER_COST_PER_1K_TOKENS_USD: ${MANAGER_COST_PER_1K_TOKENS_USD:-0.002}
      AGENT_BROWSER_AUTH: ${AGENT_BROWSER_AUTH:-1}
      MANAGER_USER_AUTH: ${MANAGER_USER_AUTH:-1}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M

  rag_agent:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          memory: 256M

  vanna_db_agent:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          memory: 256M

  prometheus:
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 128M

  grafana:
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 64M

  alertmanager:
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/healthy >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 32M

  tempo:
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 128M

  loki:
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 128M
