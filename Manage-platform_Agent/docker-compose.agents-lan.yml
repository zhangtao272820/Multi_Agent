      LOBSTER_ANDROID_MCP_SERVERS: ${LOBSTER_ANDROID_MCP_SERVERS:-}
      LOBSTER_ADMIN_TOKEN: ${LOBSTER_ADMIN_TOKEN:-${CLAWHIVE_INTERNAL_TOKEN:-}}
      LOBSTER_WORKBENCH_PREFILL_TOKEN: ${LOBSTER_WORKBENCH_PREFILL_TOKEN:-1}
      LOBSTER_VNC_PORT: ${LOBSTER_VNC_PORT:-6080}
      LOBSTER_EXECUTION_MODE: ${LOBSTER_EXECUTION_MODE:-auto}
      LOBSTER_MCP_ENABLED: ${LOBSTER_MCP_ENABLED:-1}
      LOBSTER_ENGINE_SELECTOR: ${LOBSTER_ENGINE_SELECTOR:-1}
      LOBSTER_STAGEHAND_ENABLED: ${LOBSTER_STAGEHAND_ENABLED:-1}
      LOBSTER_ENGINE_CLASSIFIER: ${LOBSTER_ENGINE_CLASSIFIER:-1}
      LOBSTER_ENGINE_CLASSIFIER_MIN_CONF: ${LOBSTER_ENGINE_CLASSIFIER_MIN_CONF:-0.6}
      LOBSTER_MCP_STALL_RECOVERY: ${LOBSTER_MCP_STALL_RECOVERY:-1}
      LOBSTER_MCP_AUTO_RECOVER: ${LOBSTER_MCP_AUTO_RECOVER:-1}
      LOBSTER_MCP_COMPLEX_STEP_BONUS: ${LOBSTER_MCP_COMPLEX_STEP_BONUS:-8}
      LOBSTER_MCP_FINISH_MIN_CHARS: ${LOBSTER_MCP_FINISH_MIN_CHARS:-8}
      LOBSTER_MCP_MAX_STEPS_FORM: ${LOBSTER_MCP_MAX_STEPS_FORM:-32}
      LOBSTER_MCP_URL: http://playwright_mcp:8931/mcp
      LOBSTER_MCP_HEADLESS_SIDECAR: "1"
      # 低风控 MCP 调试：设为 1 时容器内 Xvfb 有头 MCP（覆盖 sidecar，noVNC 可见）
      LOBSTER_MCP_USE_LOCAL_HEADED: ${LOBSTER_MCP_USE_LOCAL_HEADED:-0}
      LOBSTER_CDP_URL: ${LOBSTER_CDP_URL:-}
      LOBSTER_SESSION_DIR: ${LOBSTER_SESSION_DIR:-/app/.data/sessions}
      LOBSTER_STORAGE_DIR: ${LOBSTER_STORAGE_DIR:-/app/.data/lobster}
      DISPLAY: ":99"
      APP_PORT: ${LOBSTER_PORT:-13108}
      HOST: "0.0.0.0"
      PORT: ${LOBSTER_PORT:-13108}
      NITRO_PORT: ${LOBSTER_PORT:-13108}
      CLAWHIVE_BACKEND_URL: http://clawhive_backend:8000
      CLAWHIVE_INTERNAL_TOKEN: ${CLAWHIVE_INTERNAL_TOKEN:-}
      AGENT_LLM_REQUEST_TIMEOUT_MS: ${AGENT_LLM_REQUEST_TIMEOUT_MS:-120000}
      AGENT_LLM_MAX_RETRIES: ${AGENT_LLM_MAX_RETRIES:-0}
      AGENT_LLM_JSON_MAX_TOKENS: ${AGENT_LLM_JSON_MAX_TOKENS:-896}
      AGENT_LLM_SYNTH_MAX_TOKENS: ${AGENT_LLM_SYNTH_MAX_TOKENS:-2048}
      CLAWHIVE_CONFIG_SYNC: "1"
      LOBSTER_MCP_EXPORT: ${LOBSTER_MCP_EXPORT:-1}
      LOBSTER_TASK_UNDERSTAND: ${LOBSTER_TASK_UNDERSTAND:-1}
      # Wave 7 · 网页 LLM-first
      LOBSTER_CLASSIC_STEP_DECIDE: ${LOBSTER_CLASSIC_STEP_DECIDE:-1}
      LOBSTER_CLASSIC_GOALS_HEURISTIC: ${LOBSTER_CLASSIC_GOALS_HEURISTIC:-0}
      LOBSTER_STEP_DECIDE_MIN_CONF: ${LOBSTER_STEP_DECIDE_MIN_CONF:-0.5}
      LOBSTER_RESULT_PAGE_GATE: ${LOBSTER_RESULT_PAGE_GATE:-1}
      LOBSTER_ENGINE_TRUTH_LOG: ${LOBSTER_ENGINE_TRUTH_LOG:-1}
      LOBSTER_NLU_METRICS: ${LOBSTER_NLU_METRICS:-1}
      NOVNC_PORT: ${LOBSTER_VNC_PORT:-6080}
      VNC_PORT: "5900"
    ports:
      - "${LOBSTER_PORT:-13108}:${LOBSTER_PORT:-13108}"
      - "${LOBSTER_VNC_PORT:-6080}:${LOBSTER_VNC_PORT:-6080}"
      # 5900 在部分 Windows 主机被系统保留；需直连 VNC 客户端时可设 LOBSTER_RAW_VNC_PORT=15900
      - "${LOBSTER_RAW_VNC_PORT:-15900}:5900"
    depends_on:
      playwright_mcp:
        condition: service_started
    volumes:
      - lobster_agent_sessions:/app/.data/sessions
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const p=process.env.APP_PORT||13108;require('http').get('http://127.0.0.1:'+p+'/api/ready',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>{try{const j=JSON.parse(d);process.exit(j.ready===true?0:1)}catch{process.exit(1)}})}).on('error',()=>process.exit(1))\""
        ]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 120s
    restart: unless-stopped

