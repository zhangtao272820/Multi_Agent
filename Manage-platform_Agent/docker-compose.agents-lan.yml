# 模型 SSOT：Manage-platform_Agent/.env.capability-models → scripts/apply-capability-models.ps1
# 同步到各 Agent/.env；Docker 仅通过 env_file 注入，勿在 services.environment 写 OPENAI_MODEL/CAP_* 等模型键。
services:
  clawhive_postgres:
    image: docker.1ms.run/pgvector/pgvector:pg16
    container_name: clawhive_postgres
    environment:
      POSTGRES_USER: ${CLAWHIVE_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${CLAWHIVE_PG_PASSWORD:-postgres}
      POSTGRES_DB: ${CLAWHIVE_PG_DB:-clawhive}
    ports:
      - "${CLAWHIVE_PG_PORT:-15432}:5432"
    volumes:
      - clawhive_pg_data:/var/lib/postgresql/data
      - ./monitoring/postgres/init-langfuse-db.sh:/docker-entrypoint-initdb.d/02-langfuse.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CLAWHIVE_PG_USER:-postgres} -d ${CLAWHIVE_PG_DB:-clawhive}"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  clawhive_redis:
    image: docker.1ms.run/library/redis:7-alpine
    container_name: clawhive_redis
    ports:
      - "${CLAWHIVE_REDIS_PORT:-16379}:6379"
    volumes:
      - clawhive_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  clawhive_backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${CLAWHIVE_PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim-bookworm}
        PIP_INDEX_URL: ${CLAWHIVE_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        APT_DEBIAN_MIRROR: ${CLAWHIVE_APT_DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        APT_SECURITY_MIRROR: ${CLAWHIVE_APT_SECURITY_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian-security}
    image: clawhive/clawhive_backend:${CLAWHIVE_IMAGE_TAG:-prod}
    container_name: clawhive_backend
    env_file:
      - path: .env.agents-lan
        required: false
    volumes:
      - ../:/workspace
      - clawhive_runtime_data:/app/.local/runtime
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DEPLOY_MODE: docker
      COMPOSE_FILE_PATH: /workspace/Manage-platform_Agent/docker-compose.agents-lan.yml
      COMPOSE_ENV_FILE_PATH: /workspace/Manage-platform_Agent/.env.agents-lan
      AGENT_CONTROL_MODE: docker
      PROMETHEUS_BASE_URL: http://prometheus:9090
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://127.0.0.1:13000}
      TEMPO_BASE_URL: http://tempo:3200
      LOKI_BASE_URL: http://loki:3100
      LITELLM_ENABLED: ${LITELLM_ENABLED:-0}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000/v1}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-clawhive-litellm}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse:3000}
      LANGFUSE_PUBLIC_URL: ${LANGFUSE_PUBLIC_URL:-http://127.0.0.1:13001}
      OIDC_ENABLED: ${OIDC_ENABLED:-0}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-roles}
      OIDC_TENANT_CLAIM: ${OIDC_TENANT_CLAIM:-tenant_id}
      OIDC_FRONTEND_CALLBACK_URL: ${OIDC_FRONTEND_CALLBACK_URL:-http://127.0.0.1:18073/}
      DATABASE_URL: postgresql+psycopg2://${CLAWHIVE_PG_USER:-postgres}:${CLAWHIVE_PG_PASSWORD:-postgres}@clawhive_postgres:5432/${CLAWHIVE_PG_DB:-clawhive}
      REDIS_URL: redis://clawhive_redis:6379/0
      CLAWHIVE_FRONTEND_PORT: ${CLAWHIVE_FRONTEND_PORT:-18073}
      CLAWHIVE_BACKEND_PORT: ${CLAWHIVE_BACKEND_PORT:-18000}
      ALLOW_ORIGINS: ${CLAWHIVE_ALLOW_ORIGINS:-http://localhost:5173,http://localhost:18073,http://127.0.0.1:18073,http://localhost:18000,http://127.0.0.1:18000}
      DB_AGENT_HOST: db_agent
      RAG_AGENT_HOST: rag_agent
      CODE_AGENT_HOST: code_assistent_agent
      EXTRACTOR_AGENT_HOST: extractor_agent
      AI_ADMIN_AGENT_HOST: ai_admin_agent
      MANAGER_AGENT_HOST: manager_agent
      MULTIMODAL_AGENT_HOST: multimodal_agent
      LOBSTER_AGENT_HOST: lobster_agent
      TAVERN_AGENT_HOST: tavern_agent
      COMPANION_AGENT_HOST: companion_agent
      MUSIC_AGENT_HOST: music_agent
      VIDEO_AGENT_HOST: video_agent
      AI_AGENT_HOST: ai_agent
      ADMIN_USERNAME: ${CLAWHIVE_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${CLAWHIVE_ADMIN_PASSWORD:-admin123}
      JWT_SECRET: ${CLAWHIVE_JWT_SECRET:-change-this-secret}
      WORKSPACE_ROOT: ${CLAWHIVE_WORKSPACE_ROOT:-/workspace}
      RUNTIME_ROOT: ${CLAWHIVE_RUNTIME_ROOT:-/app/.local/runtime}
      DB_PORT: ${DB_PORT:-13101}
      RAG_PORT: ${RAG_PORT:-13102}
      CODE_PORT: ${CODE_PORT:-13103}
      CRAWLER_PORT: ${CRAWLER_PORT:-13104}
      AI_ADMIN_PORT: ${AI_ADMIN_PORT:-13105}
      MANAGER_PORT: ${MANAGER_PORT:-13106}
      MULTIMODAL_PORT: ${MULTIMODAL_PORT:-13107}
      LOBSTER_PORT: ${LOBSTER_PORT:-13108}
      TAVERN_PORT: ${TAVERN_PORT:-13109}
      COMPANION_PORT: ${COMPANION_PORT:-13115}
      MUSIC_AGENT_PORT: ${MUSIC_AGENT_PORT:-13110}
      VIDEO_AGENT_PORT: ${VIDEO_AGENT_PORT:-13111}
      AI_AGENT_PORT: ${AI_AGENT_PORT:-13112}
      MAX_TASK_RETRIES: ${CLAWHIVE_MAX_TASK_RETRIES:-2}
      # QWEN_* 模型名：由 env_file（.env.agents-lan，sync-capability-models 同步）注入
      QWEN_TEMPERATURE: ${QWEN_TEMPERATURE:-0.2}
      CLAWHIVE_INTERNAL_TOKEN: ${CLAWHIVE_INTERNAL_TOKEN:-}
      AGENT_LLM_REQUEST_TIMEOUT_MS: ${AGENT_LLM_REQUEST_TIMEOUT_MS:-120000}
      AGENT_LLM_MAX_RETRIES: ${AGENT_LLM_MAX_RETRIES:-0}
      AGENT_LLM_JSON_MAX_TOKENS: ${AGENT_LLM_JSON_MAX_TOKENS:-896}
      AGENT_LLM_SYNTH_MAX_TOKENS: ${AGENT_LLM_SYNTH_MAX_TOKENS:-2048}
      SKILL_REGISTRY_URLS: ${SKILL_REGISTRY_URLS:-}
      SKILL_REGISTRY_TOKEN: ${SKILL_REGISTRY_TOKEN:-}
      SKILL_REGISTRY_CACHE_TTL_SEC: ${SKILL_REGISTRY_CACHE_TTL_SEC:-300}
      SKILL_SYNC_ON_INSTALL: ${SKILL_SYNC_ON_INSTALL:-1}
      SKILL_SYNC_AGENT_RELOAD: ${SKILL_SYNC_AGENT_RELOAD:-0}
      SKILL_SYNC_RELOAD_TIMEOUT_SEC: ${SKILL_SYNC_RELOAD_TIMEOUT_SEC:-10}
      SKILL_INSTALL_REQUIRE_PUBLISHED: ${SKILL_INSTALL_REQUIRE_PUBLISHED:-1}
      SKILL_REGISTRY_DB_CACHE: ${SKILL_REGISTRY_DB_CACHE:-1}
    ports:
      - "${CLAWHIVE_BACKEND_PORT:-18000}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=5); d=r.read(); sys.exit(0 if b'\\\"ready\\\": true' in d or b'\\\"ready\\\":true' in d else 1)\""
        ]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 45s
    depends_on:
      clawhive_postgres:
        condition: service_healthy
      clawhive_redis:
        condition: service_healthy
    restart: unless-stopped

  clawhive_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: clawhive/clawhive_frontend:${CLAWHIVE_IMAGE_TAG:-prod}
    container_name: clawhive_frontend
    ports:
      - "${CLAWHIVE_FRONTEND_PORT:-18073}:80"
    depends_on:
      clawhive_backend:
        condition: service_healthy
    restart: unless-stopped

  db_agent:
    build:
      context: ..
      dockerfile: Manage-platform_Agent/docker/nuxt-agent/Dockerfile
      args:
        NODE_BASE_IMAGE: ${AGENT_NODE_IMAGE:-docker.m.daocloud.io/library/node:20-bullseye}
        NPM_CONFIG_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        AGENT_DIR: DB_Agent
        DEFAULT_PORT: ${DB_PORT:-13101}
    image: clawhive/db_agent:${CLAWHIVE_IMAGE_TAG:-prod}
    container_name: db_agent
    env_file:
      - path: ../DB_Agent/.env
        required: false
      - path: .env.agents-lan
        required: false
    environment:
      PORT: ${DB_PORT:-13101}
      DB_PORT: ${DB_PORT:-13101}
      NITRO_PORT: ${DB_PORT:-13101}
      HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
      MYSQL_HOST: ${DB_AGENT_MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${DB_AGENT_MYSQL_PORT:-3306}
      MYSQL_USER: ${DB_AGENT_MYSQL_USER:-root}
      MYSQL_PASSWORD: ${DB_AGENT_MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_AGENT_MYSQL_DATABASE:-p2026}
      DEFAULT_DB_ID: ${DB_AGENT_DEFAULT_DB_ID:-default}
      DB_AGENT_LOCK_DB_ID: ${DB_AGENT_LOCK_DB_ID:-}
      AGENT_DOMAIN: ${DB_AGENT_DOMAIN:-p2026}
      DB_AGENT_DOMAIN: ${DB_AGENT_DOMAIN:-p2026}
      DB_AGENT_PROFILE: ${DB_AGENT_PROFILE:-balanced}
      ENABLE_SCHEMA_FIRST_ROUTE: ${ENABLE_SCHEMA_FIRST_ROUTE:-1}
      ENABLE_SCHEMA_TABLE_JUDGE: ${ENABLE_SCHEMA_TABLE_JUDGE:-1}
      ENABLE_STRUCTURAL_PLAN: ${ENABLE_STRUCTURAL_PLAN:-0}
      ENABLE_METRICS_DIRECT: ${ENABLE_METRICS_DIRECT:-0}
      AGENT_FALLBACK_ONLY_ON_HARD_FAIL: ${AGENT_FALLBACK_ONLY_ON_HARD_FAIL:-1}
      ENABLE_DOMAIN_SKILLS: ${DB_AGENT_ENABLE_DOMAIN_SKILLS:-false}
      DB_AGENT_ENABLE_DOMAIN_TOOLS: ${DB_AGENT_ENABLE_DOMAIN_TOOLS:-false}
      DB_AGENT_TABLE_HINTS_JSON: ${DB_AGENT_TABLE_HINTS_JSON:-}
      DB_AGENT_MODEL_TABLE_RERANK: ${DB_AGENT_MODEL_TABLE_RERANK:-false}
      ENABLE_EXPLAIN_PREFLIGHT: ${DB_ENABLE_EXPLAIN_PREFLIGHT:-1}
      CLAWHIVE_BACKEND_URL: http://clawhive_backend:8000
      CLAWHIVE_INTERNAL_TOKEN: ${CLAWHIVE_INTERNAL_TOKEN:-}
      AGENT_LLM_REQUEST_TIMEOUT_MS: ${AGENT_LLM_REQUEST_TIMEOUT_MS:-120000}
      AGENT_LLM_MAX_RETRIES: ${AGENT_LLM_MAX_RETRIES:-0}
      AGENT_LLM_JSON_MAX_TOKENS: ${AGENT_LLM_JSON_MAX_TOKENS:-896}
      AGENT_LLM_SYNTH_MAX_TOKENS: ${AGENT_LLM_SYNTH_MAX_TOKENS:-2048}
      CLAWHIVE_CONFIG_SYNC: ${CLAWHIVE_CONFIG_SYNC:-0}
      # LLM 模型/API：由 env_file（DB_Agent/.env + .env.agents-lan）注入，勿在此覆盖
      NUXT_MYSQL_HOST: ${DB_AGENT_MYSQL_HOST:-host.docker.internal}
      NUXT_MYSQL_PORT: ${DB_AGENT_MYSQL_PORT:-3306}
      NUXT_MYSQL_USER: ${DB_AGENT_MYSQL_USER:-root}
      NUXT_MYSQL_PASSWORD: ${DB_AGENT_MYSQL_PASSWORD:-123456}
      NUXT_MYSQL_DATABASE: ${DB_AGENT_MYSQL_DATABASE:-p2026}
      AGENT_DATABASE_URL: postgresql://${CLAWHIVE_PG_USER:-postgres}:${CLAWHIVE_PG_PASSWORD:-postgres}@clawhive_postgres:5432/${CLAWHIVE_PG_DB:-clawhive}
      DB_AGENT_STORAGE_BACKEND: ${DB_AGENT_STORAGE_BACKEND:-postgres}
      DB_VECTOR_BACKEND: ${DB_VECTOR_BACKEND:-pgvector}
      EVO_VERIFY_BEFORE_PROMOTE: ${EVO_VERIFY_BEFORE_PROMOTE:-1}
      EVO_AGENT_PROMPT_EXECUTION_ONLY: ${EVO_AGENT_PROMPT_EXECUTION_ONLY:-1}
      EVO_PROMOTE_REQUIRES_VERIFY: ${EVO_PROMOTE_REQUIRES_VERIFY:-1}
    ports:
      - "${DB_PORT:-13101}:${DB_PORT:-13101}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      clawhive_postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const p=process.env.PORT||13101;require('http').get('http://127.0.0.1:'+p+'/api/ready',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>{try{const j=JSON.parse(d);process.exit(j.ready===true?0:1)}catch{process.exit(1)}})}).on('error',()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped

  rag_agent:
    build:
      context: ..
      dockerfile: Manage-platform_Agent/docker/nuxt-agent/Dockerfile
      args:
        NODE_BASE_IMAGE: ${AGENT_NODE_IMAGE:-docker.m.daocloud.io/library/node:20-bullseye}
        NPM_CONFIG_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        AGENT_DIR: RAG_Agent
        DEFAULT_PORT: ${RAG_PORT:-13102}
    image: clawhive/rag_agent:${CLAWHIVE_IMAGE_TAG:-prod}
    container_name: rag_agent
    env_file:
      - path: ../RAG_Agent/.env
        required: false
      - path: .env.agents-lan
        required: false
    volumes:
      - rag_agent_data:/app/.data
    environment:
      PORT: ${RAG_PORT:-13102}
      RAG_PORT: ${RAG_PORT:-13102}
      NITRO_PORT: ${RAG_PORT:-13102}
      HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
      CLAWHIVE_BACKEND_URL: http://clawhive_backend:8000
      CLAWHIVE_INTERNAL_TOKEN: ${CLAWHIVE_INTERNAL_TOKEN:-}
      AGENT_LLM_REQUEST_TIMEOUT_MS: ${AGENT_LLM_REQUEST_TIMEOUT_MS:-120000}
      AGENT_LLM_MAX_RETRIES: ${AGENT_LLM_MAX_RETRIES:-0}
      AGENT_LLM_JSON_MAX_TOKENS: ${AGENT_LLM_JSON_MAX_TOKENS:-896}
      AGENT_LLM_SYNTH_MAX_TOKENS: ${AGENT_LLM_SYNTH_MAX_TOKENS:-2048}
      CLAWHIVE_CONFIG_SYNC: ${CLAWHIVE_CONFIG_SYNC:-0}
      # LLM 模型/API：由 env_file（RAG_Agent/.env + .env.agents-lan）注入
      RAG_VECTOR_BACKEND: pgvector
      RAG_PG_CONNECTION_STRING: ${RAG_PG_CONNECTION_STRING:-postgresql://postgres:postgres@rag_pgvector:5432/rag_vector}
      RAG_PG_TABLE_NAME: ${RAG_PG_TABLE_NAME:-rag_documents}
      RAG_MIGRATE_LEGACY_MEMORY_ON_BOOT: ${RAG_MIGRATE_LEGACY_MEMORY_ON_BOOT:-1}
      RAG_ENABLE_BM25: ${RAG_ENABLE_BM25:-1}
      RAG_RRF_BM25_WEIGHT: ${RAG_RRF_BM25_WEIGHT:-0.85}
      AGENT_DATABASE_URL: postgresql://${CLAWHIVE_PG_USER:-postgres}:${CLAWHIVE_PG_PASSWORD:-postgres}@clawhive_postgres:5432/${CLAWHIVE_PG_DB:-clawhive}
      RAG_AGENT_STORAGE_BACKEND: ${RAG_AGENT_STORAGE_BACKEND:-postgres}
      EVO_VERIFY_BEFORE_PROMOTE: ${EVO_VERIFY_BEFORE_PROMOTE:-1}
      EVO_AGENT_PROMPT_EXECUTION_ONLY: ${EVO_AGENT_PROMPT_EXECUTION_ONLY:-1}
      EVO_PROMOTE_REQUIRES_VERIFY: ${EVO_PROMOTE_REQUIRES_VERIFY:-1}
      RAG_MCP_SERVER: ${RAG_MCP_SERVER:-1}
    ports:
      - "${RAG_PORT:-13102}:${RAG_PORT:-13102}"
    depends_on:
      rag_pgvector:
        condition: service_healthy
      clawhive_postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const p=process.env.PORT||13102;require('http').get('http://127.0.0.1:'+p+'/api/ready',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>{try{const j=JSON.parse(d);process.exit(j.ready===true?0:1)}catch{process.exit(1)}})}).on('error',()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s
    restart: unless-stopped

  rag_pgvector:
    image: docker.1ms.run/pgvector/pgvector:pg16
    container_name: rag_pgvector
    environment:
      POSTGRES_USER: ${RAG_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${RAG_PG_PASSWORD:-postgres}
      POSTGRES_DB: ${RAG_PG_DB:-rag_vector}
    ports:
      - "${RAG_PG_PORT:-15433}:5432"
    volumes:
      - rag_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAG_PG_USER:-postgres} -d ${RAG_PG_DB:-rag_vector}"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  code_assistent_agent:
    build:
      context: ..
      dockerfile: Manage-platform_Agent/docker/nuxt-agent/Dockerfile
      args:
        NODE_BASE_IMAGE: ${AGENT_NODE_IMAGE:-docker.m.daocloud.io/library/node:20-bullseye}
        NPM_CONFIG_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        AGENT_DIR: code_assistent_Agent
        DEFAULT_PORT: ${CODE_PORT:-13103}
    image: clawhive/code_assistent_agent:${CLAWHIVE_IMAGE_TAG:-prod}
    container_name: code_assistent_agent
    env_file:
      - path: ../code_assistent_Agent/.env
        required: false
      - path: .env.agents-lan
        required: false
    environment:
      PORT: ${CODE_PORT:-13103}
      NITRO_PORT: ${CODE_PORT:-13103}
      HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
      CLAWHIVE_BACKEND_URL: http://clawhive_backend:8000
      CLAWHIVE_INTERNAL_TOKEN: ${CLAWHIVE_INTERNAL_TOKEN:-}
      AGENT_LLM_REQUEST_TIMEOUT_MS: ${AGENT_LLM_REQUEST_TIMEOUT_MS:-120000}
      AGENT_LLM_MAX_RETRIES: ${AGENT_LLM_MAX_RETRIES:-0}
      AGENT_LLM_JSON_MAX_TOKENS: ${AGENT_LLM_JSON_MAX_TOKENS:-896}
      AGENT_LLM_SYNTH_MAX_TOKENS: ${AGENT_LLM_SYNTH_MAX_TOKENS:-2048}
      CLAWHIVE_CONFIG_SYNC: ${CLAWHIVE_CONFIG_SYNC:-1}
      EVO_VERIFY_BEFORE_PROMOTE: ${EVO_VERIFY_BEFORE_PROMOTE:-1}
      EVO_AGENT_PROMPT_EXECUTION_ONLY: ${EVO_AGENT_PROMPT_EXECUTION_ONLY:-1}
      EVO_PROMOTE_REQUIRES_VERIFY: ${EVO_PROMOTE_REQUIRES_VERIFY:-1}
      # Agent 矩阵升级 Wave 3（Code MCP + understand）
      CODE_MCP_SERVER: ${CODE_MCP_SERVER:-1}
      CODE_TASK_UNDERSTAND: ${CODE_TASK_UNDERSTAND:-1}
      COMMAND_TOOL_ENABLED: ${COMMAND_TOOL_ENABLED:-1}
      WRITE_TOOL_ENABLED: ${WRITE_TOOL_ENABLED:-1}
      CODE_REPO_MAP_TOKENS: ${CODE_REPO_MAP_TOKENS:-1024}
      CODE_EDIT_VALIDATE_REQUIRED: ${CODE_EDIT_VALIDATE_REQUIRED:-1}
      CODE_EDIT_FORMAT: ${CODE_EDIT_FORMAT:-search_replace}
      # 宿主 monorepo → 容器内 /workspace（Workbench「项目根目录」填 /workspace）
      PROJECT_DIR: ${CODE_PROJECT_DIR:-/workspace}
      ALLOWED_ROOTS: ${CODE_ALLOWED_ROOTS:-/workspace,/app}
      # LLM 模型/API：由 env_file（code_assistent_Agent/.env + .env.agents-lan）注入，勿在此覆盖
    ports:
      - "${CODE_PORT:-13103}:${CODE_PORT:-13103}"
    volumes:
      - ../:/workspace
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const p=process.env.PORT||13103;require('http').get('http://127.0.0.1:'+p+'/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>require('http').get('http://127.0.0.1:'+p,r2=>process.exit(r2.statusCode<500?0:1)).on('error',()=>process.exit(1)))\""]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  extractor_agent:
    build:
      context: ..
      dockerfile: Extractor_Agent/Dockerfile
      args:
        NODE_BASE_IMAGE: ${AGENT_NODE_IMAGE:-docker.m.daocloud.io/library/node:20-bullseye}
        NPM_CONFIG_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        DEBIAN_APT_MIRROR: ${DEBIAN_APT_MIRROR:-mirrors.aliyun.com}
        DEFAULT_PORT: ${CRAWLER_PORT:-13104}
        PLAYWRIGHT_VERSION: ${EXTRACTOR_PLAYWRIGHT_VERSION:-1.59.1}
    image: clawhive/extractor_agent:${CLAWHIVE_IMAGE_TAG:-prod}
    container_name: extractor_agent
    env_file:
      - path: ../Extractor_Agent/.env
        required: false
      - path: .env.agents-lan
        required: false
    environment:
      PORT: ${CRAWLER_PORT:-13104}
      CRAWLER_PORT: ${CRAWLER_PORT:-13104}
      NUXT_TELEMETRY_DISABLED: "1"
      HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,extractor_agent,manager_agent,db_agent,rag_agent,code_assistent_agent,ai_admin_agent,video_agent,ai_agent,searxng,crw}
      CLAWHIVE_BACKEND_URL: http://clawhive_backend:8000
      CLAWHIVE_INTERNAL_TOKEN: ${CLAWHIVE_INTERNAL_TOKEN:-}
      AGENT_LLM_REQUEST_TIMEOUT_MS: ${AGENT_LLM_REQUEST_TIMEOUT_MS:-120000}
      AGENT_LLM_MAX_RETRIES: ${AGENT_LLM_MAX_RETRIES:-0}
      AGENT_LLM_JSON_MAX_TOKENS: ${AGENT_LLM_JSON_MAX_TOKENS:-896}
      AGENT_LLM_SYNTH_MAX_TOKENS: ${AGENT_LLM_SYNTH_MAX_TOKENS:-2048}
      CLAWHIVE_CONFIG_SYNC: ${CLAWHIVE_CONFIG_SYNC:-1}
      # 爬虫 LLM 对齐能力层 SSOT（T0 route / T3 vision），避免被 .env.agents-lan 全局 QWEN_MODEL 覆盖
      QWEN_MODEL: ${CAP_ROUTE:-qwen3-14b}
      QWEN_VL_MODEL: ${CAP_VISION:-qwen-vl-plus}
      # 其余 LLM/API 由 env_file 注入
      EXTRACTOR_DOMAIN_POLITE_DELAY_MS: ${EXTRACTOR_DOMAIN_POLITE_DELAY_MS:-1200}
      CRAWLER_MAX_CONCURRENCY: ${CRAWLER_MAX_CONCURRENCY:-3}
      REDIS_URL: ${REDIS_URL:-redis://clawhive_redis:6379/0}
      EXTRACTOR_QUEUE_BACKEND: ${EXTRACTOR_QUEUE_BACKEND:-local}
      EXTRACTOR_ASYNC_QUEUE: ${EXTRACTOR_ASYNC_QUEUE:-1}
      # 独立 UI 联网找页 → seed_urls（与总管 SearXNG 同源）
      EXTRACTOR_WEB_SEARCH: ${EXTRACTOR_WEB_SEARCH:-1}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      SEARXNG_TIMEOUT_MS: ${SEARXNG_TIMEOUT_MS:-25000}
      # 云抓取兜底：默认 CRW 自托管（Firecrawl 兼容），不再依赖商业配额
      MCP_PROVIDER: ${MCP_PROVIDER:-firecrawl}
      MCP_BASE_URL: ${MCP_BASE_URL:-http://crw:3000/v1/scrape}
      MCP_API_KEY: ${MCP_API_KEY:-local}
      MCP_RENDER: ${MCP_RENDER:-on}
      EXTRACTOR_MCP_MAX_CALLS: ${EXTRACTOR_MCP_MAX_CALLS:-12}
      EVO_VERIFY_BEFORE_PROMOTE: ${EVO_VERIFY_BEFORE_PROMOTE:-1}
      EVO_AGENT_PROMPT_EXECUTION_ONLY: ${EVO_AGENT_PROMPT_EXECUTION_ONLY:-1}
      EVO_PROMOTE_REQUIRES_VERIFY: ${EVO_PROMOTE_REQUIRES_VERIFY:-1}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
    ports:
      - "${CRAWLER_PORT:-13104}:${CRAWLER_PORT:-13104}"
    depends_on:
      crw:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const p=process.env.CRAWLER_PORT||13104;require('http').get('http://127.0.0.1:'+p+'/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
        ]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 120s
    restart: unless-stopped

  # 本地热更新开发：docker compose --profile extractor-dev up extractor_agent_dev
  extractor_agent_dev:
    profiles: ["extractor-dev"]
    image: docker.1ms.run/library/node:20-bullseye
    container_name: extractor_agent_dev
    working_dir: /app
    env_file:
      - path: ../Extractor_Agent/.env
        required: false
      - path: .env.agents-lan
        required: false
    volumes:
      - ../Extractor_Agent:/app
      - extractor_agent_node_modules:/app/node_modules
      - extractor_agent_nuxt:/app/.nuxt
      - extractor_agent_playwright:/ms-playwright
    environment:
      PORT: ${CRAWLER_PORT:-13104}
      CRAWLER_PORT: ${CRAWLER_PORT:-13104}
      NPM_CONFIG_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-https://npmmirror.com/mirrors/playwright}
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: ${PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT:-180000}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,extractor_agent,manager_agent,db_agent,rag_agent,code_assistent_agent,ai_admin_agent,video_agent,ai_agent,searxng,crw}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NUXT_TELEMETRY_DISABLED: "1"
      CLAWHIVE_BACKEND_URL: http://clawhive_backend:8000
      CLAWHIVE_INTERNAL_TOKEN: ${CLAWHIVE_INTERNAL_TOKEN:-}
      AGENT_LLM_REQUEST_TIMEOUT_MS: ${AGENT_LLM_REQUEST_TIMEOUT_MS:-120000}
      AGENT_LLM_MAX_RETRIES: ${AGENT_LLM_MAX_RETRIES:-0}
      AGENT_LLM_JSON_MAX_TOKENS: ${AGENT_LLM_JSON_MAX_TOKENS:-896}
      AGENT_LLM_SYNTH_MAX_TOKENS: ${AGENT_LLM_SYNTH_MAX_TOKENS:-2048}
      CLAWHIVE_CONFIG_SYNC: ${CLAWHIVE_CONFIG_SYNC:-1}
      EXTRACTOR_WEB_SEARCH: ${EXTRACTOR_WEB_SEARCH:-1}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      SEARXNG_TIMEOUT_MS: ${SEARXNG_TIMEOUT_MS:-25000}
      MCP_PROVIDER: ${MCP_PROVIDER:-firecrawl}
      MCP_BASE_URL: ${MCP_BASE_URL:-http://crw:3000/v1/scrape}
      MCP_API_KEY: ${MCP_API_KEY:-local}
      MCP_RENDER: ${MCP_RENDER:-on}
    command: ["sh", "/app/scripts/docker-entrypoint.sh"]
    ports:
      - "${CRAWLER_PORT:-13104}:${CRAWLER_PORT:-13104}"
    depends_on:
      crw:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const p=process.env.CRAWLER_PORT||13104;require('http').get('http://127.0.0.1:'+p+'/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 8s
      retries: 24
      start_period: 900s
    restart: unless-stopped

  ai_admin_agent:
    build:
      context: ../AI_admin_Agent/backend
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${AI_ADMIN_PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim-bookworm}
        PIP_INDEX_URL: ${AI_ADMIN_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: clawhive/ai_admin_agent:${CLAWHIVE_IMAGE_TAG:-prod}
    container_name: ai_admin_agent
    working_dir: /app
    env_file:
      # 共享 LAN 配置；backend/.env 改挂载见 volumes（restart 即可生效，勿重复 env_file 避免 stale）
      - path: .env.agents-lan
        required: false
    volumes:
      - ../AI_admin_Agent/frontend/dist:/frontend-dist:ro
      - ../AI_admin_Agent/backend/workspace:/app/workspace
      - ../AI_admin_Agent/backend/data:/app/data
      - ../AI_admin_Agent/backend/.env:/app/.env:ro
    environment:
      FRONTEND_DIST_DIR: /frontend-dist
      WORKSPACE_DIR: /app/workspace
      ADMIN_DATA_DIR: /app/data
      CLAWHIVE_BACKEND_URL: http://clawhive_backend:8000
      CLAWHIVE_INTERNAL_TOKEN: ${CLAWHIVE_INTERNAL_TOKEN:-}
      AGENT_LLM_REQUEST_TIMEOUT_MS: ${AGENT_LLM_REQUEST_TIMEOUT_MS:-120000}
      AGENT_LLM_MAX_RETRIES: ${AGENT_LLM_MAX_RETRIES:-0}
      AGENT_LLM_JSON_MAX_TOKENS: ${AGENT_LLM_JSON_MAX_TOKENS:-896}
      AGENT_LLM_SYNTH_MAX_TOKENS: ${AGENT_LLM_SYNTH_MAX_TOKENS:-2048}
      # 单轮图执行上限（须 ≤ Manager AGENT_TIMEOUT，超时必回 WS error，避免总管空等）
      ADMIN_WS_TURN_TIMEOUT_SEC: ${ADMIN_WS_TURN_TIMEOUT_SEC:-90}
      # Embedding：未设 OPENAI_BASE_URL 时代码会回退百炼 compatible-mode；显式配置更稳
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-v1}
      ADMIN_EMBEDDING_TIMEOUT_SEC: ${ADMIN_EMBEDDING_TIMEOUT_SEC:-12}
      CLAWHIVE_CONFIG_SYNC: ${CLAWHIVE_CONFIG_SYNC:-1}
      # MODEL_NAME 由挂载的 backend/.env 提供（sync-capability-models.py 同步 SSOT）
      RAG_AGENT_URL: http://rag_agent:13102
      ADMIN_PROMPT_EVOLUTION: ${ADMIN_PROMPT_EVOLUTION:-1}
      ADMIN_AUTO_CURATE: ${ADMIN_AUTO_CURATE:-1}
      ADMIN_PROMOTE_MIN_HITS: ${ADMIN_PROMOTE_MIN_HITS:-3}
      ADMIN_MCP_ENABLED: ${ADMIN_MCP_ENABLED:-0}
      # 总管编排时写操作 HITL 由 Manager 控制；禁止 Admin 侧无条件 auto_confirm
      ADMIN_MANAGER_AUTO_CONFIRM: ${ADMIN_MANAGER_AUTO_CONFIRM:-0}
      ADMIN_LANGGRAPH_CHECKPOINTER: ${ADMIN_LANGGRAPH_CHECKPOINTER:-0}
      ADMIN_STORAGE_BACKEND: ${ADMIN_STORAGE_BACKEND:-postgres}
      ADMIN_PLAN_FASTPATH: ${ADMIN_PLAN_FASTPATH:-1}
      ADMIN_MEMORY_FAST: ${ADMIN_MEMORY_FAST:-1}
      ADMIN_TURN_SCOPE_LLM: ${ADMIN_TURN_SCOPE_LLM:-1}
      AGENT_DATABASE_URL: postgresql://${CLAWHIVE_PG_USER:-postgres}:${CLAWHIVE_PG_PASSWORD:-postgres}@clawhive_postgres:5432/${CLAWHIVE_PG_DB:-clawhive}
      EVO_VERIFY_BEFORE_PROMOTE: ${EVO_VERIFY_BEFORE_PROMOTE:-1}
      EVO_AGENT_PROMPT_EXECUTION_ONLY: ${EVO_AGENT_PROMPT_EXECUTION_ONLY:-1}
      EVO_PROMOTE_REQUIRES_VERIFY: ${EVO_PROMOTE_REQUIRES_VERIFY:-1}
      DB_AGENT_HTTP_URL: http://db_agent:13101
      DB_AGENT_DB_ID: ${DB_AGENT_DB_ID:-default}
      LOBSTER_AGENT_HTTP_URL: ${LOBSTER_AGENT_HTTP_URL:-http://lobster_agent:13108}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      ADMIN_SEARCH_PROVIDER: ${ADMIN_SEARCH_PROVIDER:-auto}
      WEB_SEARCH_ALLOW_DDG_FALLBACK: ${WEB_SEARCH_ALLOW_DDG_FALLBACK:-1}
      ADMIN_MCP_GATEWAY_URL: ${ADMIN_MCP_GATEWAY_URL:-http://admin_mcp_gateway:8790}
      MINERU_API_URL: ${MINERU_API_URL:-}
    command: uvicorn app.main:app --host 0.0.0.0 --port ${AI_ADMIN_PORT:-13105}
    ports:
      - "${AI_ADMIN_PORT:-13105}:${AI_ADMIN_PORT:-13105}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:${AI_ADMIN_PORT:-13105}/api/health',timeout=5); sys.exit(0 if r.status==200 else 1)\""
        ]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 45s
    depends_on:
      clawhive_postgres:
        condition: service_healthy
      searxng:
        condition: service_started
    restart: unless-stopped

  # 自建云抓取（CRW，Firecrawl 兼容 API）：Extractor MCP_* 指向此服务，免商业配额
  crw:
    image: ${CRW_IMAGE:-ghcr.io/us/crw:latest}
    container_name: crw
    environment:
      PORT: "3000"
      # 本地任意；Extractor MCP_API_KEY 需与此一致（可空表示不校验）
      CRW_API_KEY: ${CRW_API_KEY:-local}
    # 宿主机端口避开 Grafana(:13000)；容器内 extractor 仍用 http://crw:3000
    ports:
      - "${CRW_PORT:-13114}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || curl -sf http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 0"
        ]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # 自建联网检索（SearXNG）：总管 WEB_SEARCH_PROVIDER=searxng 时调用
  searxng:
    image: ${SEARXNG_IMAGE:-docker.1ms.run/searxng/searxng:latest}
    container_name: searxng
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_PUBLIC_URL:-http://localhost:${SEARXNG_PORT:-8088}/}
    volumes:
      - ./docker/searxng:/etc/searxng:rw
    ports:
      - "${SEARXNG_PORT:-8088}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || wget -qO- 'http://127.0.0.1:8080/search?q=health&format=json' >/dev/null 2>&1 || exit 1"
        ]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 45s
    restart: unless-stopped

  # Phase 2/3：Admin MCP 趣味八件套侧车（supergateway + nginx）
  admin_mcp_gateway:
    profiles: ["fun-mcp"]
    build:
      context: ../AI_admin_Agent/mcp-gateway
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${MCP_GATEWAY_NODE_IMAGE:-docker.m.daocloud.io/library/node:20-bookworm}
    image: clawhive/admin_mcp_gateway:${CLAWHIVE_IMAGE_TAG:-prod}
    container_name: admin_mcp_gateway
    volumes:
      - admin_mcp_memory:/data/memory
      - admin_mcp_cron:/data/cron
    ports:
      - "${ADMIN_MCP_GATEWAY_PORT:-8790}:8790"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8790/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 120s
    restart: unless-stopped

  # Phase 3：MinerU 兼容 API（轻量 PDF 提取；可换真实 MinerU）
  mineru_api:
    profiles: ["fun-mcp"]
    build:
      context: ../AI_admin_Agent/mineru-api
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${MINERU_PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim-bookworm}
    image: clawhive/mineru_api:${CLAWHIVE_IMAGE_TAG:-prod}
    container_name: mineru_api
    environment:
      MINERU_WORKSPACE_DIR: /data/workspace
    volumes:
      - ../AI_admin_Agent/backend/workspace:/data/workspace:ro
    ports:
      - "${MINERU_API_PORT:-8798}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)\""]
      interval: 15s
      timeout: 6s
      retries: 6
      start_period: 30s
    restart: unless-stopped

