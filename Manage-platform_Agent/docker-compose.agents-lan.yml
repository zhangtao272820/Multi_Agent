  # 可选：Browserless 远程 CDP 池（lobster 设 LOBSTER_CDP_URL=ws://browserless:3000?token=...）
  browserless:
    profiles: ["extended"]
    image: browserless/chrome:latest
    container_name: browserless
    environment:
      MAX_CONCURRENT_SESSIONS: "3"
      TOKEN: ${BROWSERLESS_TOKEN:-lobster-dev}
      ENABLE_DEBUGGER: "true"
    ports:
      - "${BROWSERLESS_PORT:-3000}:3000"
    restart: unless-stopped

  # Playwright MCP sidecar：供 lobster_agent 的 LOBSTER_MCP_URL 使用（无障碍树浏览器自动化）
  playwright_mcp:
    image: mcr.microsoft.com/playwright:v1.59.1-jammy
    container_name: playwright_mcp
    working_dir: /app
    command:
      - bash
      - -c
      - |
        CHROME=$$(find /ms-playwright -path '*/chrome-linux64/chrome' -type f 2>/dev/null | head -1)
        if [ -z "$$CHROME" ]; then echo "playwright_mcp: chromium binary not found under /ms-playwright" >&2; exit 1; fi
        exec npx -y @playwright/mcp@latest --port 8931 --host 0.0.0.0 --allowed-hosts '*' --headless --executable-path="$$CHROME"
    ports:
      - "${PLAYWRIGHT_MCP_PORT:-18931}:8931"
    restart: unless-stopped

  lobster_agent:
    build:
      context: ..
      dockerfile: Lobster_Agent/Dockerfile
    image: clawhive/lobster_agent:${CLAWHIVE_IMAGE_TAG:-prod}
    container_name: lobster_agent
    working_dir: /app
    env_file:
      - path: ../Lobster_Agent/.env
        required: false
      - path: .env.agents-lan
        required: false
    environment:
      LOBSTER_HEADLESS: "false"
      LOBSTER_BROWSER_PROFILE: ${LOBSTER_BROWSER_PROFILE:-managed}
      LOBSTER_BROWSER_CDP_URL: ${LOBSTER_BROWSER_CDP_URL:-}
      LOBSTER_DESKTOP_MCP_ENABLED: ${LOBSTER_DESKTOP_MCP_ENABLED:-0}
      LOBSTER_DESKTOP_MCP_SERVERS: ${LOBSTER_DESKTOP_MCP_SERVERS:-}
