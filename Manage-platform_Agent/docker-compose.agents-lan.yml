      CLAWHIVE_BACKEND_URL: http://clawhive_backend:8000
      CLAWHIVE_INTERNAL_TOKEN: ${CLAWHIVE_INTERNAL_TOKEN:-}
      AGENT_LLM_REQUEST_TIMEOUT_MS: ${AGENT_LLM_REQUEST_TIMEOUT_MS:-120000}
      AGENT_LLM_MAX_RETRIES: ${AGENT_LLM_MAX_RETRIES:-0}
      AGENT_LLM_JSON_MAX_TOKENS: ${AGENT_LLM_JSON_MAX_TOKENS:-896}
      AGENT_LLM_SYNTH_MAX_TOKENS: ${AGENT_LLM_SYNTH_MAX_TOKENS:-2048}
      CLAWHIVE_CONFIG_SYNC: "1"
      # LLM 模型/API：由 env_file（Video_Agent/.env + .env.agents-lan）注入，勿在此覆盖
      VIDEO_FRONTEND_DIST: /video/frontend/dist
      OUTPUT_DIR: .data/video/out
      CORS_ORIGINS: ${VIDEO_AGENT_CORS_ORIGINS:-http://localhost:13111,http://127.0.0.1:13111}
      # 容器内 127.0.0.1 指向本容器，须用 Compose 服务名访问 music_agent（覆盖 ../Video_Agent/.env 的本机端口）
      MUSIC_AGENT_HTTP_URL: ${VIDEO_AGENT_MUSIC_AGENT_HTTP_URL:-http://music_agent:13110}
      BGM_ENABLED: ${VIDEO_AGENT_BGM_ENABLED:-true}
    ports:
      - "${VIDEO_AGENT_PORT:-13111}:13111"
    volumes:
      - video_agent_out:/video/.data/video/out
    depends_on:
      music_agent:
        condition: service_started
    restart: unless-stopped

  # AI_Agent 本地对口型（Ultralight / MuseTalk / Wav2Lip）；需 GPU，默认不随 extended 启动
  # 启用：docker compose --profile extended --profile lipsync up -d ai_agent_lipsync ai_agent
  ai_agent_lipsync:
    profiles: ["lipsync"]
    build:
      context: ../AI_Agent/services/lipsync
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${AI_AGENT_LIPSYNC_PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim-bookworm}
        PIP_INDEX_URL: ${AI_AGENT_PIP_INDEX_URL:-${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}}
        LIPSYNC_GPU: ${LIPSYNC_GPU:-0}
    image: clawhive/ai_agent_lipsync:${CLAWHIVE_IMAGE_TAG:-prod}
    container_name: ai_agent_lipsync
    environment:
      LIPSYNC_PORT: "8091"
      LIPSYNC_BACKEND: ${LIPSYNC_BACKEND:-auto}
      LIPSYNC_PREFER_CUDA: ${LIPSYNC_PREFER_CUDA:-true}
      ULTRALIGHT_DATA_PATH: /data/ultralight
      LIPSYNC_FACE_VIDEO: /app/video/ai.mp4
      WAV2LIP_ROOT: /opt/Wav2Lip
      MUSETALK_ROOT: /opt/MuseTalk
      MUSETALK_PYTHON: ${MUSETALK_PYTHON:-}
      MUSETALK_USE_FLOAT16: ${MUSETALK_USE_FLOAT16:-true}
      MUSETALK_BBOX_SHIFT: ${MUSETALK_BBOX_SHIFT:-0}
    volumes:
      - ../AI_Agent/video:/app/video:ro
      - ../AI_Agent/assets/ultralight_avatar:/data/ultralight:ro
      - ${WAV2LIP_HOST_PATH:-../AI_Agent/.external/Wav2Lip}:/opt/Wav2Lip:ro
      - ${MUSETALK_HOST_PATH:-../AI_Agent/.external/MuseTalk}:/opt/MuseTalk:ro
    ports:
      - "${LIPSYNC_PORT:-8091}:8091"
    # GPU（可选）：宿主机安装 NVIDIA 驱动 + nvidia-container-toolkit 后设 LIPSYNC_GPU=1 重建镜像，并取消下行注释
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 60s
    restart: unless-stopped

  ai_agent:
    profiles: ["extended"]
    build:
      context: ../AI_Agent
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${AI_AGENT_NODE_IMAGE:-docker.m.daocloud.io/library/node:20-bullseye}
        PYTHON_BASE_IMAGE: ${AI_AGENT_PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim-bookworm}
        NPM_CONFIG_REGISTRY: ${AI_AGENT_NPM_REGISTRY:-${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}}
        PIP_INDEX_URL: ${AI_AGENT_PIP_INDEX_URL:-${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}}
    image: clawhive/ai_agent:${CLAWHIVE_IMAGE_TAG:-prod}
    container_name: ai_agent
    working_dir: /app/backend
    env_file:
      - path: ../AI_Agent/.env
        required: false
      - path: .env.agents-lan
        required: false
    environment:
      # 模型名以 ../AI_Agent/.env 为准，勿在此覆盖 LLM_MODEL/ASR_MODEL/TTS_MODEL
      LIP_SYNC_MODE: ${AI_AGENT_LIP_SYNC_MODE:-client_rhythm}
      CLAWHIVE_BACKEND_URL: http://clawhive_backend:8000
      CLAWHIVE_INTERNAL_TOKEN: ${CLAWHIVE_INTERNAL_TOKEN:-}
      AGENT_LLM_REQUEST_TIMEOUT_MS: ${AGENT_LLM_REQUEST_TIMEOUT_MS:-120000}
      AGENT_LLM_MAX_RETRIES: ${AGENT_LLM_MAX_RETRIES:-0}
      AGENT_LLM_JSON_MAX_TOKENS: ${AGENT_LLM_JSON_MAX_TOKENS:-896}
      AGENT_LLM_SYNTH_MAX_TOKENS: ${AGENT_LLM_SYNTH_MAX_TOKENS:-2048}
      CLAWHIVE_CONFIG_SYNC: "0"
      # LLM 模型/API：由挂载的 ../AI_Agent/.env 注入，勿在此覆盖
    ports:
      # 容器内监听端口须与 AI_Agent/.env 中 API_PORT 一致（默认 8080）
      - "${AI_AGENT_PORT:-13112}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../AI_Agent/.env:/app/.env:ro
      - ../AI_Agent/assets:/app/assets
      - ../AI_Agent/video:/app/video:ro
    restart: unless-stopped

  tempo:
    image: docker.1ms.run/grafana/tempo:2.6.1
    container_name: clawhive_tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - clawhive_tempo_data:/var/tempo
    ports:
      - "${CLAWHIVE_TEMPO_PORT:-3200}:3200"
      - "${CLAWHIVE_TEMPO_OTLP_HTTP_PORT:-4318}:4318"
    restart: unless-stopped

  loki:
    image: docker.1ms.run/grafana/loki:3.1.1
    container_name: clawhive_loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - clawhive_loki_data:/loki
    ports:
      - "${CLAWHIVE_LOKI_PORT:-3100}:3100"
    restart: unless-stopped

  promtail:
    image: docker.1ms.run/grafana/promtail:3.1.1
    container_name: clawhive_promtail
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: docker.1ms.run/prom/prometheus:v2.55.1
    container_name: clawhive_prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - clawhive_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    ports:
      - "${CLAWHIVE_PROMETHEUS_PORT:-19090}:9090"
    depends_on:
      clawhive_backend:
        condition: service_started
      alertmanager:
        condition: service_started
    restart: unless-stopped

  alertmanager:
    image: docker.1ms.run/prom/alertmanager:v0.27.0
    container_name: clawhive_alertmanager
    environment:
      CLAWHIVE_INTERNAL_TOKEN: ${CLAWHIVE_INTERNAL_TOKEN:-}
      CLAWHIVE_ALERT_WEBHOOK_URL: ${CLAWHIVE_ALERT_WEBHOOK_URL:-}
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    ports:
      - "${CLAWHIVE_ALERTMANAGER_PORT:-19093}:9093"
    depends_on:
      clawhive_backend:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: docker.1ms.run/grafana/grafana:11.2.2
    container_name: clawhive_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${CLAWHIVE_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${CLAWHIVE_GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - clawhive_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${CLAWHIVE_GRAFANA_PORT:-13000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
    restart: unless-stopped

  litellm:
    profiles: ["litellm"]
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-latest}
    container_name: clawhive_litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${QWEN_API_KEY:-}}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-clawhive-litellm}
    volumes:
      - ./monitoring/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "${CLAWHIVE_LITELLM_PORT:-14000}:4000"
    restart: unless-stopped

  langfuse:
    image: ${LANGFUSE_IMAGE:-docker.1ms.run/langfuse/langfuse:2}
    container_name: clawhive_langfuse
    environment:
      DATABASE_URL: postgresql://${CLAWHIVE_PG_USER:-postgres}:${CLAWHIVE_PG_PASSWORD:-postgres}@clawhive_postgres:5432/${CLAWHIVE_LANGFUSE_DB:-langfuse}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://127.0.0.1:13001}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-change-langfuse-nextauth-secret}
      SALT: ${LANGFUSE_SALT:-change-langfuse-salt}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-clawhive}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-ClawHive}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-clawhive}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-ClawHive}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-clawhive}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-clawhive}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@clawhive.local}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-admin123}
    ports:
      - "${CLAWHIVE_LANGFUSE_PORT:-13001}:3000"
    depends_on:
      clawhive_postgres:
        condition: service_healthy
    restart: unless-stopped

  dex:
    profiles: ["oidc"]
    image: docker.1ms.run/dexidp/dex:v2.41.1
    container_name: clawhive_dex
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./monitoring/dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "${CLAWHIVE_DEX_PORT:-5556}:5556"
    restart: unless-stopped

volumes:
  clawhive_pg_data:
  clawhive_redis_data:
  clawhive_runtime_data:
  clawhive_prometheus_data:
  clawhive_grafana_data:
  clawhive_alertmanager_data:
  clawhive_tempo_data:
  clawhive_loki_data:
  manager_agent_data:
  rag_agent_data:
  rag_agent_node_modules:
  rag_agent_nuxt:
  rag_agent_output:
  rag_pgvector_data:
  extractor_agent_node_modules:
  extractor_agent_nuxt:
  extractor_agent_playwright:
  tavern_agent_data:
  music_agent_out:
  music_agent_hf_cache:
  music_agent_torch_cache:
  video_agent_out:
  multimodal_agent_data:
  lobster_agent_sessions:
  manager_agent_node_modules:
  db_agent_node_modules:
  db_agent_nuxt:
  admin_mcp_memory:
  admin_mcp_cron:
