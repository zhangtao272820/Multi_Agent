# =============================================================================
# Public / 弱机 overlay — ONLY with -Public / --public（见 scripts）
#
# 叠在 lan +（建议）enterprise 之后。须用 Compose !override / !reset（v2.24+）。
#
# 作用：
#   1) 仅入口绑 127.0.0.1（Manager / 紫微 / 后端）；内部库与专家 ports:!reset
#   2) 4C8G 内存硬顶（勿再开 monitoring / Lobster）
# =============================================================================

services:
  # ── 入口（Caddy 反代目标）──
  clawhive_backend:
    ports: !override
      - "127.0.0.1:${CLAWHIVE_BACKEND_PORT:-18000}:8000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 256M

  clawhive_frontend:
    ports: !override
      - "127.0.0.1:${CLAWHIVE_FRONTEND_PORT:-18073}:80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

  manager_agent:
    ports: !override
      - "127.0.0.1:${MANAGER_PORT:-13106}:${MANAGER_PORT:-13106}"
    environment:
      NODE_OPTIONS: ${MANAGER_NODE_OPTIONS:---max-old-space-size=768}
      # 字面量强制：勿用 ${MANAGER_DISABLED_AGENTS:-…}，否则 lan env 缺 gui 时仍可路由 Lobster
      MANAGER_DISABLED_AGENTS: music,video,gui
      MANAGER_RUN_MAX_TOKENS: ${MANAGER_RUN_MAX_TOKENS:-80000}
      MANAGER_MAX_INFLIGHT_RUNS: ${MANAGER_MAX_INFLIGHT_RUNS:-3}
      MANAGER_MAX_INFLIGHT_PER_EXPERT: ${MANAGER_MAX_INFLIGHT_PER_EXPERT:-1}
      MANAGER_REQUEST_RATE_PER_MIN: ${MANAGER_REQUEST_RATE_PER_MIN:-60}
      MANAGER_MAX_RETRY: ${MANAGER_MAX_RETRY:-1}
      MANAGER_EXPERT_TRANSPORT_RETRIES: ${MANAGER_EXPERT_TRANSPORT_RETRIES:-1}
      MANAGER_AGENT_CIRCUIT_STREAK: ${MANAGER_AGENT_CIRCUIT_STREAK:-2}
      MANAGER_GRAPH_RECURSION_LIMIT: ${MANAGER_GRAPH_RECURSION_LIMIT:-48}
      MANAGER_AUTONOMOUS_MAX_STEPS: ${MANAGER_AUTONOMOUS_MAX_STEPS:-8}
      MANAGER_PROMPT_AUTO_PROMOTE: ${MANAGER_PROMPT_AUTO_PROMOTE:-0}
      EVO_ALLOW_EXPERT_AUTO_PROMOTE: ${EVO_ALLOW_EXPERT_AUTO_PROMOTE:-0}
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          memory: 384M

  # ── 内部：清除宿主机端口映射 ──
  clawhive_postgres:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
        reservations:
          memory: 256M

  clawhive_redis:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

  rag_agent:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 256M

  rag_pgvector:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  vanna_db_agent:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 256M

  vanna_db_web:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 32M

  ai_admin_agent:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 192M

  code_assistent_agent:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          memory: 128M

  extractor_agent:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          memory: 128M

  multimodal_agent:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          memory: 128M

  searxng:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

  crw:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

  playwright_mcp:
    shm_size: "256mb"
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          memory: 128M
