# ClawHive 企业告警规则（Prometheus 评估，Grafana / :9090/alerts 可查看）
groups:
  - name: clawhive_availability
    interval: 30s
    rules:
      - alert: ClawHiveBackendDown
        expr: up{job="clawhive_backend"} == 0
        for: 2m
        labels:
          severity: critical
          source: platform
        annotations:
          summary: "ClawHive 后端不可达"
          description: "job=clawhive_backend 连续 2 分钟 scrape 失败"

      - alert: ManagerAgentDown
        expr: up{job="manager_agent"} == 0
        for: 2m
        labels:
          severity: critical
          source: manager
        annotations:
          summary: "Manager Agent 不可达"
          description: "编排入口 offline，任务将无法执行"

      - alert: DbAgentDown
        expr: up{job="db_agent"} == 0
        for: 3m
        labels:
          severity: warning
          source: db_agent
        annotations:
          summary: "DB Agent 不可达"

      - alert: RagAgentDown
        expr: up{job="rag_agent"} == 0
        for: 3m
        labels:
          severity: warning
          source: rag_agent
        annotations:
          summary: "RAG Agent 不可达"

      - alert: CodeAgentDown
        expr: up{job="code_assistent_agent"} == 0
        for: 3m
        labels:
          severity: warning
          source: code_agent
        annotations:
          summary: "Code Agent 不可达"

      - alert: ExtractorAgentDown
        expr: up{job="extractor_agent"} == 0
        for: 3m
        labels:
          severity: warning
          source: extractor_agent
        annotations:
          summary: "Extractor Agent 不可达"

      - alert: AdminAgentDown
        expr: up{job="ai_admin_agent"} == 0
        for: 3m
        labels:
          severity: warning
          source: admin_agent
        annotations:
          summary: "Admin Agent 不可达"

      - alert: LobsterAgentDown
        expr: up{job="lobster_agent"} == 0
        for: 5m
        labels:
          severity: warning
          source: lobster_agent
        annotations:
          summary: "Lobster Agent 不可达"

  - name: clawhive_sla
    interval: 60s
    rules:
      - alert: ManagerSearchHitRateLow
        expr: manager_search_hit_rate < 0.2
        for: 15m
        labels:
          severity: warning
          source: manager
        annotations:
          summary: "Manager 联网搜索命中率过低 (<20%)"
          description: "检查 Tavily/SERP 配置或 query 质量"

      - alert: ManagerSynthLatencyHigh
        expr: manager_phase_ms_avg{phase="synth"} > 90000
        for: 10m
        labels:
          severity: warning
          source: manager
        annotations:
          summary: "Manager 合成阶段 P95 延迟过高 (>90s)"

      - alert: ManagerSliFailRateHigh
        expr: manager_sli_expert_error_rate > 0.35
        for: 15m
        labels:
          severity: warning
          source: manager
        annotations:
          summary: "Manager 专家步骤失败率过高 (>35%)"
          description: "检查专家可用性与 fail-fast 是否生效；Runbook: docs/企业化.md"

      - alert: ManagerSliFailRateElevated
        expr: manager_sli_expert_error_rate > 0.05 and manager_sli_expert_error_rate <= 0.35
        for: 20m
        labels:
          severity: info
          source: manager
        annotations:
          summary: "Manager 专家失败率升高 (>5%)"
          description: "早期预警；见 docs/企业化.md"

      - alert: ManagerSliP95High
        expr: manager_sli_p95_latency_ms > 120000
        for: 10m
        labels:
          severity: warning
          source: manager
        annotations:
          summary: "Manager SLI P95 延迟过高 (>120s)"

      - alert: ManagerRouteClearRateLow
        expr: manager_sli_route_clear_rate < 0.35 and manager_sli_route_clear_rate >= 0
        for: 30m
        labels:
          severity: warning
          source: manager
        annotations:
          summary: "路由 clear 率偏低 (<35%)"
          description: "可能 schema/库域漂移或 ambiguous 增多；查 route_authority Trace"

      - alert: ManagerRouteLlmCallsHigh
        expr: manager_sli_route_avg_llm_calls > 4
        for: 30m
        labels:
          severity: info
          source: manager
        annotations:
          summary: "单轮路由 LLM 次数均值偏高 (>4)"
          description: "检查 skip 级联与续轮复用是否生效"

      - alert: ManagerEstimatedCostHigh
        expr: manager_sli_estimated_usd > 5
        for: 30m
        labels:
          severity: info
          source: manager
        annotations:
          summary: "Manager SLI 窗口估算成本偏高 (>$5)"
          description: "见 docs/企业化.md；需配置 MANAGER_COST_PER_1K_TOKENS_USD 才有 usd 打点"

      - alert: ManagerRequestRateLimited
        expr: increase(manager_request_rate_limited_total[15m]) > 20
        for: 5m
        labels:
          severity: info
          source: manager
        annotations:
          summary: "入口限流拒绝偏多"
          description: "检查 MANAGER_REQUEST_RATE_PER_MIN 或异常流量；LAN 默认 0=不限"

      - alert: ManagerEvidenceRejectionHigh
        expr: manager_sli_evidence_rejection_rate > 0.5
        for: 15m
        labels:
          severity: warning
          source: manager
        annotations:
          summary: "证据拒答/澄清率过高 (>50%)"

      - alert: ManagerBackpressureHigh
        expr: manager_agent_sli_inflight >= 6
        for: 5m
        labels:
          severity: info
          source: manager
        annotations:
          summary: "Manager 并发 run 偏高（G2 背压观测）"

      - alert: BudgetNearLimit
        expr: increase(manager_sli_expert_errors_total{error_code="budget_exceeded"}[1h]) > 3
        for: 5m
        labels:
          severity: warning
          source: manager
        annotations:
          summary: "1h 内多次触发 run 预算截断（E3/G4）"

      - alert: ManagerRunVolumeSpike
        expr: increase(manager_runs_total[1h]) > 200
        for: 5m
        labels:
          severity: info
          source: manager
        annotations:
          summary: "Manager 1h 内 run 数异常偏高"

  - name: clawhive_quota
    interval: 60s
    rules:
      - alert: TenantQuotaNearLimit
        expr: clawhive_tenant_quota_utilization >= 0.8 and clawhive_tenant_quota_utilization < 1
        for: 5m
        labels:
          severity: warning
          source: platform
        annotations:
          summary: "租户 Token 配额已达 80%"
          description: "tenant={{ $labels.tenant_id }}"

      - alert: TenantQuotaExceeded
        expr: clawhive_tenant_quota_utilization >= 1
        for: 1m
        labels:
          severity: critical
          source: platform
        annotations:
          summary: "租户 Token 配额已用尽"
          description: "tenant={{ $labels.tenant_id }}，新任务将被拒绝"
