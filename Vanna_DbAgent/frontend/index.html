<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vanna 库问数</title>
  <style>
    :root {
      --bg: #f4f4f5;
      --surface: #ffffff;
      --ink: #18181b;
      --muted: #71717a;
      --line: #e4e4e7;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #eff6ff;
      --sidebar-bg: #fafafa;
      --warn: #c2410c;
      --ok: #15803d;
      --sql: #0f172a;
      --sqlink: #e2e8f0;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      --radius: 12px;
      --radius-lg: 16px;
      --chat-max: 720px;
      --rail-width: 300px;
    }
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    button, select, textarea { font-family: inherit; }
    .shell {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      height: 100%;
      max-height: 100vh;
      overflow: hidden;
    }
    .shell.audit-open {
      grid-template-columns: 260px minmax(0, 1fr) var(--rail-width);
    }
    aside.sidebar {
      background: var(--sidebar-bg);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .sidebar-head {
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--ink);
    }
    .brand small {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.45;
      color: var(--muted);
    }
    .new-chat {
      width: 100%;
      margin-top: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
    }
    .new-chat:hover {
      background: #f4f4f5;
      border-color: #d4d4d8;
    }
    .sidebar-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 10px 10px 0;
    }
    .sessions-label {
      margin: 0 4px 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .sessions { padding: 0 2px 12px; }
    .login-gate {
      position: fixed; inset: 0; z-index: 40;
      display: none; align-items: center; justify-content: center;
      background: rgba(24, 24, 27, 0.45);
      backdrop-filter: blur(6px);
    }
    .login-gate.on { display: flex; }
    .login-card {
      width: min(380px, 92vw);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 28px 24px 22px;
    }
    .login-card h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.02em; }
    .login-card .sub { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .login-card label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .login-card input {
      width: 100%; box-sizing: border-box; margin-bottom: 12px;
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px;
    }
    .login-card button {
      width: 100%; border: 0; border-radius: 10px; padding: 11px 14px;
      background: var(--accent); color: #fff; font-size: 14px; cursor: pointer;
    }
    .login-card button:disabled { opacity: 0.6; cursor: wait; }
    .login-err { color: var(--warn); font-size: 13px; min-height: 1.2em; margin: 0 0 10px; }
    .sess {
      display: flex;
      gap: 4px;
      align-items: center;
      margin: 0 0 2px;
    }
    .sess button.pick {
      flex: 1;
      text-align: left;
      background: transparent;
      color: var(--ink);
      border: 0;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.12s;
    }
    .sess button.pick:hover { background: #f4f4f5; }
    .sess button.pick.on { background: var(--accent-soft); color: var(--accent); font-weight: 550; }
    .sess .del {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      opacity: 0;
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1;
      transition: opacity 0.12s, background 0.12s;
    }
    .sess:hover .del { opacity: 0.7; }
    .sess .del:hover { opacity: 1; background: #fee2e2; color: #b91c1c; }
    .sidebar-foot {
      padding: 12px 14px 14px;
      border-top: 1px solid var(--line);
      background: var(--sidebar-bg);
    }
    .sidebar-foot .field { margin-bottom: 10px; }
    .sidebar-foot .field label {
      display: block;
      margin: 0 0 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }
    .sidebar-foot select {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font-size: 12px;
    }
    .status {
      margin: 8px 0 0;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.45;
    }
    .chat-pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      height: 100%;
      background: var(--bg);
    }
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      flex-shrink: 0;
    }
    .chat-header-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    .chat-header-hint {
      font-size: 12px;
      color: var(--muted);
      margin: 2px 0 0;
    }
    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .header-btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .header-btn:hover { background: #f4f4f5; }
    .header-btn.on {
      background: var(--accent-soft);
      border-color: #bfdbfe;
      color: var(--accent);
    }
    .thread-wrap {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }
    .thread-inner {
      width: 100%;
      max-width: calc(var(--chat-max) + 48px);
      padding: 0 24px;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .thread {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 24px 0 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .empty-welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      min-height: 280px;
    }
    .empty-welcome .welcome-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 22px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
    }
    .empty-welcome h2 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .empty-welcome p {
      margin: 0 0 24px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      max-width: 420px;
    }
    .welcome-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 560px;
    }
    .welcome-chip {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, box-shadow 0.12s;
    }
    .welcome-chip:hover {
      background: #f4f4f5;
      border-color: #d4d4d8;
      box-shadow: var(--shadow-sm);
    }
    .msg-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      max-width: 100%;
    }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-avatar {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 650;
      color: #fff;
    }
    .msg-row.user .msg-avatar { background: #3b82f6; }
    .msg-row.assistant .msg-avatar { background: #18181b; }
    .msg-body { flex: 1; min-width: 0; max-width: min(var(--chat-max), 100%); }
    .msg-row.user .msg-body { display: flex; flex-direction: column; align-items: flex-end; }
    .role {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin: 0 0 6px;
    }
    .msg-row.user .role { text-align: right; }
    .bubble {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 14px;
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }
    .msg-row.user .bubble {
      background: var(--accent-soft);
      border-color: #bfdbfe;
      color: #1e3a8a;
      border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
    }
    .msg-row.assistant .bubble {
      border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 4px;
    }
    .agent-card {
      margin: 0 0 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 14px;
      box-shadow: var(--shadow-sm);
    }
    .agent-card.is-running { border-color: #93c5fd; }
    .agent-card.is-await { border-color: #fdba74; background: #fffbeb; }
    .agent-head {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin: 0 0 8px; font-size: 13px; color: var(--ink); font-weight: 600;
    }
    .agent-mark {
      width: 22px; height: 22px; border-radius: 7px; display: inline-grid; place-items: center;
      background: #18181b; color: #fafafa; font-size: 11px; font-weight: 700;
    }
    .agent-live {
      margin-left: auto; font-size: 11px; font-weight: 600;
      color: #1d4ed8; background: #dbeafe; padding: 2px 8px; border-radius: 999px;
    }
    .agent-live.is-await { color: #c2410c; background: #ffedd5; }
    .agent-live.is-done { color: #15803d; background: #dcfce7; }
    .agent-count { font-size: 12px; color: var(--muted); font-weight: 500; }
    .agent-progress {
      height: 4px; border-radius: 999px; background: #d5dee8; overflow: hidden; margin: 0 0 10px;
    }
    .agent-progress > i {
      display: block; height: 100%; width: 0; border-radius: inherit;
      background: linear-gradient(90deg, #2f5d8a, #5b8fc4);
      transition: width 0.25s ease;
    }
    .agent-card.is-running .agent-progress > i {
      background-size: 200% 100%;
      animation: agentPulse 1.4s linear infinite;
    }
    @keyframes agentPulse {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    .agent-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .agent-step {
      display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: start;
      font-size: 13px; color: var(--ink);
    }
    .agent-step .dot {
      width: 10px; height: 10px; margin-top: 4px; border-radius: 50%;
      border: 2px solid #a1a1aa; background: transparent; box-sizing: border-box;
    }
    .agent-step.is-running .dot {
      border-color: #2563eb; background: #93c5fd;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    }
    .agent-step.is-success .dot { border-color: #15803d; background: #22c55e; }
    .agent-step.is-await .dot { border-color: #c2410c; background: #fb923c; }
    .agent-step.is-failed .dot { border-color: #b91c1c; background: #ef4444; }
    .agent-step.is-pending { opacity: 0.55; }
    .agent-step .title { font-weight: 650; line-height: 1.35; }
    .agent-step .detail { display: block; margin-top: 2px; font-size: 12px; color: #4b5d6e; line-height: 1.4; word-break: break-word; }
    .agent-step .st {
      font-size: 11px; font-weight: 700; color: #5c6b7a; white-space: nowrap; margin-top: 2px;
    }
    .agent-step.is-running .st { color: #1d4ed8; }
    .agent-step.is-success .st { color: #15803d; }
    .agent-step.is-await .st { color: #c2410c; }
    .agent-step.is-failed .st { color: #b91c1c; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .chip-tag {
      display: inline-block; font-size: 11px; line-height: 1.3; padding: 2px 7px;
      border-radius: 999px; background: #e8eef5; color: #243447; border: 1px solid #c9d5e3;
      max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tool-sql {
      margin-top: 10px; border: 1px solid #31445c; border-radius: 10px; background: #15202b; color: #e7eef6;
      overflow: hidden;
    }
    .tool-sql summary {
      cursor: pointer; list-style: none; padding: 8px 10px; font-size: 12px; font-weight: 650;
      display: flex; align-items: center; gap: 8px; color: #d7e3f0;
    }
    .tool-sql summary::-webkit-details-marker { display: none; }
    .tool-sql summary::before { content: "▾"; opacity: 0.7; }
    .tool-sql:not([open]) summary::before { content: "▸"; }
    .tool-sql .src {
      margin-left: auto; font-size: 11px; font-weight: 700; color: #9fb4cc;
      background: rgba(255,255,255,0.08); padding: 1px 7px; border-radius: 999px;
    }
    .tool-sql pre {
      margin: 0; padding: 0 10px 10px; font-family: Consolas, "Courier New", monospace;
      font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; color: #e7eef6;
    }
    .hitl {
      margin-top: 10px; padding: 10px 12px; border-radius: 10px;
      background: #fff7ed; border: 1px solid #fdba74; color: #7c2d12;
    }
    .hitl p { margin: 0 0 8px; font-size: 13px; line-height: 1.45; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .actions button, .go, .primary, .ghost {
      border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 13px;
      font-weight: 500;
    }
    .primary, .go { background: var(--accent); color: #fff; border: 0; }
    .primary:hover, .go:hover { background: var(--accent-hover); }
    .ghost { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
    .ghost:hover { background: #f4f4f5; }
    .go:disabled { opacity: 0.45; cursor: not-allowed; }
    .result-wrap {
      margin-top: 10px; background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); overflow: auto; max-height: 280px; box-shadow: var(--shadow-sm);
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; background: var(--surface); }
    th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; color: var(--ink); }
    th { background: #f4f4f5; position: sticky; top: 0; font-weight: 600; }
    .field-details {
      margin-top: 10px; padding: 10px 12px; border-radius: var(--radius);
      background: #fafafa; border: 1px dashed var(--line); color: #3f3f46; font-size: 12px;
    }
    .field-details h4 {
      margin: 0 0 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      color: #5c6b7a; font-weight: 700;
    }
    .field-details ul { margin: 0; padding-left: 16px; }
    .field-details li { margin: 0 0 4px; line-height: 1.45; }
    .field-details code {
      font-size: 11px; color: #64748b; background: #eef2f7; padding: 1px 5px; border-radius: 4px;
    }
    .feedback-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-top: 10px; font-size: 12px; color: var(--muted);
    }
    .feedback-row .fb {
      border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 12px;
    }
    .feedback-row .fb:hover { border-color: var(--accent); color: var(--accent); }
    .feedback-row .fb-neg:hover { border-color: var(--warn); color: var(--warn); }
    .feedback-row .fb:disabled { opacity: 0.55; cursor: default; }
    .feedback-ack { margin: 0; color: var(--ok); font-weight: 600; }
    .composer {
      flex-shrink: 0;
      padding: 12px 24px 16px;
      background: linear-gradient(to top, var(--bg) 80%, transparent);
    }
    .composer-inner {
      max-width: calc(var(--chat-max) + 48px);
      margin: 0 auto;
    }
    .ask-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 4px 4px 4px 16px;
    }
    .ask {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: flex-end;
    }
    textarea {
      width: 100%;
      min-height: 44px;
      max-height: 160px;
      resize: none;
      border: 0;
      border-radius: 0;
      padding: 12px 0;
      font-size: 15px;
      color: var(--ink);
      background: transparent;
      line-height: 1.5;
    }
    textarea:focus { outline: none; }
    .go {
      border-radius: 10px;
      padding: 10px 18px;
      min-height: 40px;
      align-self: center;
      margin: 4px 4px 4px 0;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-top: 8px;
      padding: 0 4px;
    }
    .cost {
      display: flex;
      gap: 14px;
      font-size: 11px;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .cost b { color: var(--ink); font-weight: 600; }
    .legend { margin: 0; font-size: 11px; color: var(--muted); line-height: 1.45; }
    .rail {
      background: var(--surface);
      border-left: 1px solid var(--line);
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
    }
    .rail.hidden { display: none; }
    .rail code, .audit-item code {
      font-family: Consolas, "Courier New", monospace;
    }
    .rail h2 { margin: 0; flex: 0 0 auto; font-size: 14px; color: var(--ink); font-weight: 650; }
    .rail > .legend { flex: 0 0 auto; color: var(--muted); font-size: 12px; }
    #auditList {
      overflow-x: hidden;
      overflow-y: auto;
      flex: 1 1 auto;
      min-height: 0;
      padding-right: 4px;
    }
    .audit-item {
      font-size: 12px;
      background: #fafafa;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin: 0 0 8px;
      line-height: 1.5;
      color: var(--ink);
    }
    .audit-item .q {
      font-weight: 600;
      color: var(--ink);
      margin: 0 0 6px;
      word-break: break-word;
      font-size: 13px;
    }
    .audit-item code {
      display: block;
      margin-top: 8px;
      font-size: 11px;
      line-height: 1.5;
      color: var(--sqlink);
      background: var(--sql);
      border-radius: 8px;
      padding: 8px 10px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 9.5em;
      overflow: auto;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .ok { color: #15803d; }
    .warn { color: #c2410c; }
    .badge.ok { background: #dcfce7; color: #15803d; }
    .badge.warn { background: #ffedd5; color: #c2410c; }
    .message-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .msg-row:hover .message-actions { opacity: 1; }
    .msg-row.user .message-actions { justify-content: flex-end; }
    .msg-action-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .msg-action-btn:hover { background: #f4f4f5; color: var(--ink); }
    .msg-action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .msg-action-btn.is-primary {
      background: var(--accent);
      color: #fff;
    }
    .msg-action-btn.is-primary:hover { background: var(--accent-hover); }
    .user-edit-wrap { display: flex; flex-direction: column; gap: 8px; }
    .user-edit-input {
      width: 100%; min-height: 72px; resize: vertical; border: 1px solid var(--line);
      border-radius: var(--radius); padding: 10px 12px; font-size: 14px; color: var(--ink); background: var(--surface);
    }
    .agent-process { margin: 0; }
    .agent-process > summary {
      cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 600; color: var(--muted); padding: 2px 0 8px;
    }
    .agent-process > summary::-webkit-details-marker { display: none; }
    .agent-process > summary::before { content: "▾"; opacity: 0.65; }
    .agent-process:not([open]) > summary::before { content: "▸"; }
    .agent-process .agent-steps { margin-top: 2px; }
    @media (max-width: 900px) {
      .shell, .shell.audit-open { grid-template-columns: 1fr; }
      aside.sidebar { display: none; }
      .message-actions { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="login-gate" id="loginGate" aria-hidden="true">
    <form class="login-card" id="loginForm">
      <h1>Vanna 库问数</h1>
      <p class="sub">使用 ClawHive 账号登录后进入协作问数。</p>
      <label for="loginUser">用户名</label>
      <input id="loginUser" name="username" autocomplete="username" required />
      <label for="loginPass">密码</label>
      <input id="loginPass" name="password" type="password" autocomplete="current-password" required />
      <p class="login-err" id="loginErr"></p>
      <button type="submit" id="loginGo">登录</button>
    </form>
  </div>
  <div class="shell" id="appShell">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="brand">Vanna<small>后台问数 · SQL 确认后执行</small></div>
        <button class="new-chat" id="newChat" type="button">新对话</button>
      </div>
      <div class="sidebar-scroll">
        <p class="sessions-label">历史会话</p>
        <div class="sessions" id="sessionList"></div>
      </div>
      <div class="sidebar-foot">
        <div class="field">
          <label for="tenant">租户</label>
          <select id="tenant"></select>
        </div>
        <div class="field">
          <label for="scene">场景</label>
          <select id="scene"></select>
        </div>
        <p class="status" id="catalogStatus">正在读取目录…</p>
      </div>
    </aside>
    <div class="chat-pane">
      <header class="chat-header">
        <div>
          <div class="chat-header-title">库问数助手</div>
          <p class="chat-header-hint" id="sceneHint"></p>
        </div>
        <div class="chat-header-actions">
          <button type="button" class="header-btn" id="auditToggle">查询记录</button>
        </div>
      </header>
      <div class="thread-wrap">
        <div class="thread-inner">
          <div class="thread" id="thread"></div>
        </div>
      </div>
      <div class="composer">
        <div class="composer-inner">
          <form class="ask-card" id="form">
            <div class="ask">
              <textarea id="q" maxlength="400" placeholder="输入问题，例如：目前突发事件有几个？" required rows="1"></textarea>
              <button class="go" type="submit" id="go">发送</button>
            </div>
          </form>
          <div class="meta-row">
            <div class="cost">
              <span>llm <b id="cLlm">0</b>/<b id="cLlmMax">1</b></span>
              <span>答 <b id="cAns">0</b>/<b id="cAnsMax">1</b></span>
              <span>embed <b id="cEmb">0</b>/<b id="cEmbMax">1</b></span>
              <span>耗时 <b id="cMs">0</b> ms</span>
              <span>行数 <b id="cRows">—</b></span>
              <span>来源 <b id="cSrc">—</b></span>
            </div>
            <p class="legend" id="budgetHint">生 SQL 最多 1 次；确认执行后另用 1 次模型写助手回复。</p>
          </div>
        </div>
      </div>
    </div>
    <aside class="rail hidden" id="auditRail">
      <h2>查询记录</h2>
      <p class="legend">本轮审计：问句、是否已执行、SQL 留痕。</p>
      <div id="auditList"></div>
    </aside>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const SESSION_KEY = "vanna_session_id";
    const FEEDBACK_KEY = "vanna_session_feedback";
    const TOKEN_KEY = "clawhive_access_token";
    let pendingId = "";
    let lastSql = "";
    let lastQuestion = "";
    let feedbackByMsg = {};
    let scenes = [];
    let maxQuestion = 400;
    let sessionId = localStorage.getItem(SESSION_KEY) || "";
    let liveCard = null;
    let authToken = localStorage.getItem(TOKEN_KEY) || "";

    const WELCOME_EXAMPLES = [
      { q: "目前突发事件有几个，分别是什么", label: "突发事件名单" },
      { q: "老人库有多少人", label: "老人库人数" },
      { q: "签约老人有多少", label: "签约老人数" },
      { q: "「二战」这个组里现在有哪些成员？学号也给我。", label: "二战组成员" },
      { q: "各护理级别分别多少人，哪一级最多？", label: "护理级别分布" },
      { q: "谁报名或参加了「测试视频类」？把姓名和学号列出来。", label: "视频类参与者" },
    ];

    function welcomeHtml() {
      const chips = WELCOME_EXAMPLES.map((ex) =>
        `<button class="welcome-chip chip" type="button" data-q="${escapeHtml(ex.q)}">${escapeHtml(ex.label)}</button>`
      ).join("");
      return `<div class="empty-welcome" id="welcome">
        <div class="welcome-icon" aria-hidden="true">⬡</div>
        <h2>有什么可以帮你查的？</h2>
        <p>我会先生成 SQL 预览，你确认后再查库。支持多轮对话与历史会话。</p>
        <div class="welcome-chips">${chips}</div>
      </div>`;
    }

    function bindChips(root) {
      (root || document).querySelectorAll(".chip").forEach((btn) => {
        if (btn.dataset.bound) return;
        btn.dataset.bound = "1";
        btn.addEventListener("click", () => {
          $("q").value = btn.getAttribute("data-q") || "";
          $("q").focus();
        });
      });
    }

    function showWelcome() {
      $("thread").innerHTML = welcomeHtml();
      bindChips($("thread"));
    }

    function escapeHtml(v) {
      if (v == null) return "";
      return String(v).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function setAuthToken(token) {
      authToken = String(token || "").trim();
      if (authToken) localStorage.setItem(TOKEN_KEY, authToken);
      else localStorage.removeItem(TOKEN_KEY);
    }

    function showLogin(msg) {
      $("loginErr").textContent = msg || "";
      $("loginGate").classList.add("on");
      $("loginGate").setAttribute("aria-hidden", "false");
    }

    function hideLogin() {
      $("loginGate").classList.remove("on");
      $("loginGate").setAttribute("aria-hidden", "true");
      $("loginErr").textContent = "";
    }

    async function api(url, opts = {}) {
      const headers = Object.assign({}, opts.headers || {});
      if (authToken) headers["Authorization"] = "Bearer " + authToken;
      const res = await fetch(url, Object.assign({}, opts, { headers }));
      if (res.status === 401) {
        const body = await res.clone().json().catch(() => ({}));
        const detail = String(body.detail || "");
        if (/login_required|invalid_user_token|jwt_/i.test(detail)) {
          setAuthToken("");
          showLogin(detail === "login_required" ? "请先登录" : "登录已失效，请重新登录");
          throw new Error(detail || "login_required");
        }
      }
      return res;
    }

    $("loginForm").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const btn = $("loginGo");
      btn.disabled = true;
      $("loginErr").textContent = "";
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({
            username: $("loginUser").value.trim(),
            password: $("loginPass").value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(String(data.detail || ("HTTP " + res.status)));
        const access = String(data.access_token || "").trim();
        if (!access) throw new Error("缺少 access_token");
        setAuthToken(access);
        hideLogin();
        await boot();
      } catch (err) {
        $("loginErr").textContent = String(err.message || err);
      } finally {
        btn.disabled = false;
      }
    });

    async function boot() {
      const metaRes = await api("/api/meta");
      const meta = await metaRes.json();
      hideLogin();
      $("tenant").innerHTML = (meta.tenants || []).map((t) =>
        `<option value="${t.id}">${t.title} (${t.id})</option>`
      ).join("");
      scenes = meta.scenes || [];
      $("scene").innerHTML = scenes.map((s) =>
        `<option value="${s.id}">${s.title}${s.stub ? " · 建设中" : ""}</option>`
      ).join("");
      onScene();
      const budget = meta.budget || {};
      $("cLlmMax").textContent = budget.max_llm_calls ?? 1;
      $("cEmbMax").textContent = budget.max_embed_calls ?? 1;
      $("cAnsMax").textContent = budget.max_answer_llm_calls ?? 1;
      maxQuestion = Number(budget.max_question_chars || 400);
      $("q").maxLength = maxQuestion;
      const t = (meta.tenants || [])[0];
      $("catalogStatus").textContent = t
        ? `目录 ${t.catalog || 0} 条 · 对话会记住最近几轮。`
        : "未发现租户。";
      await ensureSession();
      await refreshSessions();
      await loadThread();
      await refreshAudit();
    }

    function onScene() {
      const s = scenes.find((x) => x.id === $("scene").value);
      if (!s) { $("sceneHint").textContent = ""; return; }
      $("sceneHint").textContent = s.stub
        ? "本场景入口已通，深度能力尚未实现。"
        : "先预览 SQL，确认后再执行。回复会用模型写成助手口吻。";
    }
    $("scene").addEventListener("change", onScene);

    $("auditToggle").addEventListener("click", () => {
      const rail = $("auditRail");
      const shell = $("appShell");
      const open = rail.classList.toggle("hidden");
      shell.classList.toggle("audit-open", !open);
      $("auditToggle").classList.toggle("on", !open);
      if (!open) refreshAudit();
    });

    async function ensureSession() {
      if (sessionId) {
        const res = await api("/api/sessions/" + sessionId);
        if (res.ok) return;
      }
      const created = await api("/api/sessions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tenant: $("tenant").value || "p2604", scene: $("scene").value || "assistant" }),
      }).then((r) => r.json());
      sessionId = created.id;
      localStorage.setItem(SESSION_KEY, sessionId);
    }

    async function refreshSessions() {
      const data = await api("/api/sessions").then((r) => r.json());
      $("sessionList").innerHTML = (data.items || []).map((s) => `
        <div class="sess">
          <button class="pick ${s.id === sessionId ? "on" : ""}" data-id="${s.id}" type="button">${escapeHtml(s.title || "对话")}</button>
          <button class="del" data-del="${s.id}" type="button">×</button>
        </div>`).join("") || "<p class='legend'>还没有会话。</p>";
      $("sessionList").querySelectorAll(".pick").forEach((btn) => {
        btn.addEventListener("click", async () => {
          sessionId = btn.getAttribute("data-id");
          localStorage.setItem(SESSION_KEY, sessionId);
          await refreshSessions();
          await loadThread();
        });
      });
      $("sessionList").querySelectorAll(".del").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await api("/api/sessions/" + btn.getAttribute("data-del"), { method: "DELETE" });
          if (sessionId === btn.getAttribute("data-del")) {
            sessionId = "";
            localStorage.removeItem(SESSION_KEY);
            await ensureSession();
          }
          await refreshSessions();
          await loadThread();
        });
      });
    }

    let asking = false;
    let editingMsgId = "";

    async function loadThread() {
      const doc = await api("/api/sessions/" + sessionId).then((r) => r.ok ? r.json() : null);
      const msgs = (doc && doc.messages) || [];
      $("thread").innerHTML = "";
      loadFeedbackMap();
      if (!msgs.length) {
        showWelcome();
        return;
      }
      msgs.forEach((m) => {
        if (m.role === "user" && m.content) lastQuestion = m.content;
        appendBubble(m.role, m.content, m.meta || {}, { id: m.id || "" });
      });
      // 恢复最近一条待确认的 pending
      for (let i = msgs.length - 1; i >= 0; i--) {
        const meta = msgs[i].meta || {};
        if (msgs[i].role === "assistant" && meta.checkpoint && meta.pending_id) {
          pendingId = meta.pending_id;
          lastSql = meta.sql || "";
          break;
        }
      }
      $("thread").scrollTop = $("thread").scrollHeight;
    }

    async function truncateFrom(messageId) {
      const res = await api("/api/sessions/" + sessionId + "/truncate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message_id: messageId }),
      });
      if (!res.ok) throw new Error("truncate failed " + res.status);
      // 与总管一致：撤回/重生/编辑重发后，该轮及之后反馈作废（本地 UI + 服务端 learningVoid）
      clearFeedbackFromMessage(messageId);
      return res.json().catch(() => ({}));
    }

    function clearFeedbackFromMessage(fromMsgId) {
      const from = String(fromMsgId || "").trim();
      if (!from) return;
      const thread = document.getElementById("thread");
      const nodes = thread ? Array.from(thread.querySelectorAll("[data-msg-id]")) : [];
      let dropping = false;
      const dropIds = new Set();
      for (const node of nodes) {
        const id = String(node.getAttribute("data-msg-id") || "");
        if (id === from) dropping = true;
        if (dropping && id) dropIds.add(id);
      }
      // 若 DOM 尚未带齐 id，至少清当前键
      dropIds.add(from);
      let changed = false;
      for (const key of Object.keys(feedbackByMsg || {})) {
        if (dropIds.has(key) || key === from) {
          delete feedbackByMsg[key];
          changed = true;
        }
      }
      if (changed) saveFeedbackMap();
    }

    async function copyText(text, btn) {
      const t = String(text || "").trim();
      if (!t) return;
      try { await navigator.clipboard.writeText(t); } catch { return; }
      if (!btn) return;
      const old = btn.textContent;
      btn.textContent = "已复制";
      setTimeout(() => { btn.textContent = old; }, 1200);
    }

    function bindMsgActions(wrap, role, text, meta, msgId) {
      const copyBtn = wrap.querySelector("[data-act=copy]");
      if (copyBtn) copyBtn.addEventListener("click", () => copyText(text, copyBtn));
      const copySql = wrap.querySelector(".copy-live");
      if (copySql) copySql.addEventListener("click", () => copyText(lastSql || (meta && meta.sql) || "", copySql));
      const confirmBtn = wrap.querySelector(".confirm-live");
      if (confirmBtn) confirmBtn.addEventListener("click", () => confirmExec());
      const promoteBtn = wrap.querySelector(".promote-live");
      if (promoteBtn) promoteBtn.addEventListener("click", () => promoteGolden(meta, promoteBtn));
      if (role !== "user" || !msgId) return;
      const editBtn = wrap.querySelector("[data-act=edit]");
      const withdrawBtn = wrap.querySelector("[data-act=withdraw]");
      const regenBtn = wrap.querySelector("[data-act=regen]");
      if (editBtn) editBtn.addEventListener("click", () => startEdit(wrap, text, msgId));
      if (withdrawBtn) withdrawBtn.addEventListener("click", () => withdrawTurn(msgId));
      if (regenBtn) regenBtn.addEventListener("click", () => regenerateTurn(msgId, text));
    }

    function startEdit(wrap, text, msgId) {
      if (asking) return;
      editingMsgId = msgId;
      const bubble = wrap.querySelector(".bubble");
      if (!bubble) return;
      bubble.outerHTML = `<div class="user-edit-wrap">
        <textarea class="user-edit-input">${escapeHtml(text || "")}</textarea>
        <div class="message-actions">
          <button type="button" class="msg-action-btn" data-act="edit-cancel">取消</button>
          <button type="button" class="msg-action-btn is-primary" data-act="edit-send">重发</button>
        </div>
      </div>`;
      const actions = wrap.querySelector(".message-actions-user");
      if (actions) actions.remove();
      wrap.querySelector("[data-act=edit-cancel]").addEventListener("click", () => loadThread());
      wrap.querySelector("[data-act=edit-send]").addEventListener("click", async () => {
        const draft = (wrap.querySelector(".user-edit-input") || {}).value || "";
        const q = String(draft).trim();
        if (!q || asking) return;
        editingMsgId = "";
        await truncateFrom(msgId);
        await loadThread();
        await ask({
          question: q,
          tenant: $("tenant").value,
          scene: $("scene").value,
          confirm: false,
        }, { userText: q });
      });
    }

    async function withdrawTurn(msgId) {
      if (asking || !msgId) return;
      if (!window.confirm("撤回后将删除该轮及之后的对话，是否继续？")) return;
      await truncateFrom(msgId);
      pendingId = "";
      lastSql = "";
      await loadThread();
      await refreshSessions();
    }

    async function regenerateTurn(msgId, text) {
      if (asking || !msgId) return;
      const q = String(text || "").trim();
      if (!q) return;
      await truncateFrom(msgId);
      await loadThread();
      await ask({
        question: q,
        tenant: $("tenant").value,
        scene: $("scene").value,
        confirm: false,
      }, { userText: q });
    }

    function sourceLabel(src) {
      if (src === "golden") return "黄金匹配 · 0 次生 SQL";
      if (src === "llm") return "模型生成";
      if (src === "pending") return "确认后执行";
      if (src === "stub") return "场景占位";
      return src || "—";
    }

    function statusLabel(st) {
      if (st === "running") return "进行中";
      if (st === "success") return "完成";
      if (st === "await") return "待确认";
      if (st === "failed") return "失败";
      if (st === "skipped") return "跳过";
      return "待办";
    }

    function tableChips(tables, limit) {
      const list = (tables || []).filter(Boolean);
      if (!list.length) return "";
      const max = limit || 8;
      const shown = list.slice(0, max);
      const more = list.length - shown.length;
      return `<div class="chips">${shown.map((t) => `<span class="chip-tag" title="${escapeHtml(t)}">${escapeHtml(t)}</span>`).join("")}${more > 0 ? `<span class="chip-tag">+${more}</span>` : ""}</div>`;
    }

    function defaultSteps(mode) {
      // mode: preview | execute | confirm
      const steps = [
        { id: "retrieve", label: "检索目录", status: "pending", detail: "" },
        { id: "understand", label: "理解意图", status: "pending", detail: "" },
        { id: "sql", label: "生成 SQL", status: "pending", detail: "" },
        { id: "guard", label: "安全闸门", status: "pending", detail: "" },
      ];
      if (mode === "preview") {
        steps.push({ id: "checkpoint", label: "确认执行", status: "pending", detail: "核对 SQL 后再查库" });
      } else {
        steps.push({ id: "execute", label: "执行查询", status: "pending", detail: "" });
        steps.push({ id: "answer", label: "整理回复", status: "pending", detail: "" });
      }
      return steps;
    }

    function buildStepsFromMeta(meta) {
      const m = meta || {};
      const checkpoint = !!m.checkpoint;
      const executed = !!m.executed || (!checkpoint && (m.row_count > 0 || !!m.sql));
      const steps = defaultSteps(checkpoint ? "preview" : "execute");
      const set = (id, status, detail) => {
        const s = steps.find((x) => x.id === id);
        if (s) { s.status = status; if (detail != null) s.detail = detail; }
      };
      if ((m.tables || []).length || m.sql) {
        set("retrieve", "success", (m.tables || []).length ? `命中 ${(m.tables || []).length} 张表` : "已检索");
      }
      if (m.intent || m.reason) {
        set("understand", "success", [m.intent, m.reason].filter(Boolean).join(" · "));
      } else if (m.sql) {
        set("understand", "success", "已就绪");
      }
      if (m.sql) set("sql", "success", sourceLabel(m.source));
      if (m.guard_ok === false) set("guard", "failed", m.error || "未通过");
      else if (m.sql) set("guard", "success", "只读闸门通过");
      if (checkpoint) {
        set("checkpoint", "await", "等待你确认后再执行");
      } else {
        if (m.error && !executed) set("execute", "failed", m.error);
        else if (executed || m.row_count != null) set("execute", "success", `${m.row_count || 0} 行`);
        set("answer", "success", m.repair ? "已修复后回复" : "已完成");
      }
      if (m.repair) {
        const sqlStep = steps.find((x) => x.id === "sql");
        if (sqlStep) sqlStep.detail = (sqlStep.detail || "") + " · 曾修复";
      }
      return steps;
    }

    function renderAgentCard(state) {
      const steps = state.steps || [];
      const done = steps.filter((s) => s.status === "success" || s.status === "skipped").length;
      const failed = steps.some((s) => s.status === "failed");
      const awaiting = steps.some((s) => s.status === "await");
      const running = !!state.running;
      const pct = steps.length ? Math.round((done / steps.length) * 100) : 0;
      const live = running ? "进行中" : (awaiting ? "待确认" : (failed ? "已中断" : "已完成"));
      const liveClass = running ? "" : (awaiting ? "is-await" : "is-done");
      const cardClass = running ? "is-running" : (awaiting ? "is-await" : "");
      const stepsHtml = steps.map((s) => {
        let detail = escapeHtml(s.detail || "");
        if (s.id === "retrieve" && (state.tables || []).length) {
          detail = `${escapeHtml(s.detail || "")}${tableChips(state.tables)}`;
        }
        return `<li class="agent-step is-${s.status}">
          <span class="dot" aria-hidden="true"></span>
          <div><div class="title">${escapeHtml(s.label)}</div>${detail ? `<div class="detail">${detail}</div>` : ""}</div>
          <span class="st">${statusLabel(s.status)}</span>
        </li>`;
      }).join("");
      const sqlBlock = state.sql
        ? `<details class="tool-sql" ${state.checkpoint || running ? "open" : ""}>
            <summary>工具 · SQL<span class="src">${escapeHtml(sourceLabel(state.source))}</span></summary>
            <pre>${escapeHtml(state.sql)}</pre>
          </details>`
        : "";
      const hitl = state.checkpoint
        ? `<div class="hitl"><p>人工确认闸门：核对 SQL 后才会查库，不会自动执行。</p>
            <div class="actions">
              <button type="button" class="primary confirm-live">确认执行</button>
              <button type="button" class="ghost copy-live">复制 SQL</button>
            </div></div>`
        : (state.sql && !running
          ? `<div class="actions" style="margin-top:10px">
              <button type="button" class="ghost copy-live">复制 SQL</button>
              ${state.executed && !state.checkpoint ? `<button type="button" class="ghost promote-live">收入黄金</button>` : ""}
            </div>`
          : "");
      const processBody = `
        <div class="agent-progress" aria-hidden="true"><i style="width:${Math.max(pct, running ? 8 : 0)}%"></i></div>
        <ul class="agent-steps">${stepsHtml}</ul>
        ${sqlBlock}
        ${hitl}`;
      const processBlock = (running || awaiting)
        ? processBody
        : `<details class="agent-process" ${state.forceOpen ? "open" : ""}>
            <summary>思考过程 · ${done}/${steps.length} 步</summary>
            ${processBody}
          </details>`;
      return `<div class="agent-card ${cardClass}">
        <div class="agent-head">
          <span class="agent-mark" aria-hidden="true">⬡</span>
          <span>活动</span>
          <span class="agent-count">${done}/${steps.length} 步</span>
          <span class="agent-live ${liveClass}">${live}</span>
        </div>
        ${processBlock}
      </div>`;
    }

    function setStep(steps, id, status, detail) {
      const s = steps.find((x) => x.id === id);
      if (!s) return;
      s.status = status;
      if (detail != null) s.detail = detail;
    }

    function advanceRunning(steps, nextId) {
      steps.forEach((s) => {
        if (s.status === "running") s.status = "success";
      });
      if (nextId) setStep(steps, nextId, "running", "");
    }

    function appendBubble(role, text, meta, opts) {
      const welcome = $("welcome");
      if (welcome) welcome.remove();
      const wrap = document.createElement("div");
      wrap.className = "msg-row " + (role === "user" ? "user" : "assistant");
      const msgId = (opts && opts.id) || "";
      if (msgId) wrap.dataset.msgId = msgId;
      const m = meta || {};
      const avatar = role === "user" ? "你" : "AI";
      if (role === "user") {
        const actions = msgId
          ? `<div class="message-actions message-actions-user">
              <button type="button" class="msg-action-btn" data-act="copy">复制</button>
              <button type="button" class="msg-action-btn" data-act="edit" ${asking ? "disabled" : ""}>编辑</button>
              <button type="button" class="msg-action-btn" data-act="withdraw" ${asking ? "disabled" : ""}>撤回</button>
              <button type="button" class="msg-action-btn" data-act="regen" ${asking ? "disabled" : ""}>重新生成</button>
            </div>`
          : "";
        wrap.innerHTML = `<div class="msg-avatar" aria-hidden="true">${avatar}</div>
          <div class="msg-body">
            <div class="role">你</div>
            <div class="bubble">${escapeHtml(text || "")}</div>
            ${actions}
          </div>`;
      } else {
        const state = {
          steps: m.steps || buildStepsFromMeta(m),
          tables: m.tables || [],
          sql: m.sql || "",
          source: m.source || "",
          checkpoint: !!m.checkpoint,
          executed: !!m.executed,
          running: !!m.running,
        };
        const showCard = state.steps.length || state.sql || state.checkpoint || state.running;
        const bubble = text ? `<div class="bubble">${escapeHtml(text)}</div>` : "";
        const copyAns = (!m.running && text)
          ? `<div class="message-actions"><button type="button" class="msg-action-btn" data-act="copy">复制</button></div>`
          : "";
        wrap.innerHTML = `<div class="msg-avatar" aria-hidden="true">${avatar}</div>
          <div class="msg-body">
            <div class="role">助手</div>
            ${showCard ? renderAgentCard(state) : ""}
            ${bubble}
            ${copyAns}
          </div>`;
        if (m.rows && m.rows.length) {
          const box = document.createElement("div");
          box.className = "result-wrap";
          box.appendChild(buildTable(m.rows));
          wrap.querySelector(".msg-body").appendChild(box);
        }
        const details = Array.isArray(m.field_details) ? m.field_details : [];
        if (details.length && m.executed && !m.checkpoint) {
          wrap.querySelector(".msg-body").appendChild(buildFieldDetails(details));
        }
        if (m.executed && !m.checkpoint && !m.running && text) {
          wrap.querySelector(".msg-body").appendChild(buildFeedbackRow(msgId, m));
        }
      }
      $("thread").appendChild(wrap);
      bindMsgActions(wrap, role, text, m, msgId);
      $("thread").scrollTop = $("thread").scrollHeight;
      return wrap;
    }

    function paintLive(wrap, state) {
      if (!wrap) return;
      const body = wrap.querySelector(".msg-body");
      if (!body) return;
      const bubble = body.querySelector(".bubble");
      const bubbleHtml = bubble ? bubble.outerHTML : "";
      const result = body.querySelector(".result-wrap");
      const roleEl = body.querySelector(".role");
      const roleHtml = roleEl ? roleEl.outerHTML : "<div class=\"role\">助手</div>";
      body.innerHTML = `${roleHtml}${renderAgentCard(state)}${bubbleHtml}`;
      if (result) body.appendChild(result);
      bindMsgActions(wrap, "assistant", "", { sql: state.sql }, "");
      $("thread").scrollTop = $("thread").scrollHeight;
    }

    function removeCheckpointCards() {
      $("thread").querySelectorAll(".msg-row.assistant").forEach((el) => {
        if (el.querySelector(".hitl") || el.querySelector(".agent-live.is-await")) el.remove();
      });
    }

    function buildTable(rows) {
      const el = document.createElement("table");
      const keys = Object.keys(rows[0] || {});
      el.innerHTML = `<thead><tr>${keys.map((k) => `<th>${escapeHtml(k)}</th>`).join("")}</tr></thead>` +
        `<tbody>${rows.map((r) => `<tr>${keys.map((k) => `<td>${escapeHtml(r[k])}</td>`).join("")}</tr>`).join("")}</tbody>`;
      return el;
    }

    function buildFieldDetails(details) {
      const el = document.createElement("div");
      el.className = "field-details";
      const items = (details || []).map((d) => {
        const label = escapeHtml(d.label || d.comment || d.column || "");
        const col = escapeHtml(d.column || "");
        const cmt = escapeHtml(d.comment || d.label || "");
        const table = d.table ? ` · <code>${escapeHtml(d.table)}</code>` : "";
        return `<li><strong>${label}</strong>：${cmt}${col && col !== label ? ` <code>${col}</code>` : ""}${table}</li>`;
      }).join("");
      el.innerHTML = `<h4>字段说明</h4><ul>${items}</ul><p class="legend" style="margin-top:6px">仅展示与本次问句相关的列，不铺开全部字段。</p>`;
      return el;
    }

    function loadFeedbackMap() {
      try {
        feedbackByMsg = JSON.parse(localStorage.getItem(FEEDBACK_KEY + ":" + sessionId) || "{}") || {};
      } catch {
        feedbackByMsg = {};
      }
    }

    function saveFeedbackMap() {
      try {
        localStorage.setItem(FEEDBACK_KEY + ":" + sessionId, JSON.stringify(feedbackByMsg || {}));
      } catch {}
    }

    function buildFeedbackRow(msgId, meta) {
      const el = document.createElement("div");
      el.className = "feedback-row";
      const key = String(msgId || meta.pending_id || meta.sql || lastQuestion || "").slice(0, 120);
      const sent = feedbackByMsg[key];
      if (sent === 1 || sent === -1) {
        el.innerHTML = `<p class="feedback-ack">${sent === 1 ? "已标记为有用 · 感谢反馈" : "已标记为无用 · 已记入学习影子"}</p>`;
        return el;
      }
      el.innerHTML = `<span>这轮回复有帮助吗？</span>
        <button type="button" class="fb" data-fb="1">有用</button>
        <button type="button" class="fb fb-neg" data-fb="-1">无用</button>`;
      el.querySelectorAll("[data-fb]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const score = Number(btn.getAttribute("data-fb"));
          el.querySelectorAll("button").forEach((b) => { b.disabled = true; });
          const res = await api("/api/feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              question: lastQuestion || "（未知问句）",
              score,
              tenant: $("tenant").value,
              session_id: sessionId,
              message_id: String(msgId || "").trim(),
              sql: (meta && meta.sql) || lastSql || "",
              tables: (meta && meta.tables) || [],
            }),
          });
          const body = await res.json().catch(() => ({}));
          if (res.ok && body.ok) {
            feedbackByMsg[key] = score;
            saveFeedbackMap();
            el.innerHTML = `<p class="feedback-ack">${escapeHtml(body.ack || (score === 1 ? "已标记为有用" : "已标记为无用"))}</p>`;
          } else {
            el.querySelectorAll("button").forEach((b) => { b.disabled = false; });
            el.insertAdjacentHTML("beforeend", `<span style="color:#9a3412">反馈失败</span>`);
          }
        });
      });
      return el;
    }

    async function refreshAudit() {
      const data = await api("/api/audit?limit=20").then((r) => r.json()).catch(() => ({ items: [] }));
      $("auditList").innerHTML = (data.items || []).map((it) => `
        <div class="audit-item">
          <div class="q">${escapeHtml((it.question || "").slice(0, 72) || "（无问句）")}</div>
          <span class="badge ${it.executed ? "ok" : "warn"}">${it.executed ? "已执行" : "仅预览"} · ${it.row_count || 0} 行</span>
          <code>${escapeHtml(it.sql || "（尚无 SQL）")}</code>
        </div>`).join("") || "<p class='legend'>还没有记录。</p>";
    }

    $("newChat").addEventListener("click", async () => {
      sessionId = "";
      localStorage.removeItem(SESSION_KEY);
      await ensureSession();
      await refreshSessions();
      await loadThread();
    });

    bindChips(document);

    function setCost(c) {
      if (!c) return;
      $("cLlm").textContent = c.llm_calls ?? 0;
      $("cEmb").textContent = c.embed_calls ?? 0;
      $("cAns").textContent = c.answer_calls ?? 0;
      $("cMs").textContent = c.elapsed_ms ?? 0;
    }

    async function readSSE(res, onEvent) {
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const chunks = buf.split("\n\n");
        buf = chunks.pop();
        for (const block of chunks) {
          let ev = "message", data = "";
          for (const line of block.split("\n")) {
            if (line.startsWith("event:")) ev = line.slice(6).trim();
            if (line.startsWith("data:")) data += line.slice(5).trim();
          }
          if (data) onEvent(ev, JSON.parse(data));
        }
      }
    }

    async function ask(payload, { userText } = {}) {
      if (asking) return;
      asking = true;
      const isConfirm = !!(payload.confirm || payload.pending_id);
      const keepPending = isConfirm ? pendingId : "";
      const keepSql = isConfirm ? lastSql : "";
      if (!isConfirm) {
        pendingId = "";
        lastSql = "";
      }
      $("go").disabled = true;
      document.querySelectorAll(".msg-action-btn").forEach((b) => { b.disabled = true; });
      try {
      if (userText && !isConfirm) {
        lastQuestion = userText;
        appendBubble("user", userText, {});
      }
      if (isConfirm) removeCheckpointCards();
      const steps = defaultSteps(isConfirm ? "execute" : "preview");
      setStep(steps, "retrieve", "running", isConfirm ? "沿用预览上下文…" : "正在检索目录…");
      const liveState = {
        steps,
        tables: [],
        sql: keepSql || "",
        source: isConfirm ? "pending" : "",
        checkpoint: false,
        running: true,
      };
      liveCard = appendBubble("assistant", "", { running: true, steps, tables: [], sql: keepSql || "" });
      paintLive(liveCard, liveState);

      const res = await api("/api/ask/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          ...payload,
          session_id: sessionId,
          pending_id: payload.pending_id || keepPending || "",
          sql: payload.sql || keepSql || "",
        }),
      });
      if (!res.ok) {
        const body = liveCard && liveCard.querySelector(".msg-body");
        if (body) body.innerHTML = `<div class="role">助手</div><div class="bubble">请求失败 ${res.status}</div>`;
        return;
      }
      let tables = [];
      let rows = [];
      let source = "";
      let intent = "";
      let reason = "";
      let guardOk = null;
      let executed = false;
      let repair = false;
      let execError = "";
      let streamError = false;
      await readSSE(res, (_, ev) => {
        if (ev.event === "retrieve") {
          tables = ev.tables || [];
          liveState.tables = tables;
          setStep(steps, "retrieve", "success", tables.length ? `命中 ${tables.length} 张表` : "未命中表");
          advanceRunning(steps, "understand");
          setStep(steps, "understand", "running", "正在理解问题…");
          paintLive(liveCard, liveState);
        }
        if (ev.event === "understand") {
          intent = ev.intent || "";
          reason = ev.reason || "";
          if (ev.tables && ev.tables.length) {
            tables = ev.tables;
            liveState.tables = tables;
          }
          setStep(steps, "understand", "success", [intent, reason].filter(Boolean).join(" · ") || "已完成");
          advanceRunning(steps, "sql");
          setStep(steps, "sql", "running", "正在生成 SQL…");
          paintLive(liveCard, liveState);
        }
        if (ev.event === "sql") {
          lastSql = ev.sql || "";
          source = ev.source || "";
          liveState.sql = lastSql;
          liveState.source = source;
          $("cSrc").textContent = source || "—";
          const und = steps.find((x) => x.id === "understand");
          if (und && (und.status === "running" || und.status === "pending")) {
            setStep(steps, "understand", "success", isConfirm ? "沿用预览上下文" : "已就绪");
          }
          setStep(steps, "sql", lastSql ? "success" : "failed", sourceLabel(source));
          advanceRunning(steps, "guard");
          setStep(steps, "guard", "running", "检查只读与限额…");
          paintLive(liveCard, liveState);
        }
        if (ev.event === "guard") {
          guardOk = !!ev.ok;
          if (ev.sql) {
            lastSql = ev.sql;
            liveState.sql = lastSql;
          }
          if (ev.tables && ev.tables.length) {
            tables = ev.tables;
            liveState.tables = tables;
          }
          setStep(steps, "guard", ev.ok ? "success" : "failed", ev.reason_text || ev.reason || "");
          if (ev.ok) {
            if (isConfirm) {
              advanceRunning(steps, "execute");
              setStep(steps, "execute", "running", "正在查库…");
            } else {
              advanceRunning(steps, "checkpoint");
              setStep(steps, "checkpoint", "running", "准备确认闸门…");
            }
          }
          paintLive(liveCard, liveState);
        }
        if (ev.event === "checkpoint") {
          pendingId = ev.pending_id || "";
          if (ev.sql) {
            lastSql = ev.sql;
            liveState.sql = lastSql;
          }
          setStep(steps, "checkpoint", "await", "等待你确认后再执行");
          liveState.checkpoint = true;
          liveState.running = false;
          paintLive(liveCard, liveState);
        }
        if (ev.event === "repair") {
          repair = true;
          if (ev.sql) {
            lastSql = ev.sql;
            liveState.sql = lastSql;
          }
          setStep(steps, "sql", "success", (sourceLabel(source) + " · 执行失败后已修复").trim());
          setStep(steps, "execute", "running", "用修复后的 SQL 重试…");
          paintLive(liveCard, liveState);
        }
        if (ev.event === "execute") {
          executed = !!ev.ok;
          execError = ev.error || "";
          $("cRows").textContent = ev.row_count ?? "—";
          setStep(steps, "execute", ev.ok ? "success" : "failed",
            ev.ok ? `${ev.row_count || 0} 行` : (ev.error || "执行失败"));
          if (ev.ok) {
            advanceRunning(steps, "answer");
            setStep(steps, "answer", "running", "正在整理回复…");
          }
          paintLive(liveCard, liveState);
        }
        if (ev.event === "answer") {
          const meta = {
            sql: ev.sql || lastSql,
            tables,
            source,
            intent,
            reason,
            guard_ok: guardOk,
            executed: executed || (!!ev.rows && ev.rows.length > 0),
            repair,
            error: execError || (ev.error_code && ev.error_code !== "needs_clarify" ? (ev.text || ev.error_code) : ""),
            checkpoint: ev.checkpoint,
            pending_id: ev.pending_id,
            rows: ev.rows || [],
            row_count: (ev.rows || []).length || (ev.cost && 0),
            cost: ev.cost,
            error_code: ev.error_code || "",
          };
          if (typeof ev.row_count === "number") meta.row_count = ev.row_count;
          else meta.row_count = (ev.rows || []).length;
          lastSql = meta.sql;
          pendingId = ev.checkpoint ? (ev.pending_id || "") : "";
          rows = ev.rows || [];
          if (ev.error_code && ev.error_code !== "needs_clarify" && !ev.checkpoint) {
            streamError = true;
            if (liveCard) {
              liveCard.innerHTML = `<div class="role">助手</div><div class="bubble">${escapeHtml(ev.text || "处理失败")}</div>`;
            }
            setCost(ev.cost);
            return;
          }
          liveCard.remove();
          // 统一从会话重载，拿到 message id（复制/编辑/撤回）并合并确认轮
          setCost(ev.cost);
        }
      });
      if (!streamError) {
      await loadThread();
      await refreshSessions();
      await refreshAudit();
      }
      if (rows.length) $("cRows").textContent = rows.length;
      } catch (err) {
        if (liveCard) {
          const body = liveCard.querySelector(".msg-body");
          if (body) body.innerHTML = `<div class="role">助手</div><div class="bubble">请求异常：${escapeHtml(String(err && err.message || err))}</div>`;
        }
      } finally {
        $("go").disabled = false;
        asking = false;
      }
    }

    async function promoteGolden(meta, btn) {
      const q = String(lastQuestion || "").trim();
      const sql = String((meta && meta.sql) || lastSql || "").trim();
      if (!q || !sql || asking) return;
      if (btn) btn.disabled = true;
      const res = await api("/api/golden", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          question: q,
          sql,
          tenant: $("tenant").value,
          scene: $("scene").value,
          tables: (meta && meta.tables) || [],
        }),
      });
      const body = await res.json().catch(() => ({}));
      if (btn) {
        btn.disabled = false;
        btn.textContent = (res.ok && body.ok) ? (body.deduped ? "已在黄金中" : "已收入") : "收入失败";
        setTimeout(() => { btn.textContent = "收入黄金"; }, 1600);
      }
    }

    async function confirmExec() {
      if (!pendingId || asking) return;
      await ask({
        question: $("q").value.trim() || "确认执行",
        tenant: $("tenant").value,
        scene: $("scene").value,
        pending_id: pendingId,
        sql: lastSql,
        confirm: true,
      });
    }

    $("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const q = $("q").value.trim();
      if (q.length > maxQuestion) return;
      ask({
        question: q,
        tenant: $("tenant").value,
        scene: $("scene").value,
        confirm: false,
      }, { userText: q });
      $("q").value = "";
      $("q").style.height = "auto";
    });

    const qInput = $("q");
    qInput.addEventListener("input", () => {
      qInput.style.height = "auto";
      qInput.style.height = Math.min(qInput.scrollHeight, 160) + "px";
    });
    boot().catch((err) => {
      const msg = String(err && err.message || err);
      if (/login_required|invalid_user_token|jwt_/i.test(msg)) {
        showLogin(msg === "login_required" ? "请先登录" : "登录已失效，请重新登录");
        return;
      }
      $("catalogStatus").textContent = "无法连接 API：" + err;
    });
    showWelcome();
  </script>
</body>
</html>
