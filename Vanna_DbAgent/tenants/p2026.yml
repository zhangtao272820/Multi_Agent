id: p2026
title: 智慧养老实训本地库（与 DB_Agent 同库）
mysql:
  host: ${P2026_MYSQL_HOST}
  port: ${P2026_MYSQL_PORT}
  user: ${P2026_MYSQL_USER}
  password_env: P2026_MYSQL_PASSWORD
  database: p2026
# 与 DB_Agent domain p2026 对齐的业务前缀；排除 gen_/工作流/杂日志
table_whitelist_prefixes:
  - person_
  - remote_
  - elderly_
  - bed_
  - floor_
  - org_
  - monitor_
  - teaching_
  - cultivate_
  - device_
  - iot_
  # Agent 动手写库沙箱表（HITL 演示；勿放业务正式表）
  - agent_hands_
table_whitelist:
  - sys_user
  - sys_role
  - sys_dept
  - sys_department
  - sys_menu
# 可选写库账号（未配则写路径回退 mysql；生产建议单独最小权限）
# mysql_write:
#   host: ${P2026_MYSQL_HOST}
#   port: ${P2026_MYSQL_PORT}
#   user: ${P2026_MYSQL_WRITE_USER}
#   password_env: P2026_MYSQL_WRITE_PASSWORD
#   database: p2026
skip_list_tables:
  - device_command_temp
  - formcollectionobject
  - formdesignoptions
  - dify_knowledge_doc
  - dify_knowledge_doc_segment
  - dify_knowledge_type
